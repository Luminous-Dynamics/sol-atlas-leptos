[package]
name = "energy-dispatch-profile-runner"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"
description = "Source-bound profiler for Sol Atlas's bounded exact energy dispatcher"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
sol-atlas-core = { path = "../../sol-atlas-core" }

[[bin]]
name = "energy-dispatch-profile"
path = "src/main.rs"

[[bin]]
name = "energy-dispatch-anytime-profile"
path = "src/bin/energy-dispatch-anytime-profile.rs"
