[package]
name = "built-environment-coverage-auditor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Fail-closed runtime verifier for declared-scope dependency coverage manifests"

[[bin]]
name = "built-environment-coverage-audit"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false }
