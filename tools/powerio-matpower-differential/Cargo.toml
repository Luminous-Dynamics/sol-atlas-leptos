[package]
name = "powerio-matpower-differential"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Independent PowerIO 0.12.1 field comparison for source-bound MATPOWER projections"

[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "powerio-matpower-differential"
path = "src/main.rs"

[dependencies]
pglib-case-auditor = { path = "../pglib-case-auditor" }
powerio = { version = "=0.12.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
