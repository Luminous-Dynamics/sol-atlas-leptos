name: GMD protection envelope verifier

on:
  pull_request:
    paths:
      - "tools/gmd-protection-envelope-verifier/**"
      - "docs/research/gmd-ibr-protection/**"
      - ".github/workflows/gmd-protection-envelope-verifier.yml"
  push:
    paths:
      - "tools/gmd-protection-envelope-verifier/**"
      - "docs/research/gmd-ibr-protection/**"
      - ".github/workflows/gmd-protection-envelope-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmd-protection-envelope-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format verifier
        run: cargo fmt --manifest-path tools/gmd-protection-envelope-verifier/Cargo.toml -- --check
      - name: Run locked Clippy
        run: cargo clippy --manifest-path tools/gmd-protection-envelope-verifier/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run locked tests
        run: cargo test --manifest-path tools/gmd-protection-envelope-verifier/Cargo.toml --locked
      - name: Verify frozen synthetic corpus
        run: |
          cargo run --manifest-path tools/gmd-protection-envelope-verifier/Cargo.toml --locked -- \
            docs/research/gmd-ibr-protection/fixtures/gmd_protection_envelope_corpus_v0_1.json \
            > /tmp/gmd-protection-envelope-report.json
          grep -q '"certified_cell_count": 1' /tmp/gmd-protection-envelope-report.json
          grep -q '"excluded_cell_count": 2' /tmp/gmd-protection-envelope-report.json
          grep -q '"unknown_cell_count": 2' /tmp/gmd-protection-envelope-report.json
