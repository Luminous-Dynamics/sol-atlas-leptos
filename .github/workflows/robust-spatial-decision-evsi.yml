name: Robust Spatial Decision EVSI Reference

on:
  pull_request:
    paths:
      - "benchmarks/robust-spatial-decision-evsi/**"
      - ".github/workflows/robust-spatial-decision-evsi.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/robust-spatial-decision-evsi/**"
      - ".github/workflows/robust-spatial-decision-evsi.yml"

permissions:
  contents: read

jobs:
  robust-spatial-decision-evsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate schema and frozen fixture
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          base = Path("benchmarks/robust-spatial-decision-evsi/v0.1")
          schema = json.loads((base / "schemas/robust-decision-case.schema.json").read_text())
          fixture = json.loads((base / "fixtures/robust-decision-case.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(fixture),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              for error in errors:
                  print(f"INVALID: {list(error.absolute_path)}: {error.message}")
              raise SystemExit(1)
          print("VALID: robust spatial decision-EVSI schema and fixture")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/robust-spatial-decision-evsi/v0.1/reference/Cargo.toml -- --check

      - name: Run exact tests and negative controls
        run: cargo test --manifest-path benchmarks/robust-spatial-decision-evsi/v0.1/reference/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --manifest-path benchmarks/robust-spatial-decision-evsi/v0.1/reference/Cargo.toml --all-targets -- -D warnings

      - name: Execute robust EVSI oracle
        run: |
          cargo run --manifest-path benchmarks/robust-spatial-decision-evsi/v0.1/reference/Cargo.toml -- \
            benchmarks/robust-spatial-decision-evsi/v0.1/fixtures/robust-decision-case.json \
            > /tmp/robust-spatial-decision-evsi.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/robust-spatial-decision-evsi.json").read_text())
          assert report["fixtureStatus"] == "synthetic"
          assert report["scenarioCount"] == 3
          assert len(report["totalVariationDROPolicies"]) == 6
          assert len(report["lowerTailCvarPolicies"]) == 4
          print("VALID: robust EVSI decision oracle")
          PY
