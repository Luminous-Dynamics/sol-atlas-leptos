name: Workforce source robustness verifier

on:
  pull_request:
    paths:
      - "docs/research/WORKFORCE-SOURCE-ROBUSTNESS-001.md"
      - "docs/research/fixtures/workforce_source_robustness_v0_1.json"
      - "docs/research/schemas/workforce_source_robustness_v0_1.schema.json"
      - "tools/workforce-source-robustness-verifier/**"
      - ".github/workflows/workforce-source-robustness-verifier.yml"
  push:
    branches:
      - main
      - research/workforce-source-robustness-001
    paths:
      - "docs/research/WORKFORCE-SOURCE-ROBUSTNESS-001.md"
      - "docs/research/fixtures/workforce_source_robustness_v0_1.json"
      - "docs/research/schemas/workforce_source_robustness_v0_1.schema.json"
      - "tools/workforce-source-robustness-verifier/**"
      - ".github/workflows/workforce-source-robustness-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-source-robustness-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/workforce-source-robustness-verifier/Cargo.toml -- --check
      - name: Run source-robustness tests
        run: cargo test --manifest-path tools/workforce-source-robustness-verifier/Cargo.toml
      - name: Produce source-robustness receipt
        run: cargo run --manifest-path tools/workforce-source-robustness-verifier/Cargo.toml -- docs/research/fixtures/workforce_source_robustness_v0_1.json docs/research/schemas/workforce_source_robustness_v0_1.schema.json
