name: DC PTDF LODF outage screen

on:
  pull_request:
    paths:
      - "tools/dc-power-flow-reference/**"
      - "tools/dc-lodf-outage-screen/**"
      - "tools/pglib-case-auditor/**"
      - "tools/dc-power-flow-independent-auditor/**"
      - "tools/dc-fixed-injection-contingency-sweep/**"
      - "tools/matpower-dc-network-evaluation/**"
      - ".github/workflows/dc-lodf-outage-screen.yml"
  push:
    paths:
      - "tools/dc-power-flow-reference/**"
      - "tools/dc-lodf-outage-screen/**"
      - "tools/pglib-case-auditor/**"
      - "tools/dc-power-flow-independent-auditor/**"
      - "tools/dc-fixed-injection-contingency-sweep/**"
      - "tools/matpower-dc-network-evaluation/**"
      - ".github/workflows/dc-lodf-outage-screen.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dc-lodf-outage-screen
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Strict formatting
        run: |
          cargo fmt --manifest-path tools/dc-power-flow-reference/Cargo.toml -- --check
          cargo fmt --manifest-path tools/dc-lodf-outage-screen/Cargo.toml -- --check
          cargo fmt --manifest-path tools/pglib-case-auditor/Cargo.toml -- --check
          cargo fmt --manifest-path tools/matpower-dc-network-evaluation/Cargo.toml -- --check
      - name: Locked offline unit and PGLib integration tests
        run: |
          cargo test --manifest-path tools/dc-power-flow-reference/Cargo.toml --locked --offline
          cargo test --manifest-path tools/dc-lodf-outage-screen/Cargo.toml --locked --offline
          cargo test --manifest-path tools/pglib-case-auditor/Cargo.toml --locked --offline
          cargo test --manifest-path tools/matpower-dc-network-evaluation/Cargo.toml --locked --offline
      - name: Build source-bound LODF CLI
        run: cargo build --manifest-path tools/matpower-dc-network-evaluation/Cargo.toml --locked --offline --bin matpower-dc-lodf-screen
      - name: Emit and parse PGLib LODF screening receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dc-lodf-screens
          for case in \
            tools/pglib-case-auditor/fixtures/pglib_opf_case14_ieee.m \
            tools/pglib-case-auditor/fixtures/pglib_opf_case24_ieee_rts.m \
            tools/pglib-case-auditor/fixtures/pglib_opf_case57_ieee.m; do
            name="$(basename "$case" .m)"
            tools/matpower-dc-network-evaluation/target/debug/matpower-dc-lodf-screen \
              "$case" | tee "artifacts/dc-lodf-screens/$name.json" \
              | jq -e '.screen.summary.coverage_complete == true'
          done
      - name: Strict Clippy
        run: |
          cargo clippy --manifest-path tools/dc-lodf-outage-screen/Cargo.toml --locked --offline --all-targets -- -D warnings
          cargo clippy --manifest-path tools/matpower-dc-network-evaluation/Cargo.toml --locked --offline --all-targets -- -D warnings
      - name: Publish screening receipts
        uses: actions/upload-artifact@v4
        with:
          name: dc-lodf-screen-receipts
          path: artifacts/dc-lodf-screens/
          if-no-files-found: error
