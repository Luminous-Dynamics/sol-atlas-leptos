# One-time repair only; remove after formatting has been committed and verified.
name: One-time Rust formatting repair

on:
  push:
    branches:
      - docs/economic-intelligence-atlas-mvp-20261012
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/economic-intelligence-atlas-mvp-20261012
      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace and commit formatting-only changes
        shell: bash
        run: |
          cargo fmt --all
          if git diff --quiet; then
            echo "Workspace already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply rustfmt to workspace"
          git push origin HEAD:docs/economic-intelligence-atlas-mvp-20261012
