name: City Product Chain Synthetic Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/city-product-chain-bench/**"
      - "docs/research/city-product-chain/**"
      - ".github/workflows/city-product-chain-oracle.yml"
  push:
    branches: ["main", "research/city-product-chain-v0.1"]
    paths:
      - "tools/city-product-chain-bench/**"
      - "docs/research/city-product-chain/**"
      - ".github/workflows/city-product-chain-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-product-chain-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-chain-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/city-product-chain-bench/Cargo.toml --all -- --check
      - name: Run receipt-chain and hostile-control tests
        run: cargo test --locked --manifest-path tools/city-product-chain-bench/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/city-product-chain-bench/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact-head product-chain receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/city-product-chain-bench/Cargo.toml -- \
            docs/research/city-product-chain/CITY_PRODUCT_CHAIN_CORPUS_V0_1.json \
            --source-commit "$source_commit" > city-product-chain-receipt.json
          jq -e '
            .result == "pass"
            and .corpus_id == "CITY-PRODUCT-CHAIN-CORPUS-V0.1"
            and .corpus_classification == "synthetic_fixture_only"
            and .scenario_count == 24
            and .failure_count == 0
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | length == 24)
            and (.scenarios | all(.status == "pass"))
          ' city-product-chain-receipt.json
      - name: Upload exact-head product-chain receipt
        uses: actions/upload-artifact@v4
        with:
          name: city-product-chain-reference-receipt
          path: city-product-chain-receipt.json
          if-no-files-found: error
          retention-days: 90
