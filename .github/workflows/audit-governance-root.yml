name: Audit GitHub governance root

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit main governance ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify workflow action pins
        run: python3 scripts/verify_github_actions_pins.py

      - name: Audit GitHub governance root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/verify_github_governance_root.py \
            --output artifacts/github-governance-root-audit.json

      - name: Upload governance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sol-atlas-github-governance-root-audit
          path: artifacts/github-governance-root-audit.json
          if-no-files-found: warn
          retention-days: 30
