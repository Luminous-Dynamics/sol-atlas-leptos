name: Industry assurance contract

on:
  pull_request:
    paths:
      - "tools/industry-assurance-validator/**"
      - "tools/industry-risk-control-selector/**"
      - "schemas/ieac-risk-control-policy-v0.2.schema.json"
      - "schemas/ieac-risk-control-policy-v0.2.json"
      - "schemas/ieac-risk-control-selection-report-v0.1.schema.json"
      - "schemas/ieac-risk-control-truth-table-v0.2.schema.json"
      - "schemas/examples/ieac-risk-control-truth-table-synthetic-v0.2.json"
      - "docs/industry/IEAC_RISK_CONTROL_SELECTOR_V0.1.md"
      - "schemas/industry-assurance-qualification-profile-v0.1.schema.json"
      - "schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json"
      - "schemas/examples/industry-assurance-water-food-energy-profile-synthetic-v0.1.json"
      - "schemas/examples/industry-assurance-maintenance-profile-synthetic-v0.1.json"
      - "schemas/industry-assurance-validation-report-v0.1.schema.json"
      - "schemas/examples/industry-assurance-validation-report-synthetic-v0.1.json"
      - "docs/industry/INDUSTRY_ENGINEERING_ASSURANCE_CONTRACT_V0.1.md"
      - "docs/industry/INDUSTRIAL_BENCHMARK_ASSURANCE_PROTOCOL_V0.1.md"
      - ".github/workflows/industry-assurance-contract.yml"
  push:
    branches:
      - main
      - research/ind-assurance-001-risk-weighted-qualification
      - feat/ieac-risk-control-selector-v0-1
    paths:
      - "tools/industry-assurance-validator/**"
      - "tools/industry-risk-control-selector/**"
      - "schemas/ieac-risk-control-policy-v0.2.schema.json"
      - "schemas/ieac-risk-control-policy-v0.2.json"
      - "schemas/ieac-risk-control-selection-report-v0.1.schema.json"
      - "schemas/ieac-risk-control-truth-table-v0.2.schema.json"
      - "schemas/examples/ieac-risk-control-truth-table-synthetic-v0.2.json"
      - "docs/industry/IEAC_RISK_CONTROL_SELECTOR_V0.1.md"
      - "schemas/industry-assurance-qualification-profile-v0.1.schema.json"
      - "schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json"
      - "schemas/examples/industry-assurance-water-food-energy-profile-synthetic-v0.1.json"
      - "schemas/examples/industry-assurance-maintenance-profile-synthetic-v0.1.json"
      - "schemas/industry-assurance-validation-report-v0.1.schema.json"
      - "schemas/examples/industry-assurance-validation-report-synthetic-v0.1.json"
      - ".github/workflows/industry-assurance-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: industry-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Rust assurance validator (not physical qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path tools/industry-assurance-validator/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path tools/industry-assurance-validator/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run adversarial semantic contract tests
        run: cargo test --manifest-path tools/industry-assurance-validator/Cargo.toml --locked

      - name: Validate all three synthetic vertical profiles
        run: |
          set -euo pipefail
          for profile in \
            schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json \
            schemas/examples/industry-assurance-water-food-energy-profile-synthetic-v0.1.json \
            schemas/examples/industry-assurance-maintenance-profile-synthetic-v0.1.json; do
            report="$RUNNER_TEMP/$(basename "$profile").report.json"
            cargo run --manifest-path tools/industry-assurance-validator/Cargo.toml --locked -- "$profile" "$report"
            jq -e '
              .contract_valid == true and
              .status == "PROFILE_CONTRACT_VALID_NOT_QUALIFIED" and
              .declared_disposition == "indeterminate" and
              .independent_qualification_attested == false and
              .issue_count == 0
            ' "$report"
          done

      - name: Check generated report never attests qualification
        run: |
          jq -e '
            .schema_version == "luminous.industry-assurance-validation-report.v0.1" and
            .contract_valid == true and
            .status == "PROFILE_CONTRACT_VALID_NOT_QUALIFIED" and
            .independent_qualification_attested == false and
            .issue_count == 0
          ' schemas/examples/industry-assurance-validation-report-synthetic-v0.1.json

      - name: Check risk-control selector formatting
        run: cargo fmt --manifest-path tools/industry-risk-control-selector/Cargo.toml -- --check

      - name: Run risk-control selector Clippy with warnings denied
        run: cargo clippy --manifest-path tools/industry-risk-control-selector/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run monotonicity and adversarial risk-selector tests
        run: cargo test --manifest-path tools/industry-risk-control-selector/Cargo.toml --locked

      - name: Replay synthetic risk-to-control selection
        env:
          IEAC_SELECTOR_BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          profile=schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json
          policy=schemas/ieac-risk-control-policy-v0.2.json
          profile_sha="$(sha256sum "$profile" | awk '{print $1}')"
          policy_sha="$(sha256sum "$policy" | awk '{print $1}')"
          cargo run --manifest-path tools/industry-risk-control-selector/Cargo.toml --locked -- \
            "$profile" "$policy" "$RUNNER_TEMP/ieac-risk-control-report.json"
          jq -e --arg build "$GITHUB_SHA" --arg profile_sha "$profile_sha" --arg policy_sha "$policy_sha" '
            .schema_version == "luminous.ieac-risk-control-selection-report.v0.1" and
            .input_profile_sha256 == $profile_sha and
            .policy_sha256 == $policy_sha and
            .selector_version == "0.2.0" and
            .selector_build_id == $build and
            .decision_tier == "D1_advisory" and
            (.required_controls | length >= 10) and
            ([.required_controls[].reason_codes[]] | length > 0) and
            .independent_qualification_attested == false and
            .action_authority == "none"
          ' "$RUNNER_TEMP/ieac-risk-control-report.json"

  schema-conformance:
    name: Draft 2020-12 schema and differential negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust for pinned schema CLI
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Rust JSON Schema CLI
        run: cargo install --locked jsonschema-cli --version 0.60.2 --root "$RUNNER_TEMP/jsonschema-cli"

      - name: Add JSON Schema CLI to PATH
        run: echo "$RUNNER_TEMP/jsonschema-cli/bin" >> "$GITHUB_PATH"

      - name: Validate the risk-control policy and selector report schemas
        run: |
          set -euo pipefail
          meta=https://json-schema.org/draft/2020-12/schema
          jsonschema-cli validate --draft 2020 --assert-format "$meta" --instance schemas/ieac-risk-control-policy-v0.2.schema.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" --instance schemas/ieac-risk-control-selection-report-v0.1.schema.json
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/ieac-risk-control-policy-v0.2.schema.json --instance schemas/ieac-risk-control-policy-v0.2.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" --instance schemas/ieac-risk-control-truth-table-v0.2.schema.json
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/ieac-risk-control-truth-table-v0.2.schema.json --instance schemas/examples/ieac-risk-control-truth-table-synthetic-v0.2.json
          jq -e '
            .fixture_schema_version == "luminous.ieac-risk-control-truth-table.v0.2" and
            .fixture_status == "synthetic_only" and
            .case_count == 50 and (.cases | length == 50) and
            ([.cases[].case_id] | unique | length) == 50
          ' schemas/examples/ieac-risk-control-truth-table-synthetic-v0.2.json

      - name: Validate schemas against the Draft 2020-12 meta-schema
        run: |
          set -euo pipefail
          jsonschema-cli validate --draft 2020 --assert-format \
            https://json-schema.org/draft/2020-12/schema \
            --instance schemas/industry-assurance-qualification-profile-v0.1.schema.json
          jsonschema-cli validate --draft 2020 --assert-format \
            https://json-schema.org/draft/2020-12/schema \
            --instance schemas/industry-assurance-validation-report-v0.1.schema.json

      - name: Validate conflicted risk vocabulary and reject false qualification
        run: |
          set -euo pipefail
          source=schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json
          schema=schemas/industry-assurance-qualification-profile-v0.1.schema.json
          jq '.risk_assessment.dimensions.consequence = "conflicted"' "$source" > "$RUNNER_TEMP/conflicted-risk-profile.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" --instance "$RUNNER_TEMP/conflicted-risk-profile.json"
          jq '.risk_assessment.dimensions.consequence = "conflicted" | .disposition = "qualified_for_profile"' "$source" > "$RUNNER_TEMP/qualified-conflicted-risk-profile.json"
          if cargo run --manifest-path tools/industry-assurance-validator/Cargo.toml --locked -- "$RUNNER_TEMP/qualified-conflicted-risk-profile.json" "$RUNNER_TEMP/qualified-conflicted-risk-report.json"; then
            echo "ERROR: IEAC validator accepted a qualified profile with conflicted risk"
            exit 1
          fi
          jq -e 'any(.issues[]; .code == "QUALIFIED_WITH_CONFLICTED_RISK")' "$RUNNER_TEMP/qualified-conflicted-risk-report.json"

      - name: Validate selector report schema and conflicted-risk abstention
        env:
          IEAC_SELECTOR_BUILD_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          source=schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json
          schema=schemas/ieac-risk-control-selection-report-v0.1.schema.json
          jq '.risk_assessment.dimensions.consequence = "conflicted"' "$source" > "$RUNNER_TEMP/conflicted-selector-profile.json"
          cargo run --manifest-path tools/industry-risk-control-selector/Cargo.toml --locked -- \
            "$RUNNER_TEMP/conflicted-selector-profile.json" schemas/ieac-risk-control-policy-v0.2.json \
            "$RUNNER_TEMP/conflicted-selector-report.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" --instance "$RUNNER_TEMP/conflicted-selector-report.json"
          jq -e '.risk_assessment_state == "contains_conflicted" and .requirements_disposition == "indeterminate" and .action_authority == "none" and .independent_qualification_attested == false' "$RUNNER_TEMP/conflicted-selector-report.json"

          jq '.dimensions.fallback.human_fallback = []' schemas/ieac-risk-control-policy-v0.2.json > "$RUNNER_TEMP/non-monotone-policy.json"
          if cargo run --quiet --manifest-path tools/industry-risk-control-selector/Cargo.toml --locked -- \
            "$source" "$RUNNER_TEMP/non-monotone-policy.json" "$RUNNER_TEMP/non-monotone-report.json"; then
            echo "ERROR: selector accepted a policy that removes a fallback control at a worse risk state"
            exit 1
          fi

      - name: Validate all profile examples against the full schema
        run: |
          set -euo pipefail
          schema=schemas/industry-assurance-qualification-profile-v0.1.schema.json
          for profile in \
            schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json \
            schemas/examples/industry-assurance-water-food-energy-profile-synthetic-v0.1.json \
            schemas/examples/industry-assurance-maintenance-profile-synthetic-v0.1.json; do
            jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" --instance "$profile"
          done

      - name: Validate the report fixture against its schema
        run: |
          jsonschema-cli validate --draft 2020 --assert-format --offline \
            schemas/industry-assurance-validation-report-v0.1.schema.json \
            --instance schemas/examples/industry-assurance-validation-report-synthetic-v0.1.json

      - name: Prove unknown fields are rejected at every strict object boundary
        run: |
          set -euo pipefail
          source=schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json
          schema=schemas/industry-assurance-qualification-profile-v0.1.schema.json

          jq '.unexpected_future_field = "must reject"' "$source" > "$RUNNER_TEMP/root.json"
          jq '.claim.unexpected_future_field = "must reject"' "$source" > "$RUNNER_TEMP/claim.json"
          jq '.operating_envelope.conditions[0].unexpected_future_field = "must reject"' "$source" > "$RUNNER_TEMP/condition.json"
          jq '.risk_assessment.dimensions.unexpected_future_field = "must reject"' "$source" > "$RUNNER_TEMP/risk-dimensions.json"
          jq '.evidence_vector.software_conformance.unexpected_future_field = "must reject"' "$source" > "$RUNNER_TEMP/evidence-dimension.json"
          jq '.artifact_bindings += [{"artifact_id":"fixture-artifact","role":"fixture","evidence_class":"synthetic","rights_state":"unknown","unexpected_future_field":"must reject"}]' "$source" > "$RUNNER_TEMP/artifact.json"
          jq '.authority.unexpected_future_field = "must reject"' "$source" > "$RUNNER_TEMP/authority.json"
          jq '.validity.unexpected_future_field = "must reject"' "$source" > "$RUNNER_TEMP/validity.json"

          for mutant in "$RUNNER_TEMP"/{root,claim,condition,risk-dimensions,evidence-dimension,artifact,authority,validity}.json; do
            if jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" --instance "$mutant"; then
              echo "ERROR: JSON Schema accepted an unknown property in $mutant"
              exit 1
            fi
          done

      - name: Check locked validator lockfile remains committed
        run: git diff --exit-code -- tools/industry-assurance-validator/Cargo.lock
