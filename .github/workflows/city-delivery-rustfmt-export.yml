name: City Delivery Rustfmt Export (temporary)

on:
  push:
    branches: ["research/city-construction-delivery-v0.1"]
    paths:
      - "tools/city-construction-delivery-bench/**"
      - ".github/workflows/city-delivery-rustfmt-export.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Format isolated delivery crate in ephemeral checkout
        run: cargo fmt --manifest-path tools/city-construction-delivery-bench/Cargo.toml --all
      - name: Commit exact pinned rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Rust sources already match pinned rustfmt output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/city-construction-delivery-bench/src
          git commit -m "style(city): apply pinned rustfmt to delivery oracle"
          git push origin "HEAD:${GITHUB_REF_NAME}"
