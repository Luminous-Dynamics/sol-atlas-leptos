name: City Restoration Outcome Bridge Synthetic Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/city-restoration-outcome-bridge-bench/**"
      - "docs/research/city-restoration-outcome-bridge/CITY_RESTORATION_OUTCOME_BRIDGE_CORPUS_V0_1.json"
      - "docs/research/city-restoration-outcome-bridge/CITY_RESTORATION_OUTCOME_BRIDGE_CORPUS_V0_1.schema.json"
      - ".github/workflows/city-restoration-outcome-bridge.yml"
  push:
    branches: ["main", "research/city-restoration-outcome-bridge-v0.1"]
    paths:
      - "tools/city-restoration-outcome-bridge-bench/**"
      - "docs/research/city-restoration-outcome-bridge/CITY_RESTORATION_OUTCOME_BRIDGE_CORPUS_V0_1.json"
      - "docs/research/city-restoration-outcome-bridge/CITY_RESTORATION_OUTCOME_BRIDGE_CORPUS_V0_1.schema.json"
      - ".github/workflows/city-restoration-outcome-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-restoration-outcome-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restoration-outcome-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check package formatting
        run: cargo fmt --manifest-path tools/city-restoration-outcome-bridge-bench/Cargo.toml --all -- --check
      - name: Run frozen 26-case known-answer and negative controls
        run: cargo test --locked --manifest-path tools/city-restoration-outcome-bridge-bench/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/city-restoration-outcome-bridge-bench/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact-head restoration outcome receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/city-restoration-outcome-bridge-bench/Cargo.toml -- \
            docs/research/city-restoration-outcome-bridge/CITY_RESTORATION_OUTCOME_BRIDGE_CORPUS_V0_1.json \
            docs/research/city-restoration-outcome-bridge/CITY_RESTORATION_OUTCOME_BRIDGE_CORPUS_V0_1.schema.json \
            --source-commit "$source_commit" > city-restoration-outcome-bridge-receipt.json
          jq -e '
            .result == "pass"
            and .corpus_id == "CITY-RESTORATION-OUTCOME-BRIDGE-CORPUS-V0.1"
            and .scenario_count == 26
            and .failure_count == 0
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.schema_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | length == 26)
            and (.scenarios | all(.status == "pass"))
            and .owner_evaluations_recomputed == false
            and .physical_measurements_performed == false
            and .professional_approval == "not_assessed"
            and .action_authority == "none"
            and .causal_effect_established == false
            and .claim_ceiling == "synthetic_service_restoration_composition_only"
          ' city-restoration-outcome-bridge-receipt.json
      - name: Upload exact-head restoration outcome receipt
        uses: actions/upload-artifact@v4
        with:
          name: city-restoration-outcome-bridge-reference-receipt
          path: city-restoration-outcome-bridge-receipt.json
          if-no-files-found: error
          retention-days: 90
