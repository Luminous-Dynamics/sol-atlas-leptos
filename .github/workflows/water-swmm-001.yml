name: Water SWMM 001 — synthetic reference run

on:
  push:
    paths:
      - "scripts/ci/swmm-synthetic-smoke.sh"
      - "sol-atlas-core/fixtures/water-engineering/s0_stormwater.inp"
      - "sol-atlas-core/fixtures/water-engineering/s0-stormwater-restricted-conduit.synthetic.json"
      - "sol-atlas-core/schemas/swmm-synthetic-run-v0.1.schema.json"
      - ".github/workflows/water-swmm-001.yml"
  pull_request:
    paths:
      - "scripts/ci/swmm-synthetic-smoke.sh"
      - "sol-atlas-core/fixtures/water-engineering/s0_stormwater.inp"
      - "sol-atlas-core/fixtures/water-engineering/s0-stormwater-restricted-conduit.synthetic.json"
      - "sol-atlas-core/schemas/swmm-synthetic-run-v0.1.schema.json"
      - ".github/workflows/water-swmm-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swmm-synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic SWMM runner shell syntax
        run: bash -n scripts/ci/swmm-synthetic-smoke.sh
      - name: Checkout pinned EPA SWMM solver source
        uses: actions/checkout@v4
        with:
          repository: USEPA/Stormwater-Management-Model
          ref: 7952ca837988b1c32f791812eccc9fd64547e093
          path: .swmm-source
      - name: Build pinned SWMM 5.2.4 CLI
        run: |
          set -euo pipefail
          mkdir -p .swmm-build/bin/Release
          cmake -S .swmm-source -B .swmm-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build .swmm-build --config Release --parallel 2
          test -x .swmm-build/bin/Release/runswmm || test -x .swmm-build/src/run/runswmm
      - name: Execute synthetic SWMM baseline and restriction candidate
        if: always()
        id: swmm_run
        continue-on-error: true
        shell: bash
        run: bash scripts/ci/swmm-synthetic-smoke.sh
      - name: Install pinned Draft 2020-12 validator
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        if: always()
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Validate SWMM input bundle and emitted run manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          cases = [
              (
                  Path("sol-atlas-core/schemas/water-engineering-bundle-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/s0-stormwater-restricted-conduit.synthetic.json"),
              )
          ]
          result_schema = Path("sol-atlas-core/schemas/swmm-synthetic-run-v0.1.schema.json")
          Draft202012Validator.check_schema(json.loads(result_schema.read_text(encoding="utf-8")))
          manifest_path = Path("artifacts/swmm-s0/swmm-synthetic-run.v0.1.json")
          if not manifest_path.exists():
              raise SystemExit("SWMM_RUN_MANIFEST_MISSING: runner did not preserve a result/failure manifest")

          cases.append((result_schema, manifest_path))
          for schema_path, fixture_path in cases:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              instance = json.loads(fixture_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              errors = sorted(
                  Draft202012Validator(schema).iter_errors(instance),
                  key=lambda error: (list(map(str, error.absolute_path)), error.message),
              )
              if errors:
                  for error in errors:
                      pointer = "/" + "/".join(map(str, error.absolute_path))
                      print(f"{fixture_path}: {pointer}: {error.message}")
                  raise SystemExit(1)
              print(f"SWMM_SCHEMA_FIXTURE_PASS: {schema_path} -> {fixture_path}")

          if json.loads(manifest_path.read_text(encoding="utf-8"))["run_state"] != "Completed":
              print("SWMM_RUN_STATE_FAILED: see failure manifest and logs")
          PY
      - name: Upload SWMM reports, binary outputs, logs, and run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swmm-synthetic-s0-evidence
          path: artifacts/swmm-s0/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail the workflow if run or schema validation failed
        if: always()
        env:
          SWMM_RUN_OUTCOME: ${{ steps.swmm_run.outcome }}
        run: test "$SWMM_RUN_OUTCOME" = "success"
