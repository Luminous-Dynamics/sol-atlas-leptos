name: City State Synchronization Synthetic Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/city-state-sync-bench/**"
      - "docs/research/city-state-sync/**"
      - ".github/workflows/city-state-sync-oracle.yml"
  push:
    branches: ["main", "research/city-state-sync-v0.1"]
    paths:
      - "tools/city-state-sync-bench/**"
      - "docs/research/city-state-sync/**"
      - ".github/workflows/city-state-sync-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-state-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  temporal-state-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check package formatting
        run: cargo fmt --manifest-path tools/city-state-sync-bench/Cargo.toml --all -- --check
      - name: Run locked offline tests
        run: cargo test --locked --manifest-path tools/city-state-sync-bench/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/city-state-sync-bench/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact-head temporal state receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/city-state-sync-bench/Cargo.toml -- \
            docs/research/city-state-sync/CITY_STATE_SYNC_CORPUS_V0_1.json \
            --source-commit "$source_commit" > city-state-sync-receipt.json
          jq -e '
            .result == "pass"
            and .corpus_id == "CITY-STATE-SYNC-CORPUS-V0.1"
            and .corpus_classification == "synthetic_fixture_only"
            and .scenario_count == 36
            and .failure_count == 0
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | length == 36)
            and (.scenarios | all(.status == "pass"))
            and .claim_ceiling == "synthetic temporal state and feedback semantics only; no live owner source, payload bytes, physical condition or intervention outcome is authenticated"
          ' city-state-sync-receipt.json
      - name: Upload exact-head temporal state receipt
        uses: actions/upload-artifact@v4
        with:
          name: city-state-sync-reference-receipt
          path: city-state-sync-receipt.json
          if-no-files-found: error
          retention-days: 90
