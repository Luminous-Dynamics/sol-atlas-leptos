name: Earth systems catalog validation

on:
  pull_request:
    paths:
      - "docs/earth-systems-domain-catalog.json"
      - "docs/pilots/**"
      - "docs/schemas/earth-systems-domain-catalog.schema.json"
      - "docs/schemas/water-food-pilot.schema.json"
      - "docs/schemas/agroclimate-model-profile.schema.json"
      - "scripts/earth-systems/**"
      - "tests/test_earth_systems_catalog.py"
      - "tests/test_water_food_pilot.py"
      - "tests/test_agroclimate_profile.py"
      - "tests/test_chirps_monthly_plan.py"
      - "tests/test_wapor_catalog_inventory.py"
      - ".github/workflows/earth-systems-catalog.yml"
  push:
    branches: [main]
    paths:
      - "docs/earth-systems-domain-catalog.json"
      - "docs/pilots/**"
      - "docs/schemas/earth-systems-domain-catalog.schema.json"
      - "docs/schemas/water-food-pilot.schema.json"
      - "docs/schemas/agroclimate-model-profile.schema.json"
      - "scripts/earth-systems/**"
      - "tests/test_earth_systems_catalog.py"
      - "tests/test_water_food_pilot.py"
      - "tests/test_agroclimate_profile.py"
      - "tests/test_chirps_monthly_plan.py"
      - "tests/test_wapor_catalog_inventory.py"
      - ".github/workflows/earth-systems-catalog.yml"

# Only the latest PR-head validation matters. Cancel stale queued/running
# validations for the same PR instead of spending runners on superseded heads.
concurrency:
  group: earth-systems-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-catalog:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Draft 2020-12 validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'jsonschema[format]==4.26.0'
      - name: Validate catalog
        run: python scripts/earth-systems/validate_catalog.py
      - name: Run catalog tests
        run: python -m unittest discover -s tests -p "test_earth_systems_catalog.py" -v
      - name: Validate Baixo Limpopo pilot profile
        run: python scripts/earth-systems/validate_pilot.py
      - name: Run pilot tests
        run: python -m unittest discover -s tests -p "test_water_food_pilot.py" -v
      - name: Validate Johannesburg/Highveld agroclimate profile
        run: python scripts/earth-systems/validate_agroclimate_profile.py
      - name: Run agroclimate profile tests
        run: python -m unittest discover -s tests -p "test_agroclimate_profile.py" -v
      - name: Run CHIRPS index-planner tests
        run: python -m unittest discover -s tests -p "test_chirps_monthly_plan.py" -v
      - name: Run WaPOR catalogue inventory tests
        run: python -m unittest discover -s tests -p "test_wapor_catalog_inventory.py" -v
