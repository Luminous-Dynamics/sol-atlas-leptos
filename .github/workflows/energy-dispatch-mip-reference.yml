name: Energy Dispatch Independent MIP Reference

on:
  pull_request:
    paths:
      - "tools/energy-dispatch-mip-reference/**"
      - "tools/energy-dispatch-lp-validator/**"
      - "schemas/examples/energy-dispatch-pv-outage.synthetic.json"
      - ".github/workflows/energy-dispatch-mip-reference.yml"
  push:
    branches: ["main"]
    paths:
      - "tools/energy-dispatch-mip-reference/**"
      - "schemas/examples/energy-dispatch-pv-outage.synthetic.json"
      - ".github/workflows/energy-dispatch-mip-reference.yml"

permissions:
  contents: read

concurrency:
  group: energy-dispatch-mip-reference-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reference-model:
    name: Independent integer LP model generator (Rust 1.96.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Format model generator sources
        run: cargo fmt --manifest-path tools/energy-dispatch-mip-reference/Cargo.toml --all

      - name: Resolve standalone dependency graphs
        run: |
          cargo generate-lockfile --manifest-path tools/energy-dispatch-mip-reference/Cargo.toml
          cargo generate-lockfile --manifest-path tools/energy-dispatch-lp-validator/Cargo.toml

      - name: Format and qualify the independent translation validator
        run: |
          cargo fmt --manifest-path tools/energy-dispatch-lp-validator/Cargo.toml --all
          cargo test --manifest-path tools/energy-dispatch-lp-validator/Cargo.toml --locked
          cargo clippy --manifest-path tools/energy-dispatch-lp-validator/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test independent model translation and hard controls
        run: cargo test --manifest-path tools/energy-dispatch-mip-reference/Cargo.toml

      - name: Clippy independent model generator
        run: cargo clippy --manifest-path tools/energy-dispatch-mip-reference/Cargo.toml --all-targets -- -D warnings

      - name: Emit 12 frozen-fixture LP models
        run: |
          cargo run --manifest-path tools/energy-dispatch-mip-reference/Cargo.toml -- \
            schemas/examples/energy-dispatch-pv-outage.synthetic.json \
            target/energy-dispatch-mip-reference
          test "$(find target/energy-dispatch-mip-reference -maxdepth 1 -name '*.lp' | wc -l)" -eq 12
          test -s target/energy-dispatch-mip-reference/manifest.json

      - name: Independently validate the source-to-LP translation of every objective model
        run: |
          request="schemas/examples/energy-dispatch-pv-outage.synthetic.json"
          mkdir -p target/energy-dispatch-mip-reference/translation
          for model in target/energy-dispatch-mip-reference/*.lp; do
            name="$(basename "$model")"
            stem="${name%.lp}"
            receipt="target/energy-dispatch-mip-reference/translation/$stem.translation.json"
            cargo run --quiet --manifest-path tools/energy-dispatch-lp-validator/Cargo.toml --locked -- \
              "$request" "$model" "$receipt"
            lp_sha="$(sha256sum "$model" | cut -d ' ' -f 1)"
            request_sha="$(sha256sum "$request" | cut -d ' ' -f 1)"
            jq -e --arg lp_sha "$lp_sha" --arg request_sha "$request_sha" \
              '.equivalent == true and .lp_sha256 == $lp_sha and .request_sha256 == $request_sha and .reference_model_sha256 == .parsed_model_sha256 and (.reference_model_sha256|length) == 64' \
              "$receipt"
          done
          test "$(find target/energy-dispatch-mip-reference/translation -maxdepth 1 -name '*.translation.json' | wc -l)" -eq 12
          jq -s -e 'length == 12 and all(.[]; .equivalent == true) and ([.[].request_sha256] | unique | length == 1) and ([.[].lp_sha256] | unique | length == 12) and ([.[].reference_model_sha256] | unique | length == 12)' \
            target/energy-dispatch-mip-reference/translation/*.translation.json \
            > target/energy-dispatch-mip-reference/translation/summary.json

      - name: Download checksum-pinned SCIP 10.1.0 exact-solver release
        run: |
          curl --fail --location --retry 3 \
            https://github.com/scipopt/scip/releases/download/v10.1.0/scipoptsuite-10.1.0-glibc2_34-amd64.tgz \
            --output /tmp/scipoptsuite-10.1.0.tgz
          echo "40cd290767af04f9f8af925cde538460e00b8cc7434a74e63018b3dd94e8d62c  /tmp/scipoptsuite-10.1.0.tgz" | sha256sum --check
          mkdir -p /tmp/scipoptsuite
          tar -xzf /tmp/scipoptsuite-10.1.0.tgz -C /tmp/scipoptsuite

      - name: Solve every emitted objective model in SCIP exact mode and emit proof files
        run: |
          SCIP_BIN="$(find /tmp/scipoptsuite -type f -name scip -perm /111 | head -n 1)"
          test -n "$SCIP_BIN"
          mkdir -p target/energy-dispatch-mip-reference/scip-logs target/energy-dispatch-mip-reference/vipr
          sha256sum "$SCIP_BIN" | awk '{print $1}' > target/energy-dispatch-mip-reference/scip-binary.sha256
          sha256sum /tmp/scipoptsuite-10.1.0.tgz | awk '{print $1}' > target/energy-dispatch-mip-reference/scip-archive.sha256
          "$SCIP_BIN" -c "display version" -c "quit" \
            > target/energy-dispatch-mip-reference/scip-version.txt 2>&1
          printf 'model,exact_status,objective_value,request_sha256,lp_sha256,semantic_model_sha256,translation_receipt_sha256,certificate\n' \
            > target/energy-dispatch-mip-reference/scip-results.csv
          for model in target/energy-dispatch-mip-reference/*.lp; do
            name="$(basename "$model")"
            stem="${name%.lp}"
            log="target/energy-dispatch-mip-reference/scip-logs/$name.log"
            cert="target/energy-dispatch-mip-reference/vipr/$stem.vipr"
            receipt="target/energy-dispatch-mip-reference/translation/$stem.translation.json"
            test -s "$receipt"
            lp_sha="$(sha256sum "$model" | cut -d ' ' -f 1)"
            receipt_sha="$(sha256sum "$receipt" | cut -d ' ' -f 1)"
            request_sha="$(jq -r '.request_sha256' "$receipt")"
            semantic_sha="$(jq -r '.reference_model_sha256' "$receipt")"
            jq -e --arg lp_sha "$lp_sha" --arg request_sha "$request_sha" \
              '.equivalent == true and .lp_sha256 == $lp_sha and .request_sha256 == $request_sha and .reference_model_sha256 == .parsed_model_sha256' \
              "$receipt"
            timeout 180s "$SCIP_BIN" \
              -c "set exact enable TRUE" \
              -c "set presolving emphasis off" \
              -c "set presolving maxrounds 0" \
              -c "set presolving maxrestarts 0" \
              -c "set separating maxrounds 0" \
              -c "set separating maxroundsroot 0" \
              -c "set certificate filename $cert" \
              -c "read $model" \
              -c "optimize" \
              -c "quit" > "$log" 2>&1
            grep -Eiq "optimal solution found" "$log"
            test -s "$cert"
            value="$(grep -E 'Exact Primal Bound[[:space:]]*:' "$log" | tail -n 1 | sed -E 's/.*Exact Primal Bound[[:space:]]*:[[:space:]]*//')"
            test -n "$value"
            printf '%s,optimal_exact,%s,%s,%s,%s,%s,%s\n' "$name" "$value" "$request_sha" "$lp_sha" "$semantic_sha" "$receipt_sha" "$cert" \
              >> target/energy-dispatch-mip-reference/scip-results.csv
          done
          test "$(wc -l < target/energy-dispatch-mip-reference/scip-results.csv)" -eq 13
          cat target/energy-dispatch-mip-reference/scip-results.csv
          while IFS=, read -r model status value request_sha lp_sha semantic_sha receipt_sha certificate; do
            case "$model" in
              essential_unserved_quanta_min.lp) expected=0 ;;
              essential_unserved_quanta_max.lp) expected=2 ;;
              flexible_unserved_quanta_min.lp|flexible_unserved_quanta_max.lp) expected=0 ;;
              operating_cost_units_min.lp|grid_carbon_grams_min.lp) expected=0 ;;
              operating_cost_units_max.lp|grid_carbon_grams_max.lp) expected=2 ;;
              curtailed_pv_quanta_min.lp|terminal_soc_quanta_min.lp) expected=0 ;;
              curtailed_pv_quanta_max.lp|terminal_soc_quanta_max.lp) expected=2 ;;
              *) echo "unexpected solver result row: $model" >&2; exit 1 ;;
            esac
            normalized="$(printf '%s' "$value" | sed -E 's/\.0+$//')"
            test "$status" = "optimal_exact"
            test "$normalized" = "$expected"
            test -s "$certificate"
            stem="${model%.lp}"
            receipt="target/energy-dispatch-mip-reference/translation/$stem.translation.json"
            model_path="target/energy-dispatch-mip-reference/$model"
            test "$(sha256sum "$model_path" | cut -d ' ' -f 1)" = "$lp_sha"
            test "$(sha256sum "$receipt" | cut -d ' ' -f 1)" = "$receipt_sha"
            jq -e --arg request_sha "$request_sha" --arg lp_sha "$lp_sha" --arg semantic_sha "$semantic_sha" \
              '.equivalent == true and .request_sha256 == $request_sha and .lp_sha256 == $lp_sha and .reference_model_sha256 == $semantic_sha and .reference_model_sha256 == .parsed_model_sha256' \
              "$receipt"
          done < <(tail -n +2 target/energy-dispatch-mip-reference/scip-results.csv)

      - name: Build pinned independent VIPR proof checker
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgmp-dev libtbb-dev
          git clone https://github.com/scipopt/vipr.git /tmp/vipr
          git -C /tmp/vipr checkout 99eec197a49b2bd9ad33c1f4c7afabe93caa6511
          cmake -S /tmp/vipr/code -B /tmp/vipr/build -DVIPRCOMP=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/vipr/build --target viprchk -j2
          VIPR_CHECKER="$(find /tmp/vipr/build -type f -name viprchk -perm /111 | head -n 1)"
          test -n "$VIPR_CHECKER"
          cp "$VIPR_CHECKER" target/energy-dispatch-mip-reference/viprchk
          printf '%s\n' "$(git -C /tmp/vipr rev-parse HEAD)" > target/energy-dispatch-mip-reference/vipr-source-commit.txt
          sha256sum target/energy-dispatch-mip-reference/viprchk | awk '{print $1}' > target/energy-dispatch-mip-reference/vipr-checker.sha256

      - name: Independently verify all SCIP certificates against original models
        run: |
          mkdir -p target/energy-dispatch-mip-reference/vipr-checks
          VIPR_CHECKER=target/energy-dispatch-mip-reference/viprchk
          for certificate in target/energy-dispatch-mip-reference/vipr/*.vipr; do
            name="$(basename "$certificate")"
            log="target/energy-dispatch-mip-reference/vipr-checks/$name.log"
            "$VIPR_CHECKER" "$certificate" > "$log" 2>&1
          done
          test "$(find target/energy-dispatch-mip-reference/vipr-checks -maxdepth 1 -name '*.log' | wc -l)" -eq 12
          mkdir -p target/energy-dispatch-mip-reference/proof-bindings
          while IFS=, read -r model status value request_sha lp_sha semantic_sha receipt_sha certificate; do
            test "$status" = "optimal_exact"
            cert_sha="$(sha256sum "$certificate" | cut -d ' ' -f 1)"
            receipt="target/energy-dispatch-mip-reference/translation/${model%.lp}.translation.json"
            vipr_log="target/energy-dispatch-mip-reference/vipr-checks/${model%.lp}.vipr.log"
            test -s "$vipr_log"
            vipr_log_sha="$(sha256sum "$vipr_log" | cut -d ' ' -f 1)"
            validator_version="$(jq -r '.validator_version' "$receipt")"
            checker_sha="$(cat target/energy-dispatch-mip-reference/vipr-checker.sha256)"
            scip_sha="$(cat target/energy-dispatch-mip-reference/scip-binary.sha256)"
            vipr_commit="$(cat target/energy-dispatch-mip-reference/vipr-source-commit.txt)"
            jq -cn --arg model "$model" --arg status "$status" --arg objective "$value" \
              --arg request_sha "$request_sha" --arg lp_sha "$lp_sha" \
              --arg semantic_sha "$semantic_sha" --arg receipt_sha "$receipt_sha" \
              --arg certificate_sha "$cert_sha" --arg vipr_log_sha "$vipr_log_sha" \
              --arg validator_version "$validator_version" --arg checker_sha "$checker_sha" \
              --arg scip_sha "$scip_sha" --arg vipr_commit "$vipr_commit" \
              '{model:$model,solver_status:$status,objective_value:$objective,request_sha256:$request_sha,lp_sha256:$lp_sha,semantic_model_sha256:$semantic_sha,translation_receipt_sha256:$receipt_sha,certificate_sha256:$certificate_sha,vipr_log_sha256:$vipr_log_sha,validator_version:$validator_version,scip_binary_sha256:$scip_sha,vipr_checker_sha256:$checker_sha,vipr_source_commit:$vipr_commit,vipr_verification:"accepted",claim_ceiling:"translation equivalence and independently accepted solver certificate for the exact emitted LP; not physical-model validity or operational authorization"}' \
              >> target/energy-dispatch-mip-reference/proof-bindings/qualified-proof-bindings.jsonl
            test -s "$receipt"
          done < <(tail -n +2 target/energy-dispatch-mip-reference/scip-results.csv)
          test "$(wc -l < target/energy-dispatch-mip-reference/proof-bindings/qualified-proof-bindings.jsonl)" -eq 12

      - name: Publish LP models, manifest, lockfile and formatted source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-dispatch-independent-mip-reference-${{ github.sha }}
          path: |
            target/energy-dispatch-mip-reference/
            tools/energy-dispatch-mip-reference/Cargo.lock
            tools/energy-dispatch-mip-reference/Cargo.toml
            tools/energy-dispatch-mip-reference/README.md
            tools/energy-dispatch-mip-reference/src/lib.rs
            tools/energy-dispatch-mip-reference/src/main.rs
            tools/energy-dispatch-lp-validator/Cargo.toml
            tools/energy-dispatch-lp-validator/Cargo.lock
            tools/energy-dispatch-lp-validator/README.md
            tools/energy-dispatch-lp-validator/src/lib.rs
            tools/energy-dispatch-lp-validator/src/main.rs
          if-no-files-found: error
          retention-days: 14
