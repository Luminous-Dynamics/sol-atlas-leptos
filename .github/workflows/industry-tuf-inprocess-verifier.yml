name: IEAC in-process TUF verifier

on:
  pull_request:
    paths:
      - "tools/industry-tuf-inprocess-verifier/**"
      - "schemas/industry-ieac-tuf-inprocess-*.json"
      - "schemas/examples/ieac-tuf-inprocess-*.json"
      - ".github/workflows/industry-tuf-inprocess-verifier.yml"
  push:
    branches:
      - main
      - feat/ieac-tuf-channel-freshness-v0-1
    paths:
      - "tools/industry-tuf-inprocess-verifier/**"
      - "schemas/industry-ieac-tuf-inprocess-*.json"
      - "schemas/examples/ieac-tuf-inprocess-*.json"
      - ".github/workflows/industry-tuf-inprocess-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieac-tuf-inprocess-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inprocess-tuf:
    name: Exact-head TUF cryptographic verification and reference conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format, lint and test pinned in-process TUF verifier
        run: |
          set -euo pipefail
          manifest=tools/industry-tuf-inprocess-verifier/Cargo.toml
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --manifest-path "$manifest" --all-targets --locked -- -D warnings
          cargo test --manifest-path "$manifest" --locked

      - name: Install pinned Draft 2020-12 validator
        run: cargo install --locked jsonschema-cli --version 0.60.2 --root "$RUNNER_TEMP/jsonschema-cli"

      - name: Add schema CLI to PATH
        run: echo "$RUNNER_TEMP/jsonschema-cli/bin" >> "$GITHUB_PATH"

      - name: Validate in-process request/report contracts and synthetic request
        run: |
          set -euo pipefail
          jsonschema-cli validate --draft 2020 --assert-format --offline \
            schemas/industry-ieac-tuf-inprocess-request-v0.1.schema.json \
            -i schemas/examples/ieac-tuf-inprocess-request-synthetic-v0.1.json

      - name: Verify vendored reference fixture inventory and attribution
        run: |
          set -euo pipefail
          root=tools/industry-tuf-inprocess-verifier/tests/fixtures
          test -s "$root/ATTRIBUTION.md"
          for file in \
            "$root/tuf-reference-impl/metadata/1.root.json" \
            "$root/tuf-reference-impl/metadata/timestamp.json" \
            "$root/tuf-reference-impl/metadata/snapshot.json" \
            "$root/tuf-reference-impl/metadata/targets.json" \
            "$root/tuf-reference-impl/metadata/role1.json" \
            "$root/tuf-reference-impl/metadata/role2.json" \
            "$root/tuf-reference-impl/targets/file1.txt" \
            "$root/tuf-reference-impl/targets/file2.txt" \
            "$root/tuf-reference-impl/targets/file3.txt" \
            "$root/negative/no-root-json-signatures.root.json" \
            "$root/negative/invalid-root-json-signature.root.json" \
            "$root/negative/duplicate-sigs.root.json"; do
            test -s "$file"
          done
          rg -n "vendored from|python-tuf|MIT OR Apache-2.0" "$root/ATTRIBUTION.md"

      - name: Prove standalone dependency lock remains committed
        run: git diff --exit-code -- tools/industry-tuf-inprocess-verifier/Cargo.lock
