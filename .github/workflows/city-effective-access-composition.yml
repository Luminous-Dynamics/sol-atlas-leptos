name: City Effective Access Composition Synthetic Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/city-effective-access-composition/**"
      - "docs/research/city-effective-access-composition/**"
      - ".github/workflows/city-effective-access-composition.yml"
  push:
    branches: ["main", "research/city-effective-access-composition-v0.1"]
    paths:
      - "tools/city-effective-access-composition/**"
      - "docs/research/city-effective-access-composition/**"
      - ".github/workflows/city-effective-access-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-effective-access-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  composition-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Validate the frozen synthetic corpus
        run: |
          set -euo pipefail
          jq -e '
            .schema_id == "org.luminousdynamics.city-effective-access-composition.synthetic-corpus"
            and .schema_version == "0.1.0"
            and .corpus_id == "CITY-EFFECTIVE-ACCESS-COMPOSITION-CORPUS-V0.1"
            and .classification == "synthetic_fixture_only"
            and (.cases | length == 28)
            and ([.cases[].case_id] | unique | length == 24)
          ' docs/research/city-effective-access-composition/CITY_EFFECTIVE_ACCESS_COMPOSITION_CORPUS_V0_1.json
          jq -e '
            .[ "$schema" ] == "https://json-schema.org/draft/2020-12/schema"
            and .title == "City Effective Access Composition Corpus v0.1"
            and .type == "object"
          ' docs/research/city-effective-access-composition/CITY_EFFECTIVE_ACCESS_COMPOSITION_CORPUS_V0_1.schema.json
      - name: Check formatting
        run: cargo fmt --manifest-path tools/city-effective-access-composition/Cargo.toml --all -- --check
      - name: Run frozen known-answer and hostile-control tests
        run: cargo test --locked --manifest-path tools/city-effective-access-composition/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/city-effective-access-composition/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact-head composition receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/city-effective-access-composition/Cargo.toml -- \
            docs/research/city-effective-access-composition/CITY_EFFECTIVE_ACCESS_COMPOSITION_CORPUS_V0_1.json \
            --source-commit "$source_commit" > city-effective-access-composition-receipt.json
          jq -e '
            .result == "pass"
            and .corpus_id == "CITY-EFFECTIVE-ACCESS-COMPOSITION-CORPUS-V0.1"
            and .corpus_classification == "synthetic_fixture_only"
            and .scenario_count == 28
            and .failure_count == 0
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | length == 28)
            and (.scenarios | all(.status == "pass"))
            and .action_authority == "none"
          ' city-effective-access-composition-receipt.json
      - name: Upload exact-head composition receipt
        uses: actions/upload-artifact@v4
        with:
          name: city-effective-access-composition-reference-receipt
          path: city-effective-access-composition-receipt.json
          if-no-files-found: error
          retention-days: 90
