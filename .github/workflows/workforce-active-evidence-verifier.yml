name: Workforce active evidence exact verifier

on:
  pull_request:
    paths:
      - "docs/research/WORKFORCE-ACTIVE-EVIDENCE-001.md"
      - "docs/research/fixtures/workforce_active_evidence_scenarios_v0_1.json"
      - "docs/research/schemas/workforce_active_evidence_v0_1.schema.json"
      - "tools/workforce-active-evidence-verifier/**"
      - ".github/workflows/workforce-active-evidence-verifier.yml"
  push:
    branches:
      - main
      - research/workforce-active-evidence-001
    paths:
      - "docs/research/WORKFORCE-ACTIVE-EVIDENCE-001.md"
      - "docs/research/fixtures/workforce_active_evidence_scenarios_v0_1.json"
      - "docs/research/schemas/workforce_active_evidence_v0_1.schema.json"
      - "tools/workforce-active-evidence-verifier/**"
      - ".github/workflows/workforce-active-evidence-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-active-evidence-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path tools/workforce-active-evidence-verifier/Cargo.toml -- --check

      - name: Run exact-oracle tests
        run: cargo test --manifest-path tools/workforce-active-evidence-verifier/Cargo.toml

      - name: Produce synthetic-only policy receipt
        run: cargo run --manifest-path tools/workforce-active-evidence-verifier/Cargo.toml -- docs/research/fixtures/workforce_active_evidence_scenarios_v0_1.json docs/research/schemas/workforce_active_evidence_v0_1.schema.json
