name: Tiered Spatial Validation Contract Reference

on:
  pull_request:
    paths:
      - "benchmarks/tiered-spatial-validation/**"
      - ".github/workflows/tiered-spatial-validation.yml"
  push:
    branches: [main]
    paths:
      - "benchmarks/tiered-spatial-validation/**"
      - ".github/workflows/tiered-spatial-validation.yml"

permissions:
  contents: read

jobs:
  tiered-spatial-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate schema and frozen fixture
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          base = Path("benchmarks/tiered-spatial-validation/v0.1")
          schema = json.loads((base / "schemas/validation-regimes.schema.json").read_text())
          fixture = json.loads((base / "fixtures/validation-regimes-v0.1.json").read_text())
          Draft202012Validator.check_schema(schema)
          errors = sorted(
              Draft202012Validator(schema).iter_errors(fixture),
              key=lambda error: list(error.absolute_path),
          )
          if errors:
              for error in errors:
                  print(f"INVALID: {list(error.absolute_path)}: {error.message}")
              raise SystemExit(1)
          print("VALID: tiered spatial validation schema and fixture")
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --manifest-path benchmarks/tiered-spatial-validation/v0.1/reference/Cargo.toml -- --check

      - name: Run exact contract tests
        run: cargo test --manifest-path benchmarks/tiered-spatial-validation/v0.1/reference/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --manifest-path benchmarks/tiered-spatial-validation/v0.1/reference/Cargo.toml --all-targets -- -D warnings

      - name: Execute validation regime auditor
        run: |
          cargo run --manifest-path benchmarks/tiered-spatial-validation/v0.1/reference/Cargo.toml -- \
            benchmarks/tiered-spatial-validation/v0.1/fixtures/validation-regimes-v0.1.json \
            > /tmp/tiered-spatial-validation.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/tiered-spatial-validation.json").read_text())
          assert report["fixtureStatus"] == "synthetic"
          assert report["claimCeiling"] == "SPLIT_INTEGRITY_ONLY_NO_MODEL_PERFORMANCE_CLAIM"
          assert report["caseCount"] == 6
          assert len(report["observedRegimes"]) == 6
          print("VALID: tiered spatial validation split-integrity oracle")
          PY
