name: Heritage Multi-Scale Morphology Qualification

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/heritage_morphology.rs"
      - "sol-atlas-core/src/heritage_membership_sensitivity.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "schemas/heritage-morphology-v0.1.schema.json"
      - "schemas/examples/heritage-morphology-synthetic-v0.1.json"
      - "schemas/heritage-membership-sensitivity-v0.1.schema.json"
      - "schemas/examples/heritage-membership-sensitivity-synthetic-v0.1.json"
      - "docs/research/heritage-morphology-v0.1.md"
      - "docs/research/heritage-membership-sensitivity-v0.1.md"
      - ".github/workflows/heritage-morphology.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check core formatting
        run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml -- --check
      - name: Run core unit and fixture tests
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Draft 2020-12 schema and fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schemas/heritage-morphology-v0.1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          fixture = json.loads(
              Path("schemas/examples/heritage-morphology-synthetic-v0.1.json").read_text()
          )
          validator.validate(fixture)

          malformed = copy.deepcopy(fixture)
          malformed["stones"][0]["mrr_area_ratio"]["upper"] = 1.1
          assert list(validator.iter_errors(malformed)), "out-of-range MRR ratio passed"

          malformed = copy.deepcopy(fixture)
          malformed["stones"][0]["memberships"][0]["status"] = "ambiguous"
          assert list(validator.iter_errors(malformed)), "invalid ambiguous membership passed"

          sensitivity_schema = json.loads(
              Path("schemas/heritage-membership-sensitivity-v0.1.schema.json").read_text()
          )
          Draft202012Validator.check_schema(sensitivity_schema)
          sensitivity_validator = Draft202012Validator(sensitivity_schema)
          sensitivity_fixture = json.loads(
              Path("schemas/examples/heritage-membership-sensitivity-synthetic-v0.1.json").read_text()
          )
          sensitivity_validator.validate(sensitivity_fixture)

          malformed_sensitivity = copy.deepcopy(sensitivity_fixture)
          malformed_sensitivity["scenario_count"] = 0
          assert list(sensitivity_validator.iter_errors(malformed_sensitivity)), "zero-scenario report passed"

          malformed_sensitivity = copy.deepcopy(sensitivity_fixture)
          malformed_sensitivity["scenario_semantics"] = "probabilistic_imputation"
          assert list(sensitivity_validator.iter_errors(malformed_sensitivity)), "probabilistic semantics passed"

          print("Draft 2020-12 morphology and membership-sensitivity schemas, 2 positive fixtures and 4 negative controls passed")
          PY
