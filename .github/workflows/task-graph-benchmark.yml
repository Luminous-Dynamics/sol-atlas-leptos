name: Task graph release benchmark

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/task_graph.rs"
      - "sol-atlas-core/examples/task_graph_bench.rs"
      - "sol-atlas-core/fixtures/task-graph-v1.json"
      - "sol-atlas-core/Cargo.toml"
      - "sol-atlas-core/Cargo.lock"
      - "docs/field-task-graph-benchmark.md"
      - "docs/task-revalidation-impact-plan.md"
      - ".github/workflows/task-graph-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-graph-benchmark-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-benchmark:
    name: Release benchmark and raw evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            sol-atlas-core/target/
          key: ${{ runner.os }}-${{ runner.arch }}-task-graph-release-${{ hashFiles('sol-atlas-core/Cargo.lock') }}
      - name: Capture exact source and environment
        env:
          TASK_GRAPH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "source_commit_sha=${TASK_GRAPH_SOURCE_SHA}" | tee benchmark-environment.txt
          rustc -Vv | tee -a benchmark-environment.txt
          cargo -V | tee -a benchmark-environment.txt
          uname -a | tee -a benchmark-environment.txt
          lscpu | tee -a benchmark-environment.txt
      - name: Run release benchmark
        env:
          TASK_GRAPH_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cargo run --release --manifest-path sol-atlas-core/Cargo.toml --example task_graph_bench -- 100 10000 > task-graph-benchmark.json
      - name: Validate raw benchmark evidence
        run: |
          set -euo pipefail
          jq -e '
            .benchmark == "field-task-graph-v1"
            and .benchmark_version == 4
            and (.workloads | keys == ["fan_in_4", "independent_roots"])
            and all(.workloads[]; .dataset.tasks == 10000)
            and all(.workloads[]; .operations.validate.samples == 100)
            and all(.workloads[]; (.operations.validate.raw_ns | length) == 100)
            and all(.workloads[]; .operations.compiled_ready_tasks.samples == 100)
            and all(.workloads[]; (.operations.compiled_ready_tasks.raw_ns | length) == 100)
            and all(.workloads[]; .operations.impact_compile_index.samples == 100)
            and all(.workloads[]; (.operations.impact_compile_index.raw_ns | length) == 100)
            and all(.workloads[]; .operations.impact_plan_reference.samples == 100)
            and all(.workloads[]; (.operations.impact_plan_reference.raw_ns | length) == 100)
            and all(.workloads[]; .operations.impact_plan_compiled.samples == 100)
            and all(.workloads[]; (.operations.impact_plan_compiled.raw_ns | length) == 100)
            and (.workloads.fan_in_4.dataset.edges == 39990)
            and (.workloads.independent_roots.dataset.edges == 0)
            and (.workloads.fan_in_4.dataset.impact_reachable_descendants == 9999)
            and (.workloads.independent_roots.dataset.impact_reachable_descendants == 0)
            and (.environment.debug_assertions == false)
          ' task-graph-benchmark.json > /dev/null
          jq '{benchmark, benchmark_version, environment, method, workloads: (.workloads | with_entries(.value |= {dataset, operations: (.operations | with_entries(.value |= {samples, p50_ns, p95_ns, max_ns}))}))}' task-graph-benchmark.json > task-graph-benchmark-summary.json
      - name: Upload reproducible benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: task-graph-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            task-graph-benchmark.json
            task-graph-benchmark-summary.json
            benchmark-environment.txt
