name: Reconcile Cargo lockfiles from exact manifests

on:
  push:
    branches:
      - research/built-environment-source-descriptors-v0-1-rebased
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "sol-atlas-core/Cargo.toml"
      - "sol-atlas-core/Cargo.lock"
      - ".github/workflows/resolve-lockfiles.yml"

permissions:
  contents: write

concurrency:
  group: resolve-lockfiles-descriptor-branch
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate lockfiles through Cargo resolution
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --manifest-path Cargo.toml >/dev/null
          cargo metadata --format-version 1 --manifest-path sol-atlas-core/Cargo.toml >/dev/null
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock sol-atlas-core/Cargo.lock
          if git diff --cached --quiet; then
            echo "Both lockfiles already match their manifests"
          else
            git commit -m "build: reconcile Cargo lockfiles with manifests"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          cargo metadata --locked --format-version 1 --manifest-path Cargo.toml >/dev/null
          cargo metadata --locked --format-version 1 --manifest-path sol-atlas-core/Cargo.toml >/dev/null
