name: Workforce outcome and additionality verifier

on:
  pull_request:
    paths:
      - "docs/research/WORKFORCE-OUTCOME-EVALUATION-001.md"
      - "docs/research/fixtures/workforce_outcome_receipts_v0_1.json"
      - "docs/research/schemas/workforce_outcome_receipt_v0_1.schema.json"
      - "tools/workforce-outcome-verifier/**"
      - ".github/workflows/workforce-outcome-verifier.yml"
  push:
    branches:
      - main
      - research/workforce-outcome-001
    paths:
      - "docs/research/WORKFORCE-OUTCOME-EVALUATION-001.md"
      - "docs/research/fixtures/workforce_outcome_receipts_v0_1.json"
      - "docs/research/schemas/workforce_outcome_receipt_v0_1.schema.json"
      - "tools/workforce-outcome-verifier/**"
      - ".github/workflows/workforce-outcome-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-outcome-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/workforce-outcome-verifier/Cargo.toml -- --check
      - name: Run outcome and additionality tests
        run: cargo test --manifest-path tools/workforce-outcome-verifier/Cargo.toml
      - name: Produce synthetic-only outcome receipt
        run: cargo run --manifest-path tools/workforce-outcome-verifier/Cargo.toml -- docs/research/fixtures/workforce_outcome_receipts_v0_1.json docs/research/schemas/workforce_outcome_receipt_v0_1.schema.json
