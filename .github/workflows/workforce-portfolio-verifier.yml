name: Workforce portfolio exact oracle

on:
  pull_request:
    paths:
      - "docs/research/WORKFORCE-PORTFOLIO-001.md"
      - "docs/research/fixtures/workforce_portfolio_scenarios_v0_1.json"
      - "docs/research/schemas/workforce_portfolio_v0_1.schema.json"
      - "tools/workforce-portfolio-verifier/**"
      - ".github/workflows/workforce-portfolio-verifier.yml"
  push:
    branches:
      - main
      - research/workforce-portfolio-001
    paths:
      - "docs/research/WORKFORCE-PORTFOLIO-001.md"
      - "docs/research/fixtures/workforce_portfolio_scenarios_v0_1.json"
      - "docs/research/schemas/workforce_portfolio_v0_1.schema.json"
      - "tools/workforce-portfolio-verifier/**"
      - ".github/workflows/workforce-portfolio-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-portfolio-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/workforce-portfolio-verifier/Cargo.toml -- --check
      - name: Run exact portfolio oracle tests
        run: cargo test --manifest-path tools/workforce-portfolio-verifier/Cargo.toml
      - name: Produce synthetic-only portfolio receipt
        run: cargo run --manifest-path tools/workforce-portfolio-verifier/Cargo.toml -- docs/research/fixtures/workforce_portfolio_scenarios_v0_1.json docs/research/schemas/workforce_portfolio_v0_1.schema.json
