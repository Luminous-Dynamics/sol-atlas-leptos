name: City Morph Continuity Synthetic Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/city-morph-continuity-bench/**"
      - "docs/research/city-morph-continuity/**"
      - ".github/workflows/city-morph-continuity-oracle.yml"
  push:
    branches: ["main", "research/city-morph-continuity-v0.1"]
    paths:
      - "tools/city-morph-continuity-bench/**"
      - "docs/research/city-morph-continuity/**"
      - ".github/workflows/city-morph-continuity-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-morph-continuity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  continuity-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path tools/city-morph-continuity-bench/Cargo.toml --all -- --check
      - name: Run timeline and hostile-control tests
        run: cargo test --locked --manifest-path tools/city-morph-continuity-bench/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/city-morph-continuity-bench/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact-head continuity receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/city-morph-continuity-bench/Cargo.toml -- \
            docs/research/city-morph-continuity/CITY_MORPH_CONTINUITY_CORPUS_V0_1.json \
            --source-commit "$source_commit" > city-morph-continuity-receipt.json
          jq -e '
            .result == "pass"
            and .corpus_id == "CITY-MORPH-CONTINUITY-CORPUS-V0.1"
            and .corpus_classification == "synthetic_fixture_only"
            and .scenario_count == 30
            and .failure_count == 0
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | length == 30)
            and (.scenarios | all(.status == "pass"))
          ' city-morph-continuity-receipt.json
      - name: Upload exact-head continuity receipt
        uses: actions/upload-artifact@v4
        with:
          name: city-morph-continuity-reference-receipt
          path: city-morph-continuity-receipt.json
          if-no-files-found: error
          retention-days: 90
