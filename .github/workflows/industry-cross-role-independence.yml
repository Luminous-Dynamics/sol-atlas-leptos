name: IEAC cross-role verifier independence

on:
  pull_request:
    paths:
      - "schemas/ieac-cross-role-independence-request-v0.1.schema.json"
      - "schemas/ieac-cross-role-independence-report-v0.1.schema.json"
      - "schemas/ieac-cross-role-independence-fixture-v0.1.schema.json"
      - "schemas/examples/ieac-cross-role-independence-synthetic-v0.1.json"
      - "docs/industry/IEAC_CROSS_ROLE_INDEPENDENCE_V0.1.md"
      - ".github/workflows/industry-cross-role-independence.yml"
  push:
    branches:
      - main
      - feat/ieac-availability-channel-completeness-v0-1
    paths:
      - "schemas/ieac-cross-role-independence-request-v0.1.schema.json"
      - "schemas/ieac-cross-role-independence-report-v0.1.schema.json"
      - "schemas/ieac-cross-role-independence-fixture-v0.1.schema.json"
      - "schemas/examples/ieac-cross-role-independence-synthetic-v0.1.json"
      - "docs/industry/IEAC_CROSS_ROLE_INDEPENDENCE_V0.1.md"
      - ".github/workflows/industry-cross-role-independence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieac-cross-role-independence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-binding-conformance:
    name: Exact-head role-to-CCF binding and common-cause controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust for pinned schema CLI
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Draft 2020-12 validator
        run: cargo install --locked jsonschema-cli --version 0.60.2 --root "$RUNNER_TEMP/jsonschema-cli"

      - name: Add schema CLI to PATH
        run: echo "$RUNNER_TEMP/jsonschema-cli/bin" >> "$GITHUB_PATH"

      - name: Validate schemas and synthetic role requests
        run: |
          set -euo pipefail
          request_schema=schemas/ieac-cross-role-independence-request-v0.1.schema.json
          report_schema=schemas/ieac-cross-role-independence-report-v0.1.schema.json
          fixture_schema=schemas/ieac-cross-role-independence-fixture-v0.1.schema.json
          fixture=schemas/examples/ieac-cross-role-independence-synthetic-v0.1.json
          jsonschema-cli validate --draft 2020 --assert-format -i "$request_schema"
          jsonschema-cli validate --draft 2020 --assert-format -i "$report_schema"
          jsonschema-cli validate --draft 2020 --assert-format -i "$fixture_schema"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$fixture_schema" -i "$fixture"
          jq -c '.cases[].request' "$fixture" | while IFS= read -r request; do
            printf '%s
' "$request" > "$RUNNER_TEMP/role-binding-request.json"
            jsonschema-cli validate --draft 2020 --assert-format --offline "$request_schema" -i "$RUNNER_TEMP/role-binding-request.json"
          done

      - name: Check shared control-plane and KMS conflicts without counting keys or organizations
        run: |
          set -euo pipefail
          fixture=schemas/examples/ieac-cross-role-independence-synthetic-v0.1.json
          jq -e '
            def assignment($q; $id): [$q.role_assignments[] | select(.assignment_id == $id)][0];
            def refs($a): [$a.dependency_tokens[].ccf_reference_id];
            def shared($a; $b): [refs($a)[] as $x | select((refs($b) | index($x)) != null) | $x] | unique;
            .cases as $cases |
            ($cases[] | select(.case_id == "shared-cloud-kms-ci-control-plane")) as $shared_case |
            ($shared_case.request) as $q |
            (shared(assignment($q; "ledger-operator"); assignment($q; "query-signer")) | length > 0) and
            (shared(assignment($q; "query-signer"); assignment($q; "verifier-build")) | length > 0) and
            (shared(assignment($q; "witness-a"); assignment($q; "witness-b")) | length > 0) and
            (assignment($q; "ledger-operator").organization_id != assignment($q; "query-signer").organization_id) and
            ($shared_case.expected.overall_disposition == "not_independent_under_registry_model") and
            ($shared_case.expected.conflicted_pairs | length == 4) and
            ($shared_case.expected.separate_pairs | length == 2) and
            ($cases[] | select(.case_id == "disjoint-control-domains-positive") |
              .request as $positive |
              all($positive.separation_requirements[];
                (.assignment_id_a as $a_id | .assignment_id_b as $b_id |
                  assignment($positive; $a_id) as $a |
                  assignment($positive; $b_id) as $b |
                  (shared($a; $b) | length == 0)
                )
              ) and
              .expected.overall_disposition == "independence_satisfied_under_registry_model"
            )
          ' "$fixture"

      - name: Refuse unknown dependency closure and unpinned CCF reports
        run: |
          set -euo pipefail
          source=schemas/examples/ieac-cross-role-independence-synthetic-v0.1.json
          schema=schemas/ieac-cross-role-independence-fixture-v0.1.schema.json
          jq '.cases[0].request.role_assignments[0].dependency_completeness = "unknown"' "$source" > "$RUNNER_TEMP/unknown-closure.json"
          jq '.cases[0].request.ccf_reference.ccf_report_verification_status = "unknown"' "$source" > "$RUNNER_TEMP/unknown-report.json"
          jq '.cases[0].request.role_assignments[1].dependency_tokens[0].binding_status = "disputed"' "$source" > "$RUNNER_TEMP/disputed-token.json"
          for mutant in "$RUNNER_TEMP/unknown-closure.json" "$RUNNER_TEMP/unknown-report.json" "$RUNNER_TEMP/disputed-token.json"; do
            jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$mutant"
            jq -e '
              any(.cases[].request.role_assignments[];
                .dependency_completeness != "complete" or .binding_status != "verified" or
                any(.dependency_tokens[]; .binding_status != "verified")
              ) or
              any(.cases[].request.ccf_reference.ccf_report_verification_status; . != "verified")
            ' "$mutant"
          done

      - name: Retain synthetic role-binding corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieac-cross-role-independence-${{ github.event.pull_request.head.sha || github.sha }}
          path: schemas/examples/ieac-cross-role-independence-synthetic-v0.1.json
          if-no-files-found: warn
          retention-days: 30
