name: Home multi-family synthetic qualifiers

on:
  pull_request:
    paths:
      - "src/bin/home-multifamily-qualifier.rs"
      - "src/bin/home-multifamily-service-qualifier.rs"
      - "docs/research/home-delivery-systems/multifamily-building.schema.json"
      - "docs/research/home-delivery-systems/multifamily-building-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-adversarial-corpus-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-service-distribution.schema.json"
      - "docs/research/home-delivery-systems/multifamily-service-distribution-synthetic-v0.1.json"
      - ".github/workflows/home-multifamily-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-multifamily-qualifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: rustfmt (multi-family qualifiers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check qualifier formatting
        run: |
          rustfmt --edition 2024 --check src/bin/home-multifamily-qualifier.rs
          rustfmt --edition 2024 --check src/bin/home-multifamily-service-qualifier.rs

  native:
    name: native multi-family qualifier tests and replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test building geometry qualifier
        run: cargo test --locked --bin home-multifamily-qualifier
      - name: Replay building geometry fixture
        run: cargo run --locked --bin home-multifamily-qualifier -- --self-test
      - name: Test shared-service qualifier
        run: cargo test --locked --bin home-multifamily-service-qualifier
      - name: Replay shared-service fixture
        run: cargo run --locked --bin home-multifamily-service-qualifier -- --self-test
