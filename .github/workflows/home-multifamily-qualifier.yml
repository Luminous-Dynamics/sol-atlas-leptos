name: Home multi-family synthetic qualifiers and stress manifest

on:
  pull_request:
    paths:
      - "src/bin/home-multifamily-qualifier.rs"
      - "src/bin/home-multifamily-service-qualifier.rs"
      - "src/bin/home-multifamily-unit-layout-qualifier.rs"
      - "docs/research/home-delivery-systems/multifamily-building.schema.json"
      - "docs/research/home-delivery-systems/multifamily-building-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-resident-programme.schema.json"
      - "docs/research/home-delivery-systems/multifamily-resident-programme-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-unit-layout.schema.json"
      - "docs/research/home-delivery-systems/multifamily-unit-layout-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-adversarial-corpus-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-service-distribution.schema.json"
      - "docs/research/home-delivery-systems/multifamily-service-distribution-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-service-stress-corpus-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-service-stress-corpus.schema.json"
      - ".github/workflows/home-multifamily-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-multifamily-qualifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: rustfmt (multi-family qualifiers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check qualifier formatting
        run: |
          rustfmt --edition 2024 --check src/bin/home-multifamily-qualifier.rs
          rustfmt --edition 2024 --check src/bin/home-multifamily-service-qualifier.rs
          rustfmt --edition 2024 --check src/bin/home-multifamily-unit-layout-qualifier.rs

  native:
    name: native multi-family qualifier tests and replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test building geometry qualifier
        run: cargo test --locked --bin home-multifamily-qualifier
      - name: Replay building geometry fixture
        run: cargo run --locked --bin home-multifamily-qualifier -- --self-test
      - name: Test shared-service qualifier
        run: cargo test --locked --bin home-multifamily-service-qualifier
      - name: Replay shared-service fixture
        run: cargo run --locked --bin home-multifamily-service-qualifier -- --self-test
      - name: Test apartment room geometry qualifier
        run: cargo test --locked --bin home-multifamily-unit-layout-qualifier
      - name: Replay apartment room geometry fixture
        run: cargo run --locked --bin home-multifamily-unit-layout-qualifier -- --self-test

  schema-validation:
    name: Draft 2020-12 schemas and synthetic fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install "jsonschema==4.26.0"
      - name: Validate schemas and paired fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("docs/research/home-delivery-systems")
          pairs = [
              ("multifamily-building.schema.json", "multifamily-building-synthetic-v0.1.json"),
              ("multifamily-service-distribution.schema.json", "multifamily-service-distribution-synthetic-v0.1.json"),
              ("multifamily-service-stress-corpus.schema.json", "multifamily-service-stress-corpus-v0.1.json"),
              ("multifamily-resident-programme.schema.json", "multifamily-resident-programme-synthetic-v0.1.json"),
          ]

          for schema_name, fixture_name in pairs:
              schema = json.loads((root / schema_name).read_text(encoding="utf-8"))
              fixture = json.loads((root / fixture_name).read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema)
              errors = sorted(validator.iter_errors(fixture), key=lambda e: list(e.absolute_path))
              if errors:
                  rendered = "\\n".join(
                      f"{schema_name} -> {fixture_name} at {list(err.absolute_path)}: {err.message}"
                      for err in errors
                  )
                  raise SystemExit(rendered)
              print(f"PASS Draft 2020-12: {fixture_name} against {schema_name}")
          PY
