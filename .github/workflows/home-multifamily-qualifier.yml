name: Home multi-family geometry, resident, service and room qualifiers

on:
  pull_request:
    paths:
      - "src/bin/home-multifamily-qualifier.rs"
      - "src/bin/home-multifamily-service-qualifier.rs"
      - "src/bin/home-multifamily-unit-layout-qualifier.rs"
      - "docs/research/home-delivery-systems/multifamily-building.schema.json"
      - "docs/research/home-delivery-systems/multifamily-building-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-resident-programme.schema.json"
      - "docs/research/home-delivery-systems/multifamily-resident-programme-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-unit-layout.schema.json"
      - "docs/research/home-delivery-systems/multifamily-unit-layout-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-unit-layout-corpus.schema.json"
      - "docs/research/home-delivery-systems/multifamily-unit-layout-corpus-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-adversarial-corpus-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-service-distribution.schema.json"
      - "docs/research/home-delivery-systems/multifamily-service-distribution-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-service-stress-corpus-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-service-stress-corpus.schema.json"
      - "src/bin/home-site-foundation-qualifier.rs"
      - "src/bin/home-service-stack-qualifier.rs"
      - "docs/research/home-delivery-systems/site-foundation-evidence.schema.json"
      - "docs/research/home-delivery-systems/site-foundation-evidence-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/home-service-interface.schema.json"
      - "docs/research/home-delivery-systems/home-service-stack.schema.json"
      - "docs/research/home-delivery-systems/home-service-interface-synthetic-v0.1.json"
      - ".github/workflows/home-multifamily-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-multifamily-qualifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: rustfmt (multi-family qualifiers)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check qualifier formatting
        run: |
          rustfmt --edition 2024 --check src/bin/home-multifamily-qualifier.rs
          rustfmt --edition 2024 --check src/bin/home-multifamily-service-qualifier.rs
          rustfmt --edition 2024 --check src/bin/home-multifamily-unit-layout-qualifier.rs

  native:
    name: native multi-family qualifier tests and replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test building geometry qualifier
        run: cargo test --locked --bin home-multifamily-qualifier
      - name: Replay building geometry fixture
        run: cargo run --locked --bin home-multifamily-qualifier -- --self-test
      - name: Test shared-service qualifier
        run: cargo test --locked --bin home-multifamily-service-qualifier
      - name: Replay shared-service fixture
        run: cargo run --locked --bin home-multifamily-service-qualifier -- --self-test
      - name: Test apartment room geometry qualifier
        run: cargo test --locked --bin home-multifamily-unit-layout-qualifier
      - name: Replay apartment room geometry fixture
        run: cargo run --locked --bin home-multifamily-unit-layout-qualifier -- --self-test
      - name: Test site foundation evidence qualifier
        run: cargo test --locked --bin home-site-foundation-qualifier
      - name: Replay site foundation evidence fixture
        run: cargo run --locked --bin home-site-foundation-qualifier -- --self-test
      - name: Test home service stack qualifier
        run: cargo test --locked --bin home-service-stack-qualifier
      - name: Replay household service stack fixture
        run: cargo run --locked --bin home-service-stack-qualifier -- --self-test

  schema-validation:
    name: Draft 2020-12 schemas and synthetic fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install "jsonschema==4.26.0"
      - name: Validate schemas and paired fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          root = Path("docs/research/home-delivery-systems")
          registry = Registry()
          schema_documents = {}
          for schema_path in root.glob("*.schema.json"):
              schema_document = json.loads(schema_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema_document)
              schema_documents[schema_path.name] = schema_document
              schema_id = schema_document.get("$id")
              if schema_id:
                  registry = registry.with_resource(
                      schema_id,
                      Resource.from_contents(schema_document),
                  )

          pairs = [
              ("multifamily-building.schema.json", "multifamily-building-synthetic-v0.1.json"),
              ("multifamily-service-distribution.schema.json", "multifamily-service-distribution-synthetic-v0.1.json"),
              ("multifamily-service-stress-corpus.schema.json", "multifamily-service-stress-corpus-v0.1.json"),
              ("multifamily-resident-programme.schema.json", "multifamily-resident-programme-synthetic-v0.1.json"),
              ("multifamily-unit-layout.schema.json", "multifamily-unit-layout-synthetic-v0.1.json"),
              ("multifamily-unit-layout-corpus.schema.json", "multifamily-unit-layout-corpus-v0.1.json"),
              ("site-foundation-evidence.schema.json", "site-foundation-evidence-synthetic-v0.1.json"),
              ("home-service-stack.schema.json", "home-service-interface-synthetic-v0.1.json"),
          ]

          for schema_name, fixture_name in pairs:
              schema = schema_documents[schema_name]
              fixture = json.loads((root / fixture_name).read_text(encoding="utf-8"))
              validator = Draft202012Validator(schema, registry=registry)
              errors = sorted(validator.iter_errors(fixture), key=lambda e: list(e.absolute_path))
              if errors:
                  rendered = "\\n".join(
                      f"{schema_name} -> {fixture_name} at {list(err.absolute_path)}: {err.message}"
                      for err in errors
                  )
                  raise SystemExit(rendered)
              print(f"PASS Draft 2020-12: {fixture_name} against {schema_name}")

          # Validate each appliance profile against its dedicated child schema.
          interface_schema = schema_documents["home-service-interface.schema.json"]
          stack_fixture = json.loads((root / "home-service-interface-synthetic-v0.1.json").read_text(encoding="utf-8"))
          child_validator = Draft202012Validator(interface_schema, registry=registry)
          for profile in stack_fixture["service_profiles"]:
              errors = sorted(child_validator.iter_errors(profile), key=lambda e: list(e.absolute_path))
              if errors:
                  rendered = "\\n".join(
                      f"home-service-interface.schema.json -> {profile.get('profile_id')} at {list(err.absolute_path)}: {err.message}"
                      for err in errors
                  )
                  raise SystemExit(rendered)
              print(f"PASS Draft 2020-12: {profile['profile_id']} against home-service-interface.schema.json")
          PY
