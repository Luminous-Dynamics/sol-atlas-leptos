name: Home multi-family synthetic qualifier

on:
  pull_request:
    paths:
      - "src/bin/home-multifamily-qualifier.rs"
      - "docs/research/home-delivery-systems/multifamily-building.schema.json"
      - "docs/research/home-delivery-systems/multifamily-building-synthetic-v0.1.json"
      - "docs/research/home-delivery-systems/multifamily-adversarial-corpus-v0.1.json"
      - ".github/workflows/home-multifamily-qualifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-multifamily-qualifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: rustfmt (qualifier only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check qualifier formatting
        run: rustfmt --edition 2024 --check src/bin/home-multifamily-qualifier.rs

  native:
    name: native qualifier tests and replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run focused tests
        run: cargo test --locked --bin home-multifamily-qualifier
      - name: Run frozen fixture replay
        run: cargo run --locked --bin home-multifamily-qualifier -- --self-test
