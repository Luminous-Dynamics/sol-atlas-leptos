name: GMD trajectory clock verifier

on:
  pull_request:
    paths:
      - "tools/gmd-trajectory-clock-verifier/**"
      - "docs/research/gmd-ibr-protection/**"
      - ".github/workflows/gmd-trajectory-clock-verifier.yml"
  push:
    paths:
      - "tools/gmd-trajectory-clock-verifier/**"
      - "docs/research/gmd-ibr-protection/**"
      - ".github/workflows/gmd-trajectory-clock-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmd-trajectory-clock-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format verifier
        run: cargo fmt --manifest-path tools/gmd-trajectory-clock-verifier/Cargo.toml -- --check
      - name: Run locked Clippy
        run: cargo clippy --manifest-path tools/gmd-trajectory-clock-verifier/Cargo.toml --all-targets --locked -- -D warnings
      - name: Run locked tests
        run: cargo test --manifest-path tools/gmd-trajectory-clock-verifier/Cargo.toml --locked
      - name: Verify frozen synthetic experiment
        run: |
          cargo run --manifest-path tools/gmd-trajectory-clock-verifier/Cargo.toml --locked -- \
            docs/research/gmd-ibr-protection/fixtures/gmd_trajectory_clock_experiment_v0_1.json \
            > /tmp/gmd-trajectory-clock-report.json
          grep -q '"nominal_frequency_millihz": 50000' /tmp/gmd-trajectory-clock-report.json
          grep -q '"sample_count": 5' /tmp/gmd-trajectory-clock-report.json
          grep -q '"full_cycle_uncertainty": false' /tmp/gmd-trajectory-clock-report.json
