name: Heritage Hard-Negative Scorecard Qualification

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/heritage_hard_negative.rs"
      - "sol-atlas-core/src/heritage_benchmark_metrics.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "schemas/heritage-hard-negative-input-v0.1.schema.json"
      - "schemas/heritage-hard-negative-report-v0.1.schema.json"
      - "schemas/examples/heritage-hard-negative-input-synthetic-v0.1.json"
      - "schemas/examples/heritage-hard-negative-report-synthetic-v0.1.json"
      - "docs/research/heritage-hard-negative-v0.1.md"
      - ".github/workflows/heritage-hard-negative.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check core formatting
        run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml -- --check
      - name: Run core unit tests
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Draft 2020-12 schemas, fixtures and negative controls
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          base = Path("schemas")
          input_schema = json.loads((base / "heritage-hard-negative-input-v0.1.schema.json").read_text())
          report_schema = json.loads((base / "heritage-hard-negative-report-v0.1.schema.json").read_text())
          Draft202012Validator.check_schema(input_schema)
          Draft202012Validator.check_schema(report_schema)
          input_validator = Draft202012Validator(input_schema)
          report_validator = Draft202012Validator(report_schema)

          input_fixture = json.loads((base / "examples/heritage-hard-negative-input-synthetic-v0.1.json").read_text())
          report_fixture = json.loads((base / "examples/heritage-hard-negative-report-synthetic-v0.1.json").read_text())
          input_validator.validate(input_fixture)
          report_validator.validate(report_fixture)

          malformed = copy.deepcopy(input_fixture)
          malformed["units"][0]["reference_coverage_complete"] = False
          assert list(input_validator.iter_errors(malformed)), "incomplete reference area passed"

          malformed = copy.deepcopy(input_fixture)
          malformed["confidence_threshold"] = 1.5
          assert list(input_validator.iter_errors(malformed)), "invalid confidence threshold passed"

          malformed = copy.deepcopy(report_fixture)
          malformed["claim_ceiling"] = "archaeological_truth"
          assert list(report_validator.iter_errors(malformed)), "elevated claim ceiling passed"

          print("Draft 2020-12 input/output schemas, 2 positive fixtures and 3 negative controls passed")
          PY
