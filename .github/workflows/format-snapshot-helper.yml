name: Format snapshot helper

on:
  pull_request:
    paths:
      - "src/**/*.rs"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Emit formatted sources
        run: |
          for file in src/app.rs src/components/evidence_terminal.rs src/data/replay_resolution.rs; do
            echo "===== ${file} ====="
            cat "${file}"
          done
