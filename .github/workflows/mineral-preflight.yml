name: Mineral prospectivity preflight tests

on:
  pull_request:
    paths:
      - "scripts/mineral-prospectivity/**"
      - "tests/test_inspect_bundle.py"
      - ".github/workflows/mineral-preflight.yml"
  push:
    branches: [main]
    paths:
      - "scripts/mineral-prospectivity/**"
      - "tests/test_inspect_bundle.py"
      - ".github/workflows/mineral-preflight.yml"

permissions:
  contents: read

jobs:
  python-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -p "test_inspect_bundle.py" -v
      - name: Check command-line help
        run: python scripts/mineral-prospectivity/inspect_bundle.py --help
