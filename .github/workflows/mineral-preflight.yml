name: Mineral prospectivity preflight tests

on:
  pull_request:
    paths:
      - "scripts/mineral-prospectivity/**"
      - "tests/test_inspect*.py"
      - ".github/workflows/mineral-preflight.yml"
  push:
    branches: [main]
    paths:
      - "scripts/mineral-prospectivity/**"
      - "tests/test_inspect*.py"
      - ".github/workflows/mineral-preflight.yml"

permissions:
  contents: read

jobs:
  python-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -p "test_inspect*.py" -v
      - name: Check command-line help
        run: |
          python scripts/mineral-prospectivity/inspect_bundle.py --help
          python scripts/mineral-prospectivity/inspect_gis.py --help
