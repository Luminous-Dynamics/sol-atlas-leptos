name: Normalize federated inventory Rust sources

on:
  push:
    branches:
      - research/federated-source-inventory-v0-1-integrated
    paths:
      - "sol-atlas-core/src/built_environment_source_inventory.rs"
      - "sol-atlas-core/src/industry_assurance_projection.rs"
      - "sol-atlas-core/src/lib.rs"
      - ".github/workflows/normalize-federated-source-inventory.yml"

permissions:
  contents: write

concurrency:
  group: normalize-federated-inventory
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format both root package and core crate
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sol-atlas-core/src/built_environment_source_inventory.rs sol-atlas-core/src/industry_assurance_projection.rs sol-atlas-core/src/lib.rs
          if git diff --cached --quiet; then
            echo "Rust sources are already formatted"
          else
            git commit -m "style: format federated inventory verifier and projection integration"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          cargo fmt --manifest-path Cargo.toml --check
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml --check
