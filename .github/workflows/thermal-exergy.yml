name: Thermal exergy accounting oracle

on:
  push:
    branches: [main]
    paths:
      - "sol-atlas-core/src/thermal_exergy.rs"
      - "sol-atlas-core/src/bin/thermal_exergy_assess.rs"
      - "sol-atlas-core/src/lib.rs"
      - "schemas/thermal-exergy-*.schema.json"
      - "schemas/examples/thermal-exergy-*.synthetic.json"
      - "docs/benchmarks/THERMAL_EXERGY_V0_1.md"
      - ".github/workflows/thermal-exergy.yml"
  pull_request:
    paths:
      - "sol-atlas-core/src/thermal_exergy.rs"
      - "sol-atlas-core/src/bin/thermal_exergy_assess.rs"
      - "sol-atlas-core/src/lib.rs"
      - "schemas/thermal-exergy-*.schema.json"
      - "schemas/examples/thermal-exergy-*.synthetic.json"
      - "docs/benchmarks/THERMAL_EXERGY_V0_1.md"
      - ".github/workflows/thermal-exergy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  thermal-exergy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-thermal-exergy-${{ hashFiles('**/Cargo.lock') }}
      - name: Run thermal exergy oracle tests
        run: cargo test -p sol-atlas-core --lib thermal_exergy
      - name: Run receipt-wrapped CLI tests
        run: cargo test -p sol-atlas-core --bin thermal_exergy_assess
      - name: Produce frozen synthetic assessment
        run: cargo run -p sol-atlas-core --bin thermal_exergy_assess -- schemas/examples/thermal-exergy-80c.synthetic.json > /tmp/thermal-exergy-report.json
      - name: Install pinned JSON Schema validator (CI tooling only)
        run: python -m pip install --disable-pip-version-check "jsonschema[format]==4.26.0"
      - name: Validate schemas, analytical values, and receipt bindings
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          fixture_path = Path("schemas/examples/thermal-exergy-80c.synthetic.json")
          fixture_bytes = fixture_path.read_bytes()
          request = json.loads(fixture_bytes)
          report = json.loads(Path("/tmp/thermal-exergy-report.json").read_text())
          request_schema = json.loads(Path("schemas/thermal-exergy-request-v0.1.schema.json").read_text())
          report_schema = json.loads(Path("schemas/thermal-exergy-report-v1.schema.json").read_text())
          Draft202012Validator.check_schema(request_schema)
          Draft202012Validator.check_schema(report_schema)
          Draft202012Validator(request_schema, format_checker=FormatChecker()).validate(request)
          Draft202012Validator(report_schema, format_checker=FormatChecker()).validate(report)

          assessment = report["assessment"]
          receipt = report["receipt"]
          assert hashlib.sha256(fixture_bytes).hexdigest() == receipt["input_sha256"]
          encoded_assessment = json.dumps(assessment, separators=(",", ":"), ensure_ascii=False).encode()
          assert hashlib.sha256(encoded_assessment).hexdigest() == receipt["assessment_sha256"]
          assert abs(assessment["thermal_exergy_kwh"] - 6.795979045731277) < 1e-12
          assert abs(assessment["exergy_fraction"] - (60.0 / 353.15)) < 1e-14
          assert abs(assessment["energy_minus_exergy_kwh"] - 33.20402095426872) < 1e-12
          assert 0.0 <= assessment["exergy_fraction"] <= 1.0
          assert assessment["thermal_exergy_kwh"] <= assessment["heat_quantity_kwh"]
          assert assessment["synthetic"] is True
          assert "not delivered work" in assessment["claim_ceiling"]
          assert "does not authenticate evidence" in receipt["verification_boundary"]
          print("thermal exergy schemas, known answer, claim ceiling and digest bindings passed")
          PY
