name: IEAC runtime admission

on:
  pull_request:
    paths:
      - "tools/industry-runtime-admission/**"
      - "tools/industry-assurance-validator/**"
      - "schemas/industry-runtime-admission-*.json"
      - "schemas/industry-runtime-profile-pin-v0.1.schema.json"
      - "schemas/examples/industry-runtime-profile-pin-synthetic-v0.1.json"
      - "schemas/examples/industry-runtime-admission-*.json"
      - "schemas/industry-signed-envelope-v0.2.schema.json"
      - "schemas/examples/ieac-signed-envelope-synthetic-v0.2.json"
      - "schemas/examples/ieac-jcs-vectors-v0.2.json"
      - "schemas/industry-scitt-decision-statement-v0.1.schema.json"
      - "schemas/industry-scitt-witness-observation-v0.1.schema.json"
      - "schemas/examples/ieac-scitt-witness-observation-synthetic-v0.1.json"
      - "docs/industry/IEAC_SCITT_WITNESS_OBSERVATION_V0.1.md"
      - "schemas/examples/ieac-scitt-decision-statement-synthetic-v0.1.json"
      - "docs/industry/IEAC_SCITT_TRANSPARENCY_V0.1.md"
      - "docs/industry/IEAC_TRUST_V0.2_SIGNED_ENVELOPE_PROFILE.md"
      - "schemas/industry-assurance-qualification-profile-v0.1.schema.json"
      - "schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json"
      - "docs/industry/IEAC_RUNTIME_ADMISSION_V0.1.md"
      - ".github/workflows/industry-runtime-admission.yml"
  push:
    branches:
      - main
      - feat/ieac-runtime-admission-v0-1
    paths:
      - "tools/industry-runtime-admission/**"
      - "tools/industry-assurance-validator/**"
      - "schemas/industry-runtime-admission-*.json"
      - "schemas/industry-runtime-profile-pin-v0.1.schema.json"
      - "schemas/examples/industry-runtime-profile-pin-synthetic-v0.1.json"
      - "schemas/examples/industry-runtime-admission-*.json"
      - "schemas/industry-signed-envelope-v0.2.schema.json"
      - "schemas/examples/ieac-signed-envelope-synthetic-v0.2.json"
      - "schemas/examples/ieac-jcs-vectors-v0.2.json"
      - "schemas/industry-scitt-decision-statement-v0.1.schema.json"
      - "schemas/industry-scitt-witness-observation-v0.1.schema.json"
      - "schemas/examples/ieac-scitt-witness-observation-synthetic-v0.1.json"
      - "docs/industry/IEAC_SCITT_WITNESS_OBSERVATION_V0.1.md"
      - "schemas/examples/ieac-scitt-decision-statement-synthetic-v0.1.json"
      - "docs/industry/IEAC_SCITT_TRANSPARENCY_V0.1.md"
      - "docs/industry/IEAC_TRUST_V0.2_SIGNED_ENVELOPE_PROFILE.md"
      - "schemas/industry-assurance-qualification-profile-v0.1.schema.json"
      - "schemas/examples/industry-assurance-qualification-profile-synthetic-v0.1.json"
      - ".github/workflows/industry-runtime-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieac-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-admission:
    name: Exact-head runtime admission and independent replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: |
          cargo fmt --manifest-path tools/industry-assurance-validator/Cargo.toml -- --check
          cargo fmt --manifest-path tools/industry-runtime-admission/Cargo.toml -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path tools/industry-runtime-admission/Cargo.toml --all-targets --locked -- -D warnings

      - name: Run static and runtime adversarial tests
        run: |
          cargo test --manifest-path tools/industry-assurance-validator/Cargo.toml --locked
          cargo test --manifest-path tools/industry-runtime-admission/Cargo.toml --locked

      - name: Execute synthetic admission and separate report checker
        run: |
          set -euo pipefail
          profile=schemas/examples/industry-runtime-admission-profile-synthetic-v0.1.json
          pin=schemas/examples/industry-runtime-profile-pin-synthetic-v0.1.json
          request=schemas/examples/industry-runtime-admission-request-synthetic-v0.1.json
          report="$RUNNER_TEMP/runtime-admission-report.json"
          cargo run --manifest-path tools/industry-runtime-admission/Cargo.toml --locked -- "$profile" "$pin" "$request" "$report"
          jq -e '
            .schema_version == "luminous.ieac-runtime-admission-report.v0.1" and
            .admission == "admit_descriptive" and
            .highest_permitted_action == "annotate" and
            .independent_checker.status == "passed" and
            .independent_checker.errors == [] and
            (.report_sha256 | test("^[0-9a-f]{64}$"))
          ' "$report"
          cargo run --manifest-path tools/industry-runtime-admission/Cargo.toml --locked --bin industry-runtime-check -- "$profile" "$pin" "$request" "$report"

      - name: Execute frozen stratified admission benchmark and verify case ledger
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/ieac-admission-benchmark-smoke.json"
          cases="$RUNNER_TEMP/ieac-admission-cases.jsonl"
          cargo run --manifest-path tools/industry-runtime-admission/Cargo.toml --locked --bin industry-admission-benchmark -- \
            --manifest schemas/examples/ieac-runtime-admission-benchmark-manifest-synthetic-v0.1.json \
            --cases-jsonl "$cases" \
            --output "$report"
          cargo run --manifest-path tools/industry-runtime-admission/Cargo.toml --locked --bin industry-admission-corpus-check -- "$cases" "$report"
          jq -e '
            .schema_version == "luminous.ieac-runtime-admission-benchmark-report.v0.1" and
            .summary.negative_trials > 0 and
            .summary.false_admissions == 0 and
            .summary.positive_admission_coverage == 1 and
            .summary.negative_non_admission_rate == 1 and
            .summary.candidate_checker_disagreements == 0 and
            .summary.expected_disposition_mismatches == 0 and
            .summary.expected_reason_code_misses == 0 and
            .summary.report_tamper_checks == .summary.report_tamper_detected and
            .summary.deterministic_replay_mismatches == 0 and
            .case_ledger.schema_version == "luminous.ieac-runtime-admission-case-ledger.v0.1" and
            .case_ledger.record_count == 1900 and
            .case_ledger.footer_record == true and
            (.case_ledger.case_records_sha256 | test("^[0-9a-f]{64}$")) and
            (.case_ledger.prefix_sha256 | test("^[0-9a-f]{64}$")) and
            (.strata | length == 19)
          ' "$report"

      - name: Retain exact benchmark report and case ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieac-runtime-admission-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/ieac-admission-benchmark-smoke.json
            ${{ runner.temp }}/ieac-admission-cases.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Prove locked dependency graphs remain committed
        run: git diff --exit-code -- tools/industry-assurance-validator/Cargo.lock tools/industry-runtime-admission/Cargo.lock

  schema-conformance:
    name: Draft 2020-12 meta-schema, fixtures and negative controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust for pinned schema CLI
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned Draft 2020-12 validator
        run: cargo install --locked jsonschema-cli --version 0.60.2 --root "$RUNNER_TEMP/jsonschema-cli"

      - name: Add schema CLI to PATH
        run: echo "$RUNNER_TEMP/jsonschema-cli/bin" >> "$GITHUB_PATH"

      - name: Checkout the pinned IBAP v0.1 manifest schema
        uses: actions/checkout@v4
        with:
          repository: Luminous-Dynamics/sol-atlas-leptos
          ref: 979eb38609eaa4b2c9e14ed0acd6c0c17fe61b93
          path: .ibap-contract

      - name: Validate profile and runtime schemas against Draft 2020-12 meta-schema
        run: |
          set -euo pipefail
          meta=https://json-schema.org/draft/2020-12/schema
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-assurance-qualification-profile-v0.1.schema.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-runtime-admission-request-v0.1.schema.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-runtime-admission-report-v0.1.schema.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-runtime-profile-pin-v0.1.schema.json

      - name: Validate the frozen admission benchmark manifest against IBAP v0.1
        run: |
          set -euo pipefail
          jsonschema-cli validate --draft 2020 --assert-format --offline \\
            .ibap-contract/schemas/industrial-benchmark-run-manifest-v0.1.schema.json \\
            -i schemas/examples/ieac-runtime-admission-benchmark-manifest-synthetic-v0.1.json

      - name: Validate the runtime profile and request fixtures
        run: |
          set -euo pipefail
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-assurance-qualification-profile-v0.1.schema.json -i schemas/examples/industry-runtime-admission-profile-synthetic-v0.1.json
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-runtime-admission-request-v0.1.schema.json -i schemas/examples/industry-runtime-admission-request-synthetic-v0.1.json
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-runtime-profile-pin-v0.1.schema.json -i schemas/examples/industry-runtime-profile-pin-synthetic-v0.1.json

      - name: Validate IEAC v0.2 signed-envelope schema and JCS vector fixture
        run: |
          set -euo pipefail
          meta=https://json-schema.org/draft/2020-12/schema
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-signed-envelope-v0.2.schema.json
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-signed-envelope-v0.2.schema.json -i schemas/examples/ieac-signed-envelope-synthetic-v0.2.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/examples/ieac-jcs-vectors-v0.2.json
          payload="$(jq -cS '.payload' schemas/examples/ieac-signed-envelope-synthetic-v0.2.json)"
          expected="$(jq -r '.payload_sha256' schemas/examples/ieac-signed-envelope-synthetic-v0.2.json)"
          actual="$(printf '%s' "$payload" | sha256sum | awk '{print $1}')"
          test "$actual" = "$expected"
          jq -e '
            .schema_version == "luminous.ieac-jcs-vectors.v0.2" and
            .canonicalization == "RFC8785-JCS" and
            .digest_algorithm == "SHA-256" and
            (.vectors | length == 4) and
            all(.vectors[]; (.canonical_sha256 | test("^[0-9a-f]{64}$")))
          ' schemas/examples/ieac-jcs-vectors-v0.2.json
          while IFS= read -r vector; do
            decoded="$(printf '%s' "$vector" | base64 --decode)"
            canonical="$(printf '%s' "$decoded" | jq -r '.[0]')"
            expected="$(printf '%s' "$decoded" | jq -r '.[1]')"
            actual="$(printf '%s' "$canonical" | sha256sum | awk '{print $1}')"
            test "$actual" = "$expected"
          done < <(jq -r '.vectors[] | [.canonical_utf8, .canonical_sha256] | @base64' schemas/examples/ieac-jcs-vectors-v0.2.json)

      - name: Validate IEAC SCITT decision statements and synthetic causal chain
        run: |
          set -euo pipefail
          meta=https://json-schema.org/draft/2020-12/schema
          schema=schemas/industry-scitt-decision-statement-v0.1.schema.json
          fixture=schemas/examples/ieac-scitt-decision-statement-synthetic-v0.1.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i "$schema"
          jq -e '
            .fixture_schema_version == "luminous.ieac-scitt-fixture-corpus.v0.1" and
            .fixture_status == "synthetic_only" and
            .statement_content_type == "application/vnd.luminous.ieac.scitt-decision-statement.v0.1+json" and
            (.events | length == 4) and
            .expected.event_count == 4 and
            .expected.issuer_subject_streams == 3 and
            .expected.causal_edges == 3 and
            .expected.same_issuer_sequence_advances == 1 and
            .expected.latest_ieac_disposition == "abstain" and
            .expected.action_authority == "none"
          ' "$fixture"
          jq -c '.events[]' "$fixture" | while IFS= read -r event; do
            printf '%s\n' "$event" > "$RUNNER_TEMP/ieac-scitt-event.json"
            jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$RUNNER_TEMP/ieac-scitt-event.json"
          done
          # This fixture intentionally uses only ASCII strings and safe integers.
          # jq -cS therefore matches its frozen JCS byte representation here;
          # jq is not asserted to be a general RFC 8785 implementation.
          while IFS=        run: |
          set -euo pipefail
          source=schemas/examples/industry-runtime-admission-request-synthetic-v0.1.json
          schema=schemas/industry-runtime-admission-request-v0.1.schema.json
          jq '.unrecognized = true' "$source" > "$RUNNER_TEMP/unknown.json"
          jq '.as_of = "2026-99-99T99:99:99Z"' "$source" > "$RUNNER_TEMP/bad-time.json"
          for mutant in "$RUNNER_TEMP/unknown.json" "$RUNNER_TEMP/bad-time.json"; do
            if jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$mutant"; then
              echo "ERROR: request schema accepted negative control $mutant"
              exit 1
            fi
          done
\t' read -r event_id expected; do
            canonical="$(jq -cS --arg id "$event_id" '.events[] | select(.event_id == $id)' "$fixture")"
            actual="$(printf '%s' "$canonical" | sha256sum | awk '{print $1}')"
            test "$actual" = "$expected"
          done < <(jq -r '.expected.event_payload_sha256 | to_entries[] | [.key,.value] | @tsv' "$fixture")
          # Resolve every causal edge and predecessor against the frozen digest map.
          jq -e '
            def h($id): .expected.event_payload_sha256[$id];
            ([.events[] | select(.event_id == "event-verdict-001")][0].causal_parent_payload_sha256 == [h("event-request-001")]) and
            ([.events[] | select(.event_id == "event-outcome-001")][0].causal_parent_payload_sha256 == [h("event-verdict-001")]) and
            ([.events[] | select(.event_id == "event-verdict-002")][0].previous_event_payload_sha256 == h("event-verdict-001")) and
            ([.events[] | select(.event_id == "event-verdict-002")][0].causal_parent_payload_sha256 == [h("event-outcome-001")])
          ' "$fixture"
          # A widened action claim must be rejected by the payload schema.
          jq '.events[0].action_authority = "execute"' "$fixture" | jq -c '.events[0]' > "$RUNNER_TEMP/ieac-scitt-invalid.json"
          if jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$RUNNER_TEMP/ieac-scitt-invalid.json"; then
            echo "ERROR: SCITT fixture schema accepted an unauthorized action claim"
            exit 1
          fi

      - name: Validate SCITT witness observations and fork-vs-cross-service controls
        run: |
          set -euo pipefail
          meta=https://json-schema.org/draft/2020-12/schema
          schema=schemas/industry-scitt-witness-observation-v0.1.schema.json
          fixture=schemas/examples/ieac-scitt-witness-observation-synthetic-v0.1.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i "$schema"
          jq -c '.observations[]' "$fixture" | while IFS= read -r observation; do
            printf '%s\n' "$observation" > "$RUNNER_TEMP/ieac-scitt-witness-observation.json"
            jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$RUNNER_TEMP/ieac-scitt-witness-observation.json"
          done
          jq -e '
            .fixture_schema_version == "luminous.ieac-scitt-witness-fixture.v0.1" and
            .fixture_status == "synthetic_only" and
            (.observations | length == 5) and
            ([.observations[].observation_id] | unique | length) == (.observations | length) and
            ([.observations[] | select(.transparency_service_id == "ts:service-a" and .signed_tree_head.tree_size == 10)] | length) == 3 and
            ([.observations[] | select(.transparency_service_id == "ts:service-b" and .signed_tree_head.tree_size == 7)] | length) == 1 and
            .expected_structural_comparison.cross_ts_root_comparison == "not_comparable" and
            .expected_structural_comparison.witness_operator_diversity_for_equal_head == 2
          ' "$fixture"
          # A consistency proof is mandatory whenever a prior tree head is named.
          jq '.observations[1].consistency_proof_sha256 = null' "$fixture" > "$RUNNER_TEMP/witness-missing-consistency-proof.json"
          jq -e '.observations[1]' "$RUNNER_TEMP/witness-missing-consistency-proof.json" > "$RUNNER_TEMP/witness-mutated-observation.json"
          if jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$RUNNER_TEMP/witness-mutated-observation.json"; then
            echo "ERROR: witness schema accepted a prior head without its consistency proof"
            exit 1
          fi

      - name: Prove unknown request fields and malformed time are rejected
        run: |
          set -euo pipefail
          source=schemas/examples/industry-runtime-admission-request-synthetic-v0.1.json
          schema=schemas/industry-runtime-admission-request-v0.1.schema.json
          jq '.unrecognized = true' "$source" > "$RUNNER_TEMP/unknown.json"
          jq '.as_of = "2026-99-99T99:99:99Z"' "$source" > "$RUNNER_TEMP/bad-time.json"
          for mutant in "$RUNNER_TEMP/unknown.json" "$RUNNER_TEMP/bad-time.json"; do
            if jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$mutant"; then
              echo "ERROR: request schema accepted negative control $mutant"
              exit 1
            fi
          done
