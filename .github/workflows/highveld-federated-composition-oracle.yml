name: Highveld Federated Twin Composition Synthetic Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/highveld-federated-composition-bench/**"
      - "docs/research/highveld-keep/HIGHVELD_FEDERATED_COMPOSITION_OWNER_PROFILES_V0_1.json"
      - "docs/research/highveld-keep/HIGHVELD_KEEP_FEDERATED_TWIN_COMPOSITION_CORPUS_V0_1.json"
      - "docs/research/highveld-keep/HIGHVELD_KEEP_FEDERATED_TWIN_COMPOSITION_CORPUS_V0_1.schema.json"
      - ".github/workflows/highveld-federated-composition-oracle.yml"
  push:
    branches: ["main", "research/highveld-federated-composition-oracle-v0.1"]
    paths:
      - "tools/highveld-federated-composition-bench/**"
      - "docs/research/highveld-keep/HIGHVELD_FEDERATED_COMPOSITION_OWNER_PROFILES_V0_1.json"
      - "docs/research/highveld-keep/HIGHVELD_KEEP_FEDERATED_TWIN_COMPOSITION_CORPUS_V0_1.json"
      - "docs/research/highveld-keep/HIGHVELD_KEEP_FEDERATED_TWIN_COMPOSITION_CORPUS_V0_1.schema.json"
      - ".github/workflows/highveld-federated-composition-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: highveld-federated-composition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  composition-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check package formatting
        run: cargo fmt --manifest-path tools/highveld-federated-composition-bench/Cargo.toml --all -- --check
      - name: Run known-answer and hostile-input tests
        run: cargo test --locked --manifest-path tools/highveld-federated-composition-bench/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/highveld-federated-composition-bench/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact-head federated composition receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/highveld-federated-composition-bench/Cargo.toml -- \
            docs/research/highveld-keep/HIGHVELD_KEEP_FEDERATED_TWIN_COMPOSITION_CORPUS_V0_1.json \
            docs/research/highveld-keep/HIGHVELD_KEEP_FEDERATED_TWIN_COMPOSITION_CORPUS_V0_1.schema.json \
            docs/research/highveld-keep/HIGHVELD_FEDERATED_COMPOSITION_OWNER_PROFILES_V0_1.json \
            --source-commit "$source_commit" > highveld-federated-composition-receipt.json
          jq -e '
            .result == "pass"
            and .corpus_id == "HIGHVELD-FEDERATED-TWIN-COMPOSITION-CORPUS-V0.1"
            and .corpus_classification == "synthetic_fixture_only"
            and .scenario_count == 18
            and .failure_count == 0
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.corpus_schema_sha256 | test("^[0-9a-f]{64}$"))
            and (.owner_profiles_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and (.scenarios | length == 18)
            and (.scenarios | all(.status == "pass"))
            and .automatic_identity_merge_count == 0
            and .owner_payload_bytes_cryptographically_verified == false
            and .issuer_authentication == "not_performed"
            and .action_authority == "none"
            and .claim_ceiling == "synthetic_federated_composition_mechanics_only"
          ' highveld-federated-composition-receipt.json
      - name: Upload exact-head federated composition receipt
        uses: actions/upload-artifact@v4
        with:
          name: highveld-federated-composition-reference-receipt
          path: highveld-federated-composition-receipt.json
          if-no-files-found: error
          retention-days: 90
