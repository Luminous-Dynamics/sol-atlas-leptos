name: Semantic transformation receipt qualification

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/semantic_transformation_receipt.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "sol-atlas-core/Cargo.lock"
      - "schemas/semantic-transformation-receipt-v0.1.schema.json"
      - "schemas/examples/semantic-transformation-receipt-synthetic-v0.1.json"
      - ".github/workflows/semantic-transformation-receipt.yml"
  push:
    branches:
      - main
      - research/semantic-transformation-receipts-v0-1
    paths:
      - "sol-atlas-core/src/semantic_transformation_receipt.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "sol-atlas-core/Cargo.lock"
      - "schemas/semantic-transformation-receipt-v0.1.schema.json"
      - "schemas/examples/semantic-transformation-receipt-synthetic-v0.1.json"
      - ".github/workflows/semantic-transformation-receipt.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-transformation-receipt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-receipt:
    name: Exact-head semantic receipt Rust and schema qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format, lint, and test semantic transformation receipt
        run: |
          set -euo pipefail
          manifest=sol-atlas-core/Cargo.toml
          cargo fmt --manifest-path "$manifest" --check
          cargo clippy --manifest-path "$manifest" --locked --all-targets -- -D warnings
          cargo test --manifest-path "$manifest" --locked semantic_transformation_receipt

      - name: Install pinned Draft 2020-12 validator
        run: cargo install --locked jsonschema-cli --version 0.60.2 --root "$RUNNER_TEMP/jsonschema-cli"

      - name: Validate schema and frozen fixture
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/jsonschema-cli/bin:$PATH"
          schema=schemas/semantic-transformation-receipt-v0.1.schema.json
          fixture=schemas/examples/semantic-transformation-receipt-synthetic-v0.1.json
          meta_schema="$RUNNER_TEMP/draft-2020-12-meta-schema.json"
          curl --fail --location --retry 5 --retry-connrefused \
            https://json-schema.org/draft/2020-12/schema -o "$meta_schema"
          jsonschema-cli validate --draft 2020 --assert-format "$meta_schema" -i "$schema"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" -i "$fixture"
          jq -e '
            .schema_version == "luminous.semantic-transformation-receipt.v0.1" and
            .declared_claim == "equivalent_for_declared_profile" and
            (.source_inventory | length) == 2 and
            (.target_inventory | length) == 2 and
            (.mappings | length) == 2 and
            .action_authority == "none"
          ' "$fixture"

      - name: Negative schema control — reject undeclared fields
        run: |
          set -euo pipefail
          schema=schemas/semantic-transformation-receipt-v0.1.schema.json
          fixture=schemas/examples/semantic-transformation-receipt-synthetic-v0.1.json
          jq '.unexpected_claim = "semantically_equivalent"' "$fixture" \
            > "$RUNNER_TEMP/receipt-with-unknown-claim.json"
          if jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" \
              -i "$RUNNER_TEMP/receipt-with-unknown-claim.json"; then
            echo "ERROR: schema accepted an undeclared claim field"
            exit 1
          fi

      - name: Negative schema control — reject authority escalation
        run: |
          set -euo pipefail
          schema=schemas/semantic-transformation-receipt-v0.1.schema.json
          fixture=schemas/examples/semantic-transformation-receipt-synthetic-v0.1.json
          jq '.action_authority = "construction_release"' "$fixture" \
            > "$RUNNER_TEMP/receipt-with-action-authority.json"
          if jsonschema-cli validate --draft 2020 --assert-format --offline "$schema" \
              -i "$RUNNER_TEMP/receipt-with-action-authority.json"; then
            echo "ERROR: schema accepted action authority escalation"
            exit 1
          fi
