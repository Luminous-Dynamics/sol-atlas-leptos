name: IEAC trust-lifecycle impact auditor

on:
  pull_request:
    paths:
      - "tools/industry-trust-lifecycle-auditor/**"
      - "schemas/industry-assurance-dependency-graph-v0.1.schema.json"
      - "schemas/industry-assurance-invalidation-event-v0.1.schema.json"
      - "schemas/industry-assurance-impact-report-v0.1.schema.json"
      - "docs/industry/IEAC_IMPACT_DELTA_V0.1.md"
      - "schemas/examples/ieac-impact-delta-source-correction-synthetic-v0.1.json"
      - "schemas/industry-assurance-impact-delta-input-v0.1.schema.json"
      - "schemas/industry-assurance-impact-delta-batch-v0.1.schema.json"
      - "schemas/industry-assurance-impact-state-pin-v0.1.schema.json"
      - "schemas/industry-assurance-impact-delta-v0.1.schema.json"
      - "schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json"
      - "docs/industry/IEAC_TRUST_LIFECYCLE_V0.1.md"
      - ".github/workflows/industry-trust-lifecycle.yml"
  push:
    branches:
      - main
      - feat/ieac-trust-lifecycle-v0-1
    paths:
      - "tools/industry-trust-lifecycle-auditor/**"
      - "schemas/industry-assurance-dependency-graph-v0.1.schema.json"
      - "schemas/industry-assurance-invalidation-event-v0.1.schema.json"
      - "schemas/industry-assurance-impact-report-v0.1.schema.json"
      - "schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json"
      - "docs/industry/IEAC_TRUST_LIFECYCLE_V0.1.md"
      - ".github/workflows/industry-trust-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieac-trust-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Independent bitemporal dependency impact replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install pinned Draft 2020-12 validator
        run: cargo install --locked jsonschema-cli --version 0.60.2 --root "$RUNNER_TEMP/jsonschema-cli"

      - name: Add schema CLI to PATH
        run: echo "$RUNNER_TEMP/jsonschema-cli/bin" >> "$GITHUB_PATH"

      - name: Check package formatting
        run: cargo fmt --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml -- --check

      - name: Export exact rustfmt candidate when formatting fails
        if: failure()
        run: cargo fmt --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml

      - name: Retain rustfmt candidate for exact source review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ieac-trust-lifecycle-rustfmt-candidate
          path: tools/industry-trust-lifecycle-auditor/src/main.rs
          if-no-files-found: error
          retention-days: 3

      - name: Run package Clippy with warnings denied
        run: cargo clippy --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --all-targets -- -D warnings

      - name: Run standalone impact auditor tests and scale ladder
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ieac-impact-scale-results.log"

      - name: Retain exact scale-ladder output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieac-impact-scale-ladder-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ieac-impact-scale-results.log
          if-no-files-found: warn
          retention-days: 30

      - name: Validate dependency, invalidation and report schemas
        run: |
          set -euo pipefail
          meta=https://json-schema.org/draft/2020-12/schema
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-assurance-dependency-graph-v0.1.schema.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-assurance-invalidation-event-v0.1.schema.json
          jsonschema-cli validate --draft 2020 --assert-format "$meta" -i schemas/industry-assurance-impact-report-v0.1.schema.json

      - name: Replay synthetic bitemporal key-compromise impact
        run: |
          set -euo pipefail
          fixture=schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json
          schema_graph=schemas/industry-assurance-dependency-graph-v0.1.schema.json
          schema_event=schemas/industry-assurance-invalidation-event-v0.1.schema.json
          schema_report=schemas/industry-assurance-impact-report-v0.1.schema.json
          jq -e '.graph' "$fixture" > "$RUNNER_TEMP/assurance-graph.json"
          jq -e '.invalidation_event' "$fixture" > "$RUNNER_TEMP/invalidation-event.json"
          jq -e '.expected_impact_report' "$fixture" > "$RUNNER_TEMP/expected-impact-report.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema_graph" -i "$RUNNER_TEMP/assurance-graph.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema_event" -i "$RUNNER_TEMP/invalidation-event.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema_report" -i "$RUNNER_TEMP/expected-impact-report.json"

          cargo run --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-trust-lifecycle-audit -- \
            "$fixture" "$RUNNER_TEMP/impact-report.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema_report" -i "$RUNNER_TEMP/impact-report.json"
          jq -e '
            .schema_version == "luminous.ieac-assurance-impact-report.v0.1" and
            .summary.node_count == 17 and
            .summary.no_impact_count == 4 and
            .summary.historical_record_only_count == 6 and
            .summary.reverify_required_count == 3 and
            .summary.claim_invalidated_count == 1 and
            .summary.quarantined_pending_review_count == 3 and
            .historical_record_preserved == true and
            (.not_checked | length >= 5) and
            .action_authority == "none"
          ' "$RUNNER_TEMP/impact-report.json"

      - name: Reject uncertain or disputed retroactive boundaries
        run: |
          set -euo pipefail
          fixture=schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json
          jq '.invalidation_event.valid_time.effective_time_confidence = "unknown"' "$fixture" > "$RUNNER_TEMP/unknown-effective-time.json"
          jq '.invalidation_event.dispute_state = "disputed"' "$fixture" > "$RUNNER_TEMP/disputed-retroactive-event.json"
          for mutant in "$RUNNER_TEMP/unknown-effective-time.json" "$RUNNER_TEMP/disputed-retroactive-event.json"; do
            if cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-trust-lifecycle-audit -- "$mutant" "$RUNNER_TEMP/mutant-report.json"; then
              echo "ERROR: auditor accepted an uncertain/disputed retroactive invalidation"
              exit 1
            fi
          done

      - name: Reject cycle and out-of-scope mutations after digest recomputation
        run: |
          set -euo pipefail
          fixture=schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json
          jq '.graph.edges += [{"edge_id":"edge-cycle-negative","from_node_id":.graph.nodes[14].node_id,"to_node_id":.graph.nodes[0].node_id,"relation":"revoked_by"}]' "$fixture" > "$RUNNER_TEMP/cyclic-graph-raw.json"
          graph_hash="$(jq -cS '.graph | del(.graph_snapshot_sha256)' "$RUNNER_TEMP/cyclic-graph-raw.json" | sha256sum | awk '{print $1}')"
          jq --arg digest "$graph_hash" '.graph.graph_snapshot_sha256 = $digest' "$RUNNER_TEMP/cyclic-graph-raw.json" > "$RUNNER_TEMP/cyclic-graph.json"
          if cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-trust-lifecycle-audit -- "$RUNNER_TEMP/cyclic-graph.json" "$RUNNER_TEMP/cycle-report.json"; then
            echo "ERROR: auditor accepted a dependency cycle with a recomputed graph digest"
            exit 1
          fi

          jq '(.graph.nodes[] | select(.node_type == "issuer_key").scope.domain) = "water"' "$fixture" > "$RUNNER_TEMP/out-of-scope-graph-raw.json"
          graph_hash="$(jq -cS '.graph | del(.graph_snapshot_sha256)' "$RUNNER_TEMP/out-of-scope-graph-raw.json" | sha256sum | awk '{print $1}')"
          jq --arg digest "$graph_hash" '.graph.graph_snapshot_sha256 = $digest' "$RUNNER_TEMP/out-of-scope-graph-raw.json" > "$RUNNER_TEMP/out-of-scope-graph.json"
          if cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-trust-lifecycle-audit -- "$RUNNER_TEMP/out-of-scope-graph.json" "$RUNNER_TEMP/scope-report.json"; then
            echo "ERROR: auditor accepted an invalidation outside its declared node scope"
            exit 1
          fi

      - name: Reject expected-report tampering and duplicate JSON members
        run: |
          set -euo pipefail
          fixture=schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json
          jq '.expected_impact_report.results[2].impact_class = "claim_invalidated"' "$fixture" > "$RUNNER_TEMP/changed-impact-expectation.json"
          if cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-trust-lifecycle-audit -- "$RUNNER_TEMP/changed-impact-expectation.json" "$RUNNER_TEMP/changed-expectation-report.json"; then
            echo "ERROR: auditor accepted a tampered expected impact classification"
            exit 1
          fi
          printf '%s\n' '{"fixture_status":"synthetic_only","fixture_status":"synthetic_only"}' > "$RUNNER_TEMP/duplicate-members.json"
          if cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-trust-lifecycle-audit -- "$RUNNER_TEMP/duplicate-members.json" "$RUNNER_TEMP/duplicate-members-report.json"; then
            echo "ERROR: auditor accepted duplicate JSON object member names"
            exit 1
          fi

      - name: Validate sparse impact-delta contracts and source-correction fixture
        shell: bash
        run: |
          set -euo pipefail
          meta=https://json-schema.org/draft/2020-12/schema
          schema_graph=schemas/industry-assurance-dependency-graph-v0.1.schema.json
          schema_event=schemas/industry-assurance-invalidation-event-v0.1.schema.json
          schema_report=schemas/industry-assurance-impact-report-v0.1.schema.json
          schema_delta=schemas/industry-assurance-impact-delta-v0.1.schema.json
          schema_pin=schemas/industry-assurance-impact-state-pin-v0.1.schema.json
          schema_batch=schemas/industry-assurance-impact-delta-batch-v0.1.schema.json
          schema_input=schemas/industry-assurance-impact-delta-input-v0.1.schema.json
          fixture=schemas/examples/ieac-impact-delta-source-correction-synthetic-v0.1.json

          for schema in "$schema_delta" "$schema_pin" "$schema_batch" "$schema_input"; do
            jsonschema-cli validate --draft 2020 --assert-format "$meta" -i "$schema"
          done
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema_input" -i "$fixture"
          jq -e '.events | length == 1' "$fixture"
          jq -e '.events[0]' "$fixture" > "$RUNNER_TEMP/delta-source-correction-event.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline "$schema_event" -i "$RUNNER_TEMP/delta-source-correction-event.json"

      - name: Bootstrap exact full-report base and run sparse impact delta
        shell: bash
        run: |
          set -euo pipefail
          base_fixture=schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json
          delta_input=schemas/examples/ieac-impact-delta-source-correction-synthetic-v0.1.json
          graph="$RUNNER_TEMP/delta-graph.json"
          base_report="$RUNNER_TEMP/delta-base-report.json"
          base_pin="$RUNNER_TEMP/delta-base-state-pin.json"
          batch="$RUNNER_TEMP/impact-delta-batch.json"
          jq -e '.graph' "$base_fixture" > "$graph"
          jq -e '.expected_impact_report' "$base_fixture" > "$base_report"

          event_head="$(jq -r '.expected_impact_report.invalidation_event_sha256' "$base_fixture")"
          recorded_at="$(jq -r '.invalidation_event.system_time.recorded_at' "$base_fixture")"
          trusted_at="$(jq -r '.invalidation_event.system_time.trusted_at' "$base_fixture")"
          cargo run --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-impact-delta --             pin "$graph" "$base_report" 1 "$event_head" "$recorded_at" "$trusted_at" "$base_pin"
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-assurance-impact-state-pin-v0.1.schema.json -i "$base_pin"

          cargo run --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-impact-delta --             "$graph" "$base_report" "$base_pin" "$delta_input" "$batch"
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-assurance-impact-delta-batch-v0.1.schema.json -i "$batch"

          jq -e '.deltas | length == 1' "$batch"
          jq -e '.deltas[0]' "$batch" > "$RUNNER_TEMP/impact-delta.json"
          jq -e '.resulting_impact_report' "$batch" > "$RUNNER_TEMP/impact-delta-result-report.json"
          jq -e '.next_state_pin' "$batch" > "$RUNNER_TEMP/impact-delta-next-pin.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-assurance-impact-delta-v0.1.schema.json -i "$RUNNER_TEMP/impact-delta.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-assurance-impact-report-v0.1.schema.json -i "$RUNNER_TEMP/impact-delta-result-report.json"
          jsonschema-cli validate --draft 2020 --assert-format --offline schemas/industry-assurance-impact-state-pin-v0.1.schema.json -i "$RUNNER_TEMP/impact-delta-next-pin.json"

          jq -e '
            .schema_version == "luminous.ieac-assurance-impact-delta-batch.v0.1" and
            .complete == true and
            .graph_index_build_count == 1 and
            .graph_index_reused_for_events == 1 and
            .event_count == 1 and
            .delta_count == 1 and
            .resulting_event_sequence == 2 and
            .resulting_impact_report_sha256 == .next_state_pin.impact_report_sha256 and
            .resulting_event_chain_head_sha256 == .next_state_pin.event_chain_head_sha256 and
            .deltas[0].closure_complete == true and
            .deltas[0].affected_node_count > 0 and
            .deltas[0].update_count <= .deltas[0].affected_node_count and
            (.deltas[0].direct_target_node_ids | length == 1) and
            (.deltas[0].affected_node_ids | length >= 1) and
            ([.deltas[0].updates[] | select(.impact_class == "no_impact")] | length == 0) and
            (([.deltas[0].updates[] | select(.impact_class == "claim_invalidated") | .node_id] - .deltas[0].direct_target_node_ids) | length == 0)
          ' "$batch"
          jq -e '
            .summary.node_count == 17 and
            .historical_record_preserved == true and
            .action_authority == "none" and
            .claim_ceiling == "incomplete_or_indeterminate"
          ' "$RUNNER_TEMP/impact-delta-result-report.json"

      - name: Reject stale-base and backdated-event delta inputs
        shell: bash
        run: |
          set -euo pipefail
          base_fixture=schemas/examples/ieac-trust-lifecycle-key-compromise-synthetic-v0.1.json
          delta_input=schemas/examples/ieac-impact-delta-source-correction-synthetic-v0.1.json
          graph="$RUNNER_TEMP/negative-delta-graph.json"
          base_report="$RUNNER_TEMP/negative-delta-base-report.json"
          base_pin="$RUNNER_TEMP/negative-delta-base-pin.json"
          jq -e '.graph' "$base_fixture" > "$graph"
          jq -e '.expected_impact_report' "$base_fixture" > "$base_report"
          event_head="$(jq -r '.expected_impact_report.invalidation_event_sha256' "$base_fixture")"
          recorded_at="$(jq -r '.invalidation_event.system_time.recorded_at' "$base_fixture")"
          trusted_at="$(jq -r '.invalidation_event.system_time.trusted_at' "$base_fixture")"
          cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-impact-delta --             pin "$graph" "$base_report" 1 "$event_head" "$recorded_at" "$trusted_at" "$base_pin"

          jq '.report_id = "tampered-base-report"' "$base_report" > "$RUNNER_TEMP/stale-base-report.json"
          if cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-impact-delta --             "$graph" "$RUNNER_TEMP/stale-base-report.json" "$base_pin" "$delta_input" "$RUNNER_TEMP/stale-base-output.json"; then
            echo "ERROR: delta processor accepted a state pin for a different base report"
            exit 1
          fi

          jq '.events[0].system_time.recorded_at = "2026-10-31T09:59:00Z" |
              .events[0].system_time.trusted_at = "2026-10-31T10:00:00Z"'               "$delta_input" > "$RUNNER_TEMP/backdated-delta-input.json"
          if cargo run --quiet --locked --manifest-path tools/industry-trust-lifecycle-auditor/Cargo.toml --bin industry-impact-delta --             "$graph" "$base_report" "$base_pin" "$RUNNER_TEMP/backdated-delta-input.json" "$RUNNER_TEMP/backdated-output.json"; then
            echo "ERROR: delta processor accepted recorded/trusted time rollback"
            exit 1
          fi
