name: Energy Dispatch Exact-Search Profiler

on:
  pull_request:
    paths:
      - "tools/energy-dispatch-profile-runner/**"
      - "tools/energy-dispatch-schedule-auditor/**"
      - "tools/energy-solver-compute-calibration/**"
      - "sol-atlas-core/src/energy_dispatch.rs"
      - "sol-atlas-core/src/energy_pathway.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "schemas/examples/energy-dispatch-pv-outage.synthetic.json"
      - "schemas/examples/energy-dispatch-scenario-panel-v0.1.json"
      - "schemas/examples/energy-dispatch-scenarios/**"
      - "schemas/energy-dispatch-scenario-panel-v0.1.schema.json"
      - ".github/workflows/energy-dispatch-profiled-runner.yml"
  push:
    branches:
      - "research/energy-solver-compute-calibration-*"
    paths:
      - "tools/energy-dispatch-profile-runner/**"
      - "tools/energy-dispatch-schedule-auditor/**"
      - "tools/energy-solver-compute-calibration/**"
      - "sol-atlas-core/src/energy_dispatch.rs"
      - "sol-atlas-core/src/energy_pathway.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "schemas/examples/energy-dispatch-pv-outage.synthetic.json"
      - ".github/workflows/energy-dispatch-profiled-runner.yml"
permissions:
  contents: read

concurrency:
  group: energy-dispatch-profiled-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-dispatch-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/energy-dispatch-profiled-runner/cargo-target
      EXPECTED_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact source subject
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Format both v0.2 and v0.3 profiler binaries
        run: cargo fmt --package energy-dispatch-profile-runner --check
      - name: Check exact-search profiler against the committed locked core
        run: cargo check --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-profile
      - name: Run v0.2 and v0.3 profiler positive/negative controls
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-profile
          cargo check --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-anytime-profile
          cargo test --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-anytime-profile
      - name: Format and test the independent schedule and service-floor auditors
        run: |
          set -euo pipefail
          cargo fmt --manifest-path tools/energy-dispatch-schedule-auditor/Cargo.toml --all --check
          cargo test --locked --manifest-path tools/energy-dispatch-schedule-auditor/Cargo.toml --all-targets
          cargo clippy --manifest-path tools/energy-dispatch-schedule-auditor/Cargo.toml --all-targets --locked -- -D warnings
      - name: Strict Clippy for both profiler binaries
        run: |
          set -euo pipefail
          cargo clippy --no-deps --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-profile -- -D warnings
          cargo clippy --no-deps --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-anytime-profile -- -D warnings
      - name: Build v0.2/v0.3 profilers, independent auditors and both trace aggregators
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-profile
          cargo build --release --locked --manifest-path tools/energy-dispatch-profile-runner/Cargo.toml --bin energy-dispatch-anytime-profile
          cargo build --release --locked --manifest-path tools/energy-dispatch-schedule-auditor/Cargo.toml --bin energy-dispatch-schedule-auditor
          cargo build --release --locked --manifest-path tools/energy-dispatch-schedule-auditor/Cargo.toml --bin energy-dispatch-service-floor-auditor
          cargo build --release --locked --manifest-path tools/energy-solver-compute-calibration/Cargo.toml --bin energy-solver-compute-calibration
          cargo build --release --locked --manifest-path tools/energy-solver-compute-calibration/Cargo.toml --bin energy-solver-compute-calibration-v03
      - name: Execute 30 exact-search runs and independently audit every selected schedule
        run: |
          set -euo pipefail
          mkdir -p target/energy-dispatch-profiled-runner
          panel_sha="$(sha256sum schemas/examples/energy-dispatch-pv-outage.synthetic.json | awk '{print $1}')"
          profiler="$CARGO_TARGET_DIR/release/energy-dispatch-profile"
          auditor="$CARGO_TARGET_DIR/release/energy-dispatch-schedule-auditor"
          service_floor_auditor="$CARGO_TARGET_DIR/release/energy-dispatch-service-floor-auditor"
          service_floor_policy="tools/energy-dispatch-schedule-auditor/fixtures/energy-dispatch-pv-outage.service-floor-v0.1.json"
          for sample in $(seq -w 1 30); do
            "$profiler" \
              schemas/examples/energy-dispatch-pv-outage.synthetic.json \
              "$panel_sha" \
              target/energy-dispatch-profiled-runner/trace.csv \
              "target/energy-dispatch-profiled-runner/report-$sample.json" \
              "target/energy-dispatch-profiled-runner/schedule-$sample.json"
            request_sha="$(jq -r '.request_sha256' "target/energy-dispatch-profiled-runner/report-$sample.json")"
            schedule_sha="$(jq -r '.schedule_sha256' "target/energy-dispatch-profiled-runner/report-$sample.json")"
            "$auditor" \
              schemas/examples/energy-dispatch-pv-outage.synthetic.json \
              "target/energy-dispatch-profiled-runner/schedule-$sample.json" \
              "target/energy-dispatch-profiled-runner/audit-receipt-$sample.json"
            jq --arg request_sha "$request_sha" --arg schedule_sha "$schedule_sha" -e '
              .disposition == "accepted" and
              .request_sha256 == $request_sha and
              .schedule_sha256 == $schedule_sha and
              all(.findings[]; .passed == true) and
              (.auditor_binary_sha256 | length == 64) and
              (.receipt_sha256 | length == 64)
            ' "target/energy-dispatch-profiled-runner/audit-receipt-$sample.json"

            "$service_floor_auditor" \
              schemas/examples/energy-dispatch-pv-outage.synthetic.json \
              "target/energy-dispatch-profiled-runner/schedule-$sample.json" \
              "$service_floor_policy" \
              "target/energy-dispatch-profiled-runner/audit-receipt-$sample.json" \
              "target/energy-dispatch-profiled-runner/service-floor-receipt-$sample.json"

            audit_receipt_sha="$(jq -r '.receipt_sha256' "target/energy-dispatch-profiled-runner/audit-receipt-$sample.json")"
            jq --arg request_sha "$request_sha" --arg schedule_sha "$schedule_sha" --arg audit_sha "$audit_receipt_sha" -e '
              .disposition == "passed" and
              .request_sha256 == $request_sha and
              .schedule_sha256 == $schedule_sha and
              .schedule_audit_receipt_sha256 == $audit_sha and
              (.policy_sha256 | length == 64) and
              (.schedule_auditor_binary_sha256 | length == 64) and
              (.service_floor_auditor_binary_sha256 | length == 64) and
              (.receipt_sha256 | length == 64) and
              all(.findings[]; .passed == true)
            ' "target/energy-dispatch-profiled-runner/service-floor-receipt-$sample.json"
          done
          awk -F, 'NF != 34 { exit 1 }' target/energy-dispatch-profiled-runner/trace.csv
          test "$(wc -l < target/energy-dispatch-profiled-runner/trace.csv)" -eq 31
          test "$(find target/energy-dispatch-profiled-runner -name 'audit-receipt-*.json' | wc -l)" -eq 30
          test "$(find target/energy-dispatch-profiled-runner -name 'service-floor-receipt-*.json' | wc -l)" -eq 30
          jq -s -e 'length == 30 and all(.[]; .disposition == "passed")' \
            target/energy-dispatch-profiled-runner/service-floor-receipt-*.json
          grep -q ',optimal,' target/energy-dispatch-profiled-runner/trace.csv
          grep -q ',NA,NA,NA,' target/energy-dispatch-profiled-runner/trace.csv
          jq -e '.status == "optimal" and .assessment.search_is_exact == true and .assessment.pareto_frontier_complete == true and .selected_schedule != null' \
            target/energy-dispatch-profiled-runner/report-30.json
          jq -e '.assessment.evaluated_action_expansions > 0 and .assessment.feasible_complete_schedules > 0 and .assessment.pareto_frontier_count > 0 and (.schedule_sha256 | length == 64)' \
            target/energy-dispatch-profiled-runner/report-30.json
      - name: Aggregate measured search timings and require an auditable p95
        run: |
          set -euo pipefail
          cargo run --release --locked --manifest-path tools/energy-solver-compute-calibration/Cargo.toml -- \
            target/energy-dispatch-profiled-runner/trace.csv \
            > target/energy-dispatch-profiled-runner/trace-summary.csv
          awk -F, '
            NR == 1 { if (NF != 34 || $1 != "cohort_id") exit 1 }
            NR == 2 {
              if ($3 != 30 || $4 != 30 || $5 != 0 || $6 != 30) exit 1
              if ($14 == "NA" || $15 == "NA" || $16 != "NA" || $34 != "false") exit 1
              if ($17 != "NA" || $18 != "NA" || $19 == "NA" || $20 == "NA") exit 1
              if ($27 != 30 || $28 == "NA" || $29 == "NA") exit 1
              if ($30 == "NA" || $31 == "NA" || $32 == "NA" || $33 == "NA") exit 1
            }
            END { if (NR != 2) exit 1 }
          ' target/energy-dispatch-profiled-runner/trace-summary.csv
          jq -s -e 'length == 30 and all(.[]; .disposition == "accepted")' \
            target/energy-dispatch-profiled-runner/audit-receipt-*.json
          jq -r '.assessment | "search_action_expansions=\(.evaluated_action_expansions)\nfeasible_complete_schedules=\(.feasible_complete_schedules)\npareto_frontier_count=\(.pareto_frontier_count)"' \
            target/energy-dispatch-profiled-runner/report-30.json
          cat target/energy-dispatch-profiled-runner/trace-summary.csv
      - name: Execute 20 runs per scenario in the four-case v0.3 qualification panel
        run: |
          set -euo pipefail
          mkdir -p target/energy-dispatch-profiled-runner/v0.3
          panel="schemas/examples/energy-dispatch-scenario-panel-v0.1.json"
          jq -e '
            .schema_version == "energy-dispatch-scenario-panel-v0.1" and
            .panel_id == "sol-atlas-islanded-microgrid-stress-v0.1" and
            (.scenarios | length == 4) and
            ([.scenarios[].scenario_id] | unique | length == 4) and
            all(.scenarios[]; .expected_schedule_audit == "accepted")
          ' "$panel"
          panel_sha="$(sha256sum "$panel" | awk '{print $1}')"
          anytime="$CARGO_TARGET_DIR/release/energy-dispatch-anytime-profile"
          auditor="$CARGO_TARGET_DIR/release/energy-dispatch-schedule-auditor"
          floor_auditor="$CARGO_TARGET_DIR/release/energy-dispatch-service-floor-auditor"
          policy="tools/energy-dispatch-schedule-auditor/fixtures/energy-dispatch-pv-outage.service-floor-v0.1.json"
          while IFS=$'\t' read -r scenario_id request_path expected_audit expected_floor; do
            test "$(jq -r '.case_id' "$request_path")" = "$scenario_id"
            scenario_dir="target/energy-dispatch-profiled-runner/v0.3/$scenario_id"
            mkdir -p "$scenario_dir"
            for sample in $(seq -w 1 20); do
              "$anytime" \
                "$request_path" \
                "$panel_sha" \
                target/energy-dispatch-profiled-runner/v0.3/trace.csv \
                "$scenario_dir/report-$sample.json" \
                "$scenario_dir/schedule-$sample.json" \
                "$scenario_dir/audit-receipt-$sample.json" \
                "$policy" \
                "$scenario_dir/service-floor-receipt-$sample.json" \
                "$auditor" \
                "$floor_auditor"

              jq --arg scenario "$scenario_id" \
                 --arg audit "$expected_audit" \
                 --arg floor "$expected_floor" -e '
                .status == "exact_complete" and
                .anytime_assessment.search_complete == true and
                .anytime_assessment.optimality_proven == true and
                (.anytime_assessment.time_to_first_complete_candidate_ns != null) and
                (.anytime_assessment.time_to_first_complete_candidate_ns > 0) and
                .selected_schedule != null and
                .schedule_audit_receipt.disposition == $audit and
                .service_floor_receipt.disposition == $floor and
                .request_sha256 == .schedule_audit_receipt.request_sha256 and
                .request_sha256 == .service_floor_receipt.request_sha256 and
                .service_floor_receipt.schedule_audit_receipt_sha256 ==
                  .schedule_audit_receipt.receipt_sha256
              ' "$scenario_dir/report-$sample.json"
            done
          done < <(jq -r '.scenarios[] | [.scenario_id, .request_path, .expected_schedule_audit, .expected_service_floor] | @tsv' "$panel")

          awk -F, 'NF != 42 { exit 1 }' target/energy-dispatch-profiled-runner/v0.3/trace.csv
          test "$(wc -l < target/energy-dispatch-profiled-runner/v0.3/trace.csv)" -eq 81
          test "$(find target/energy-dispatch-profiled-runner/v0.3 -name 'audit-receipt-*.json' | wc -l)" -eq 80
          test "$(find target/energy-dispatch-profiled-runner/v0.3 -name 'service-floor-receipt-*.json' | wc -l)" -eq 80
          jq -s -e 'length == 80 and all(.[]; .disposition == "accepted")' \
            target/energy-dispatch-profiled-runner/v0.3/*/audit-receipt-*.json
          jq -s -e '[.[] | select(.disposition == "passed")] | length == 40' \
            target/energy-dispatch-profiled-runner/v0.3/*/service-floor-receipt-*.json
          jq -s -e '[.[] | select(.disposition == "failed")] | length == 40' \
            target/energy-dispatch-profiled-runner/v0.3/*/service-floor-receipt-*.json
      - name: Aggregate scenario-stratified anytime outcomes and resilience
        run: |
          set -euo pipefail
          cargo run --release --locked --manifest-path tools/energy-solver-compute-calibration/Cargo.toml --bin energy-solver-compute-calibration-v03 -- \
            target/energy-dispatch-profiled-runner/v0.3/trace.csv \
            > target/energy-dispatch-profiled-runner/v0.3/trace-summary.csv
          awk -F, '
            BEGIN {
              expected["battery-only-outage-backup"] = "passed"
              expected["nominal-pv-charge-outage"] = "passed"
              expected["demand-surge-outage"] = "failed"
              expected["pv-derate-islanded"] = "failed"
            }
            NR == 1 {
              if (NF != 39 || $1 != "scenario_id") exit 1
              next
            }
            NR > 1 {
              id = $1
              if (!(id in expected) || seen[id]++) exit 1
              scenario_rows += 1
              if ($3 != 20 || $4 != 20 || $5 == "NA" || $6 == "NA") exit 1
              if ($7 != 20 || $8 != 0 || $9 != 0 || $10 != 0 || $11 != 0 || $12 != 0 || $13 != 0) exit 1
              if ($14 != 20 || $15 != 20 || $16 != 20 || $17 != 0 || $18 != 0 || $19 != 0) exit 1
              if ($25 != 20 || $26 == "NA" || $27 == "NA") exit 1
              if ($28 != 20 || $29 == "NA" || $30 == "NA") exit 1
              if ($31 == "NA" || $32 == "NA" || $33 == "NA") exit 1
              if ($34 != 20 || $35 == "NA" || $36 == "NA") exit 1
              if (expected[id] == "passed") {
                if ($20 != 20 || $21 != 0 || $22 != 0 || $23 != 0 || $24 != 20) exit 1
                if ($37 != 20 || $38 == "NA" || $39 == "NA") exit 1
              } else {
                if ($20 != 0 || $21 != 20 || $22 != 0 || $23 != 0 || $24 != 0) exit 1
                if ($37 != 0 || $38 != "NA" || $39 != "NA") exit 1
              }
            }
            END {
              if (NR != 5 || scenario_rows != 4) exit 1
            }
          ' target/energy-dispatch-profiled-runner/v0.3/trace-summary.csv
          awk -F, '
            BEGIN {
              expected["battery-only-outage-backup"] = 1
              expected["nominal-pv-charge-outage"] = 1
              expected["demand-surge-outage"] = 0
              expected["pv-derate-islanded"] = 0
            }
            NR > 1 {
              scenarios += 1
              samples += $3
              audit_accepted += $16
              floor_passed += $20
              floor_failed += $21
              decision_ready += $24
              if (expected[$1] == 1) {
                false_alarm += $21
              } else {
                false_safe += $20
              }
            }
            END {
              printf "{\n  \"scenario_count\": %d,\n  \"sample_count\": %d,\n  \"accepted_schedule_audits\": %d,\n  \"service_floor_passed_runs\": %d,\n  \"service_floor_failed_runs\": %d,\n  \"decision_ready_runs\": %d,\n  \"false_safe_runs\": %d,\n  \"false_alarm_runs\": %d\n}\n", scenarios, samples, audit_accepted, floor_passed, floor_failed, decision_ready, false_safe, false_alarm
              if (scenarios != 4 || samples != 80 || audit_accepted != 80 || floor_passed != 40 || floor_failed != 40 || decision_ready != 40 || false_safe != 0 || false_alarm != 0) exit 1
            }
          ' target/energy-dispatch-profiled-runner/v0.3/trace-summary.csv \
            > target/energy-dispatch-profiled-runner/v0.3/scenario-panel-rollup.json
          jq -e '
            .scenario_count == 4 and
            .sample_count == 80 and
            .accepted_schedule_audits == 80 and
            .service_floor_passed_runs == 40 and
            .service_floor_failed_runs == 40 and
            .decision_ready_runs == 40 and
            .false_safe_runs == 0 and
            .false_alarm_runs == 0
          ' target/energy-dispatch-profiled-runner/v0.3/scenario-panel-rollup.json
          cat target/energy-dispatch-profiled-runner/v0.3/trace-summary.csv
      - name: Capture source, fixture and runner provenance
        run: |
          sha256sum schemas/examples/energy-dispatch-pv-outage.synthetic.json \
            > target/energy-dispatch-profiled-runner/request-fixture.sha256
          sha256sum schemas/examples/energy-dispatch-scenario-panel-v0.1.json \
            > target/energy-dispatch-profiled-runner/v0.3/scenario-panel.sha256
          sha256sum schemas/examples/energy-dispatch-scenarios/*.json \
            > target/energy-dispatch-profiled-runner/v0.3/scenario-fixtures.sha256
          sha256sum "$CARGO_TARGET_DIR/release/energy-dispatch-profile" \
            > target/energy-dispatch-profiled-runner/runner-binary.sha256
          sha256sum "$CARGO_TARGET_DIR/release/energy-dispatch-anytime-profile" \
            > target/energy-dispatch-profiled-runner/v0.3/anytime-runner-binary.sha256
          sha256sum "$CARGO_TARGET_DIR/release/energy-solver-compute-calibration-v03" \
            > target/energy-dispatch-profiled-runner/v0.3/aggregator-binary.sha256
          sha256sum target/energy-dispatch-profiled-runner/v0.3/trace.csv \
            > target/energy-dispatch-profiled-runner/v0.3/trace-source.sha256
          sha256sum target/energy-dispatch-profiled-runner/v0.3/trace-summary.csv \
            > target/energy-dispatch-profiled-runner/v0.3/trace-summary.sha256
          sha256sum "$CARGO_TARGET_DIR/release/energy-dispatch-schedule-auditor" \
            > target/energy-dispatch-profiled-runner/auditor-binary.sha256
          sha256sum "$CARGO_TARGET_DIR/release/energy-dispatch-service-floor-auditor" \
            > target/energy-dispatch-profiled-runner/service-floor-auditor-binary.sha256
          sha256sum tools/energy-dispatch-schedule-auditor/fixtures/energy-dispatch-pv-outage.service-floor-v0.1.json \
            > target/energy-dispatch-profiled-runner/service-floor-policy.sha256
          sha256sum "$CARGO_TARGET_DIR/release/energy-solver-compute-calibration" \
            > target/energy-dispatch-profiled-runner/trace-aggregator-binary.sha256
          sha256sum target/energy-dispatch-profiled-runner/trace.csv \
            > target/energy-dispatch-profiled-runner/trace-source.sha256
          sha256sum target/energy-dispatch-profiled-runner/trace-summary.csv \
            > target/energy-dispatch-profiled-runner/trace-summary.sha256
          {
            printf 'subject_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'rustc='; rustc --version
            printf 'cargo='; cargo --version
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'cpu_model='; lscpu | awk -F: '/Model name/ {gsub(/^ +/, "", $2); print $2; exit}'
            printf 'logical_cpu_count='; nproc
            printf 'runner_ram_kib='; awk '/MemTotal/ {print $2}' /proc/meminfo
          } > target/energy-dispatch-profiled-runner/build-provenance.txt
      - name: Assert exact source and clean tracked worktree
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SUBJECT_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload exact-search trace and execution receipt
        uses: actions/upload-artifact@v4
        with:
          name: energy-dispatch-profiled-runner-${{ github.sha }}
          path: |
            target/energy-dispatch-profiled-runner/trace.csv
            target/energy-dispatch-profiled-runner/trace-summary.csv
            target/energy-dispatch-profiled-runner/report-*.json
            target/energy-dispatch-profiled-runner/schedule-*.json
            target/energy-dispatch-profiled-runner/audit-receipt-*.json
            target/energy-dispatch-profiled-runner/service-floor-receipt-*.json
            target/energy-dispatch-profiled-runner/v0.3/
            target/energy-dispatch-profiled-runner/*.sha256
            target/energy-dispatch-profiled-runner/build-provenance.txt
            tools/energy-dispatch-profile-runner/src/main.rs
            tools/energy-dispatch-profile-runner/src/bin/energy-dispatch-anytime-profile.rs
            tools/energy-dispatch-profile-runner/Cargo.toml
            tools/energy-solver-compute-calibration/src/bin/energy-solver-compute-calibration-v03.rs
            tools/energy-dispatch-profile-runner/README.md
            tools/energy-dispatch-schedule-auditor/Cargo.toml
            tools/energy-dispatch-schedule-auditor/Cargo.lock
            tools/energy-dispatch-schedule-auditor/src/
            tools/energy-dispatch-schedule-auditor/schedule-schema-v0.1.json
            tools/energy-dispatch-schedule-auditor/service-floor-policy-schema-v0.1.json
            tools/energy-dispatch-schedule-auditor/service-floor-receipt-schema-v0.1.json
            tools/energy-dispatch-schedule-auditor/fixtures/energy-dispatch-pv-outage.service-floor-v0.1.json
            tools/energy-solver-compute-calibration/Cargo.toml
            tools/energy-solver-compute-calibration/Cargo.lock
            tools/energy-solver-compute-calibration/src/
            tools/energy-solver-compute-calibration/README.md
            sol-atlas-core/src/energy_dispatch.rs
            sol-atlas-core/src/energy_pathway.rs
            sol-atlas-core/src/lib.rs
            sol-atlas-core/Cargo.toml
            Cargo.toml
            Cargo.lock
            schemas/examples/energy-dispatch-pv-outage.synthetic.json
            schemas/examples/energy-dispatch-scenario-panel-v0.1.json
            schemas/examples/energy-dispatch-scenarios/
            schemas/energy-dispatch-scenario-panel-v0.1.schema.json
            sol-atlas-core/src/energy_dispatch.rs
            sol-atlas-core/src/energy_pathway.rs
            sol-atlas-core/Cargo.toml
            Cargo.lock
            schemas/examples/energy-dispatch-pv-outage.synthetic.json
          if-no-files-found: error
          retention-days: 14
