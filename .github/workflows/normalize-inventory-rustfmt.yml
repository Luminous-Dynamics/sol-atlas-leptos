name: Normalize federated inventory Rust source

on:
  push:
    branches:
      - research/federated-source-inventory-v0-1
    paths:
      - "sol-atlas-core/src/built_environment_source_inventory.rs"
      - ".github/workflows/normalize-inventory-rustfmt.yml"

permissions:
  contents: write

concurrency:
  group: inventory-rustfmt-normalize
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit inventory module
        run: |
          set -euo pipefail
          rustfmt --edition 2024 sol-atlas-core/src/built_environment_source_inventory.rs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sol-atlas-core/src/built_environment_source_inventory.rs
          if git diff --cached --quiet; then
            echo "Inventory module already formatted"
          else
            git commit -m "style: format federated inventory verifier"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          rustfmt --edition 2024 --check sol-atlas-core/src/built_environment_source_inventory.rs
