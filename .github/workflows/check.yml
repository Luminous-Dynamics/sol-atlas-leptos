name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # This crate is a wasm-bindgen-heavy [[bin]] with no [lib] target —
      # native `cargo test` still works (verified 2026-07-11) and is much
      # faster than a wasm test harness for the pure-logic unit tests
      # (renderer::hex, sol-atlas-core). Must target the bin explicitly:
      # `cargo test --lib` fails with "no library targets found".
      - run: cargo test --bin sol-atlas-leptos
      - name: Test shared Sol Atlas core crate
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
      - name: Test detector-to-EVSI likelihood bridge
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml sensor_evsi_bridge
      - name: Test candidate utility inference graph
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml utility_inference

      - name: Test asset reconstruction metrics
        run: cargo test --bin utility_reconstruction_eval
      - name: Verify pinned asset association baseline
        run: cargo run --bin utility_reconstruction_eval -- --check-pinned
      - name: Test constrained investigation tournament
        run: cargo test --bin investigation_tournament_eval
      - name: Verify pinned investigation tournament baseline
        run: cargo run --bin investigation_tournament_eval -- --check-pinned
      - name: Test project-cluster split builder
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml project_split
      - name: Verify pinned 13-project split manifest
        run: cargo run --bin project_split_eval -- --check-pinned
      - name: Test project split CLI sensitivity sweep
        run: cargo test --bin project_split_eval
      - name: Emit project split calibration sensitivity sweep
        run: cargo run --bin project_split_eval -- --sensitivity-sweep
      - name: Test evidence revalidation closure
        run: cargo test --bin evidence_revalidation_eval
      - name: Verify pinned evidence revalidation plan
        run: cargo run --bin evidence_revalidation_eval -- --check-pinned
      - name: Test per-activity field metric admission
        run: cargo test --bin field_activity_admission_eval
      - name: Verify pinned field activity admission baseline
        run: cargo run --bin field_activity_admission_eval -- --check-pinned
      - name: Test sensor observability scoring CLI
        run: cargo test --bin sensor_observability_eval
      - name: Verify pinned analytic sensor observability receipt
        run: cargo run --bin sensor_observability_eval -- --check research/earth-observability/baselines/sensor-observability-analytic-baseline-v0.1.json
      - name: Test Earth observability manifest validator
        run: cargo test --bin earth_observability_validate
      - name: Emit Earth observability contract receipt
        run: cargo run --bin earth_observability_validate -- research/earth-observability/earth-observability-case-manifest-v0.1.json
      - name: Test deterministic Earth observability fixture generator
        run: cargo test --bin earth_observability_generate
      - name: Verify committed synthetic profile fixture
        run: cargo run --bin earth_observability_generate -- --check research/earth-observability/fixtures/earth-observability-profile-synthetic-v0.1.json
      - name: Test synthetic profile baseline runner
        run: cargo test --bin earth_observability_baseline
      - name: Verify pinned synthetic profile baseline report
        run: cargo run --bin earth_observability_baseline -- --check research/earth-observability/baselines/synthetic-profile-baseline-v0.1.json
      - name: Test AGS4 local preflight
        run: cargo test --bin ags4_preflight
      - name: Run synthetic AGS4 preflight fixture
        run: cargo run --bin ags4_preflight -- research/earth-observability/fixtures/ags4-synthetic-v0.1.ags
