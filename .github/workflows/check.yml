name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # This crate is a wasm-bindgen-heavy [[bin]] with no [lib] target —
      # native `cargo test` still works (verified 2026-07-11) and is much
      # faster than a wasm test harness for the pure-logic unit tests
      # (renderer::hex, sol-atlas-core). Must target the bin explicitly:
      # `cargo test --lib` fails with "no library targets found".
      - run: cargo test --bin sol-atlas-leptos
      - name: Test shared Rust core (including water bundle semantic checks)
        run: cargo test -p sol-atlas-core

  validate-water-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for JSON Schema checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Validate engineering and public-observation schemas against fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          pairs = [
              (
                  Path("sol-atlas-core/schemas/water-engineering-bundle-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/w0-p2-diameter-restriction.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-public-observation-bundle-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/johannesburg-water-public-observations-2024-25.v0.1.json"),
              ),
          ]

          format_checker = FormatChecker()
          for schema_path, fixture_path in pairs:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              instance = json.loads(fixture_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema, format_checker=format_checker)
              errors = sorted(
                  validator.iter_errors(instance),
                  key=lambda error: (list(map(str, error.absolute_path)), error.message),
              )
              if errors:
                  for error in errors:
                      pointer = "/" + "/".join(map(str, error.absolute_path))
                      print(f"{fixture_path}: {pointer}: {error.message}")
                  raise SystemExit(1)
              print(f"SCHEMA_FIXTURE_PASS: {schema_path} -> {fixture_path}")
          PY

  epanet-synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned OpenWaterAnalytics EPANET source
        uses: actions/checkout@v4
        with:
          repository: OpenWaterAnalytics/EPANET
          ref: 4d8d82ddc260fce216af9321fc3d9a4646ac6827
          path: .epanet-source
      - name: Build pinned EPANET 2.2 CLI
        run: |
          set -euo pipefail
          mkdir -p artifacts/epanet-w0
          cmake -S .epanet-source -B .epanet-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build .epanet-build --config Release --parallel 2
          test -x .epanet-build/bin/runepanet
          .epanet-build/bin/runepanet 2>&1 | tee artifacts/epanet-w0/solver-usage.txt || true
      - name: Run synthetic baseline and restricted-pipe scenario
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/artifacts/epanet-w0"
          solver="$PWD/.epanet-build/bin/runepanet"
          input="$PWD/sol-atlas-core/fixtures/water-engineering/w0_network.inp"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cp "$input" "$out/w0-baseline.inp"

          # Apply exactly one scenario change to the synthetic P2 pipe: 150 mm -> 50 mm.
          perl -pe '
            if (/^P2\s+J1\s+J2\s+800\s+150\s+100\s+0\s+OPEN\s*$/) {
              s/(^P2\s+J1\s+J2\s+800\s+)150(?=\s+100\s+0\s+OPEN\s*$)/${1}50/;
              $changed++;
            }
            END { die "expected exactly one P2 diameter mutation\n" unless $changed == 1; }
          ' "$input" > "$out/w0-p2-diameter-50mm.inp"

          grep -Eq '^P2[[:space:]]+J1[[:space:]]+J2[[:space:]]+800[[:space:]]+50[[:space:]]+100[[:space:]]+0[[:space:]]+OPEN "$out/w0-p2-diameter-50mm.inp"

          "$solver" "$out/w0-baseline.inp" "$out/w0-baseline.rpt" "$out/w0-baseline.bin" > "$out/w0-baseline.stdout" 2>&1
          "$solver" "$out/w0-p2-diameter-50mm.inp" "$out/w0-p2-diameter-50mm.rpt" "$out/w0-p2-diameter-50mm.bin" > "$out/w0-p2-diameter-50mm.stdout" 2>&1

          grep -q 'EPANET ran successfully' "$out/w0-baseline.stdout"
          grep -q 'EPANET ran successfully' "$out/w0-p2-diameter-50mm.stdout"
          test -s "$out/w0-baseline.rpt"
          test -s "$out/w0-baseline.bin"
          test -s "$out/w0-p2-diameter-50mm.rpt"
          test -s "$out/w0-p2-diameter-50mm.bin"
          grep -q 'P2' "$out/w0-baseline.rpt"
          grep -q 'P2' "$out/w0-p2-diameter-50mm.rpt"

          if cmp -s "$out/w0-baseline.rpt" "$out/w0-p2-diameter-50mm.rpt"; then
            echo "FAIL: diameter-restriction scenario did not change the EPANET report"
            exit 1
          fi
          if cmp -s "$out/w0-baseline.bin" "$out/w0-p2-diameter-50mm.bin"; then
            echo "FAIL: diameter-restriction scenario did not change the EPANET binary output"
            exit 1
          fi

          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          solver_sha="$(sha256sum "$solver" | awk '{print $1}')"
          baseline_input_sha="$(sha256sum "$out/w0-baseline.inp" | awk '{print $1}')"
          candidate_input_sha="$(sha256sum "$out/w0-p2-diameter-50mm.inp" | awk '{print $1}')"
          baseline_report_sha="$(sha256sum "$out/w0-baseline.rpt" | awk '{print $1}')"
          candidate_report_sha="$(sha256sum "$out/w0-p2-diameter-50mm.rpt" | awk '{print $1}')"
          baseline_binary_sha="$(sha256sum "$out/w0-baseline.bin" | awk '{print $1}')"
          candidate_binary_sha="$(sha256sum "$out/w0-p2-diameter-50mm.bin" | awk '{print $1}')"
          source_input_sha="$(sha256sum "$input" | awk '{print $1}')"
          cmake_version="$(cmake --version | head -n 1)"
          compiler_version="$(cc --version | head -n 1)"

          jq -n \
            --arg schema_version "epanet-synthetic-smoke/v0.1" \
            --arg state "Completed" \
            --arg source_commit "4d8d82ddc260fce216af9321fc3d9a4646ac6827" \
            --arg engine_version "EPANET 2.2 source revision" \
            --arg solver_sha256 "$solver_sha" \
            --arg source_input_sha256 "$source_input_sha" \
            --arg baseline_input_sha256 "$baseline_input_sha" \
            --arg candidate_input_sha256 "$candidate_input_sha" \
            --arg baseline_report_sha256 "$baseline_report_sha" \
            --arg candidate_report_sha256 "$candidate_report_sha" \
            --arg baseline_binary_sha256 "$baseline_binary_sha" \
            --arg candidate_binary_sha256 "$candidate_binary_sha" \
            --arg cmake_version "$cmake_version" \
            --arg compiler_version "$compiler_version" \
            --arg started_at "$started_at" \
            --arg finished_at "$finished_at" \
            '{
              schema_version: $schema_version,
              run_state: $state,
              synthetic_only: true,
              solver: {
                engine: "EPANET",
                version: $engine_version,
                source_commit: $source_commit,
                executable_sha256: $solver_sha256,
                cmake: $cmake_version,
                compiler: $compiler_version
              },
              source_fixture: {
                path: "sol-atlas-core/fixtures/water-engineering/w0_network.inp",
                sha256: $source_input_sha256
              },
              baseline: {
                change: "none",
                input_sha256: $baseline_input_sha256,
                report_sha256: $baseline_report_sha256,
                binary_output_sha256: $baseline_binary_sha256
              },
              candidate: {
                change: "pipe P2 diameter 150 mm -> 50 mm",
                input_sha256: $candidate_input_sha256,
                report_sha256: $candidate_report_sha256,
                binary_output_sha256: $candidate_binary_sha256
              },
              execution: {
                started_at: $started_at,
                finished_at: $finished_at,
                command: "runepanet <input.inp> <report.rpt> <output.bin>"
              },
              nonclaims: [
                "This is a synthetic solver smoke test only.",
                "A changed report confirms a scenario affects this model run; it does not qualify a municipal model or design.",
                "No empirical calibration, uncertainty quantification, engineering review, or real-network validation is implied."
              ]
            }' > "$out/epanet-synthetic-smoke-evidence.json"

          sha256sum "$out"/* | tee "$out/artifact-sha256.txt"
          echo "EPANET_SYNTHETIC_SMOKE_PASS: pinned solver ran baseline and restricted-pipe cases; reports and outputs differ."
      - name: Upload synthetic solver evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epanet-w0-smoke-${{ github.sha }}
          path: artifacts/epanet-w0/
          if-no-files-found: warn
          retention-days: 14
