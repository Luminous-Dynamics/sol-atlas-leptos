name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # This crate is a wasm-bindgen-heavy [[bin]] with no [lib] target —
      # native `cargo test` still works (verified 2026-07-11) and is much
      # faster than a wasm test harness for the pure-logic unit tests
      # (renderer::hex, sol-atlas-core). Must target the bin explicitly:
      # `cargo test --lib` fails with "no library targets found".
      - run: cargo test --bin sol-atlas-leptos
      - name: Test shared Rust core (including water bundle semantic checks)
        run: cargo test -p sol-atlas-core
      - name: Validate synthetic intervention decision packet semantics
        run: cargo run -p sol-atlas-core --bin water-decision-validate -- sol-atlas-core/fixtures/water-engineering/w0-intervention-decision.synthetic.json
      - name: Calculate and independently check illustrative measurement information value
        shell: bash
        run: |
          set -euo pipefail
          fixture="sol-atlas-core/fixtures/water-engineering/w0-measurement-model.toy.synthetic.json"
          expected_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          cargo run -p sol-atlas-core --bin water-measurement-evaluate -- "$fixture" > "$output_file"
          jq -e --arg expected_sha "$expected_sha" '
            . as $root |
            ($root.evaluation.actions[] | select(.action_id == "perfect_sensor")) as $perfect |
            ($root.evaluation.actions[] | select(.action_id == "uninformative_sensor")) as $uninformative |
            ($root.schema_version == "water-measurement-run-envelope/v0.1") and
            ($root.source_input_sha256 == $expected_sha) and
            ($root.evaluation.claim_ceiling == "illustrative_calculation_only") and
            ($root.evaluation.selection_state == "positive_net_value_candidate") and
            ($root.evaluation.selected_measurement_action == "perfect_sensor") and
            (((($perfect.expected_information_gain_bits - 1.0) | abs) < 1e-9)) and
            (((($perfect.expected_value_of_sample_information - 2.0) | abs) < 1e-9)) and
            (((($perfect.net_value_in_loss_units - 1.0) | abs) < 1e-9)) and
            (((($uninformative.expected_information_gain_bits) | abs) < 1e-9)) and
            (((($uninformative.expected_value_of_sample_information) | abs) < 1e-9)) and
            (((($uninformative.net_value_in_loss_units) | abs) < 1e-9))
          ' "$output_file"
      - name: Calculate robust measurement value across model uncertainty
        shell: bash
        run: |
          set -euo pipefail
          fixture="sol-atlas-core/fixtures/water-engineering/w0-measurement-ensemble.toy.synthetic.json"
          expected_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          cargo run -p sol-atlas-core --bin water-measurement-robust-evaluate -- "$fixture" > "$output_file"
          jq -e --arg expected_sha "$expected_sha" '
            . as $root |
            ($root.evaluation.actions[] | select(.action_id == "perfect_sensor")) as $perfect |
            ($root.evaluation.actions[] | select(.action_id == "uninformative_sensor")) as $uninformative |
            ($root.schema_version == "water-measurement-robust-run-envelope/v0.1") and
            ($root.source_input_sha256 == $expected_sha) and
            ($root.evaluation.claim_ceiling == "illustrative_ensemble_sensitivity_only") and
            ($root.evaluation.model_count == 2) and
            ($root.evaluation.selection_state == "no_positive_worst_case_net_value_candidate") and
            ($root.evaluation.selected_measurement_action == null) and
            (((($perfect.minimum_expected_information_gain_bits) | abs) < 1e-9)) and
            (((($perfect.maximum_expected_information_gain_bits - 1.0) | abs) < 1e-9)) and
            (((($perfect.minimum_expected_value_of_sample_information) | abs) < 1e-9)) and
            (((($perfect.maximum_expected_value_of_sample_information - 2.0) | abs) < 1e-9)) and
            (((($perfect.minimum_net_value_in_loss_units + 1.0) | abs) < 1e-9)) and
            (((($perfect.maximum_net_value_in_loss_units - 1.0) | abs) < 1e-9)) and
            (((($uninformative.minimum_expected_value_of_sample_information) | abs) < 1e-9)) and
            (((($uninformative.maximum_expected_value_of_sample_information) | abs) < 1e-9))
          ' "$output_file"

  validate-water-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for JSON Schema checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validator
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Validate engineering, observation, decision, experiment and measurement-model schemas against fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          pairs = [
              (
                  Path("sol-atlas-core/schemas/water-engineering-bundle-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/w0-p2-diameter-restriction.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-public-observation-bundle-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/johannesburg-water-public-observations-2024-25.v0.1.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-intervention-decision-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/w0-intervention-decision.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-measurement-experiment-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/w0-measurement-experiment.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-measurement-model-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/w0-measurement-model.toy.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-measurement-ensemble-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/w0-measurement-ensemble.toy.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-scenario-corpus-plan-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/w0-scenario-corpus-plan.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-scenario-corpus-plan-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/net3-scenario-corpus-plan.synthetic.json"),
              ),
              (
                  Path("sol-atlas-core/schemas/water-scenario-corpus-plan-v0.1.schema.json"),
                  Path("sol-atlas-core/fixtures/water-engineering/net3-all-junction-localization-plan.synthetic.json"),
              ),
          ]

          format_checker = FormatChecker()
          for schema_path, fixture_path in pairs:
              schema = json.loads(schema_path.read_text(encoding="utf-8"))
              instance = json.loads(fixture_path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
              validator = Draft202012Validator(schema, format_checker=format_checker)
              errors = sorted(
                  validator.iter_errors(instance),
                  key=lambda error: (list(map(str, error.absolute_path)), error.message),
              )
              if errors:
                  for error in errors:
                      pointer = "/" + "/".join(map(str, error.absolute_path))
                      print(f"{fixture_path}: {pointer}: {error.message}")
                  raise SystemExit(1)
              print(f"SCHEMA_FIXTURE_PASS: {schema_path} -> {fixture_path}")

          generated_output_schema = Path("sol-atlas-core/schemas/water-scenario-corpus-run-v0.1.schema.json")
          generated_schema = json.loads(generated_output_schema.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(generated_schema)
          print(f"SCHEMA_DEFINITION_PASS: {generated_output_schema}")

          localization_schema_path = Path("sol-atlas-core/schemas/water-localization-evaluation-v0.1.schema.json")
          localization_schema = json.loads(localization_schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(localization_schema)
          print(f"SCHEMA_DEFINITION_PASS: {localization_schema_path}")
          PY

  epanet-synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust for deterministic scenario corpus execution
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies for scenario corpus runner
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-epanet-corpus-${{ hashFiles('**/Cargo.lock') }}
      - name: Validate synthetic EPANET runner shell syntax
        run: bash -n scripts/ci/epanet-synthetic-smoke.sh
      - name: Checkout pinned OpenWaterAnalytics EPANET source
        uses: actions/checkout@v4
        with:
          repository: OpenWaterAnalytics/EPANET
          ref: 4d8d82ddc260fce216af9321fc3d9a4646ac6827
          path: .epanet-source
      - name: Build pinned EPANET 2.2 CLI
        run: |
          set -euo pipefail
          mkdir -p artifacts/epanet-w0
          cmake -S .epanet-source -B .epanet-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build .epanet-build --config Release --parallel 2
          test -x .epanet-build/bin/runepanet
      - name: Generate and execute deterministic synthetic scenario corpus
        id: scenario_corpus
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p sol-atlas-core --bin water-scenario-corpus-run -- \
            sol-atlas-core/fixtures/water-engineering/w0_network.inp \
            sol-atlas-core/fixtures/water-engineering/w0-scenario-corpus-plan.synthetic.json \
            .epanet-build/bin/runepanet \
            artifacts/water-scenario-corpus \
            4d8d82ddc260fce216af9321fc3d9a4646ac6827
      - name: Validate generated scenario corpus manifest
        id: scenario_manifest
        if: steps.scenario_corpus.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          fixture="sol-atlas-core/fixtures/water-engineering/w0-scenario-corpus-plan.synthetic.json"
          output="artifacts/water-scenario-corpus/scenario-corpus-run.v0.1.json"
          digest_file="artifacts/water-scenario-corpus/scenario-corpus-run.v0.1.sha256"
          expected_plan_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          expected_manifest_sha="$(sha256sum "$output" | awk '{print $1}')"
          test "$(awk '{print $1}' "$digest_file")" = "$expected_manifest_sha"
          jq -e --arg plan_sha "$expected_plan_sha" '
            (.schema_version == "water-scenario-corpus-run/v0.1") and
            (.plan_sha256 == $plan_sha) and
            (.base_input_sha256 == "0524e9f92940fae0ded3f9fb2e3f7471865f453df7a06e54a6de15c3cc0ba559") and
            (.unit_system == "LPS") and
            (.flow_unit == "L/s") and
            (.pressure_unit == "m") and
            (.report_policy == "NODES ALL; LINKS ALL") and
            (.solver.source_commit == "4d8d82ddc260fce216af9321fc3d9a4646ac6827") and
            (.claim_ceiling == "synthetic_single_topology_hydraulic_pilot") and
            (.scenario_count == 5) and
            (.completed_count == 5) and
            (.failed_count == 0) and
            (.run_state == "Completed") and
            ([.scenarios[].scenario_id] == [
              "w0-no-fault",
              "w0-withdrawal-j1-small",
              "w0-withdrawal-j1-large",
              "w0-withdrawal-j2-small",
              "w0-withdrawal-j2-large"
            ]) and
            all(.scenarios[];
              .run_state == "Completed" and
              (.generated_input.sha256 | test("^[a-f0-9]{64}$")) and
              (.report.sha256 | test("^[a-f0-9]{64}$")) and
              (.binary_output.sha256 | test("^[a-f0-9]{64}$")) and
              (.pressure_readings | length == 2) and
              all(.pressure_readings[]; .state == "measured" and (.pressure_value | type == "number") and .reason == null)
            )
          ' "$output"
      - name: Upload scenario corpus inputs, results and failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: water-scenario-corpus-pilot
          path: artifacts/water-scenario-corpus/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate and execute pinned Net3 synthetic scenario corpus
        id: net3_corpus
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p sol-atlas-core --bin water-scenario-corpus-run -- \
            .epanet-source/example-networks/Net3.inp \
            sol-atlas-core/fixtures/water-engineering/net3-scenario-corpus-plan.synthetic.json \
            .epanet-build/bin/runepanet \
            artifacts/net3-scenario-corpus \
            4d8d82ddc260fce216af9321fc3d9a4646ac6827
      - name: Validate generated Net3 corpus manifest
        id: net3_manifest
        if: steps.net3_corpus.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          fixture="sol-atlas-core/fixtures/water-engineering/net3-scenario-corpus-plan.synthetic.json"
          output="artifacts/net3-scenario-corpus/scenario-corpus-run.v0.1.json"
          digest_file="artifacts/net3-scenario-corpus/scenario-corpus-run.v0.1.sha256"
          expected_plan_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          expected_manifest_sha="$(sha256sum "$output" | awk '{print $1}')"
          test "$(awk '{print $1}' "$digest_file")" = "$expected_manifest_sha"
          jq -e --arg plan_sha "$expected_plan_sha" '
            (.schema_version == "water-scenario-corpus-run/v0.1") and
            (.plan_sha256 == $plan_sha) and
            (.base_input_sha256 == "d95b068194ba747605bea851d608333e577ac667658aaa1680cf1c07e43faf53") and
            (.unit_system == "GPM") and
            (.flow_unit == "GPM") and
            (.pressure_unit == "psi") and
            (.report_policy == "NODES ALL; LINKS ALL") and
            (.solver.source_commit == "4d8d82ddc260fce216af9321fc3d9a4646ac6827") and
            (.claim_ceiling == "synthetic_single_topology_hydraulic_pilot") and
            (.scenario_count == 9) and
            (.completed_count == 9) and
            (.failed_count == 0) and
            (.run_state == "Completed") and
            ([.scenarios[].scenario_id] == [
              "net3-no-fault",
              "net3-withdrawal-101-small",
              "net3-withdrawal-101-large",
              "net3-withdrawal-103-small",
              "net3-withdrawal-103-large",
              "net3-withdrawal-105-small",
              "net3-withdrawal-105-large",
              "net3-withdrawal-109-small",
              "net3-withdrawal-109-large"
            ]) and
            all(.scenarios[];
              .run_state == "Completed" and
              (.generated_input.sha256 | test("^[a-f0-9]{64}$")) and
              (.report.sha256 | test("^[a-f0-9]{64}$")) and
              (.binary_output.sha256 | test("^[a-f0-9]{64}$")) and
              (.pressure_readings | length == 4) and
              all(.pressure_readings[];
                .state == "measured" and
                (.pressure_value | type == "number") and
                .reason == null
              )
            )
          ' "$output"
      - name: Upload Net3 scenario corpus inputs, results and failure manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: net3-scenario-corpus-pilot
          path: artifacts/net3-scenario-corpus/
          if-no-files-found: warn
          retention-days: 14
      - name: Evaluate W0 localization with held-out demand magnitude
        id: w0_localization
        if: steps.scenario_manifest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          manifest="artifacts/water-scenario-corpus/scenario-corpus-run.v0.1.json"
          output="artifacts/water-scenario-corpus/water-localization-evaluation.v0.1.json"
          cargo run -p sol-atlas-core --bin water-localization-benchmark-evaluate -- "$manifest" sol-atlas-core/fixtures/water-engineering/w0_network.inp > "$output"
      - name: Validate W0 localization evaluation contract
        id: w0_localization_validate
        if: steps.w0_localization.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          manifest="artifacts/water-scenario-corpus/scenario-corpus-run.v0.1.json"
          output="artifacts/water-scenario-corpus/water-localization-evaluation.v0.1.json"
          expected_manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          jq -e --arg source_sha "$expected_manifest_sha" '
            (.schema_version == "water-localization-evaluation-envelope/v0.1") and
            (.source_manifest_sha256 == $source_sha) and
            (.evaluation.schema_version == "water-localization-evaluation/v0.1") and
            (.evaluation.run_state == "Completed") and
            (.evaluation.unit_system == "LPS") and
            (.evaluation.flow_unit == "L/s") and
            (.evaluation.pressure_unit == "m") and
            (.source_topology_sha256 == "0524e9f92940fae0ded3f9fb2e3f7471865f453df7a06e54a6de15c3cc0ba559") and
            (.evaluation.distance_semantics == "unweighted_undirected_link_hops") and
            (.evaluation.topology_node_count >= 3) and
            (.evaluation.topology_link_count >= 1) and
            (.evaluation.claim_ceiling == "synthetic_withdrawal_localization_baseline_only") and
            (.evaluation.negative_control_count == 1) and
            (.evaluation.fault_scenario_count == 4) and
            (.evaluation.candidate_target_count == 2) and
            (.evaluation.top_k == 2) and
            (.evaluation.held_out_magnitudes == [2,5]) and
            ([.evaluation.models[].model_id] | sort == ["cosine-nearest-example","euclidean-nearest-example"]) and
            all(.evaluation.models[];
              .test_count == 4 and
              (.predictions | length == 4) and
              (.folds | length == 2) and
              (.top1_accuracy >= 0 and .top1_accuracy <= 1) and
              (.top_k_accuracy >= 0 and .top_k_accuracy <= 1) and
              (.mean_reciprocal_rank >= 0 and .mean_reciprocal_rank <= 1) and
              has("mean_topological_error_hops") and has("p95_topological_error_hops") and has("worst_topological_error_hops") and has("disconnected_prediction_count") and
              ((.mean_topological_error_hops == null) or (.mean_topological_error_hops >= 0)) and
              ((.p95_topological_error_hops == null) or (.p95_topological_error_hops >= 0)) and
              ((.worst_topological_error_hops == null) or (.worst_topological_error_hops >= 0)) and
              (.disconnected_prediction_count == ([.predictions[] | select(.topological_error_hops == null)] | length)) and
              all(.predictions[]; has("topological_error_hops")) and
              all(.folds[]; .test_count == 2 and (.top1_accuracy >= 0 and .top1_accuracy <= 1)) and
              all(.predictions[]; .actual_rank >= 1 and (.ranked_candidates | length == 2))
            )
          ' "$output"
      - name: Evaluate Net3 localization with held-out demand magnitude
        id: net3_localization
        if: steps.net3_manifest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          manifest="artifacts/net3-scenario-corpus/scenario-corpus-run.v0.1.json"
          output="artifacts/net3-scenario-corpus/water-localization-evaluation.v0.1.json"
          cargo run -p sol-atlas-core --bin water-localization-benchmark-evaluate -- "$manifest" .epanet-source/example-networks/Net3.inp > "$output"
      - name: Validate Net3 localization evaluation contract
        id: net3_localization_validate
        if: steps.net3_localization.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          manifest="artifacts/net3-scenario-corpus/scenario-corpus-run.v0.1.json"
          output="artifacts/net3-scenario-corpus/water-localization-evaluation.v0.1.json"
          expected_manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          jq -e --arg source_sha "$expected_manifest_sha" '
            (.schema_version == "water-localization-evaluation-envelope/v0.1") and
            (.source_manifest_sha256 == $source_sha) and
            (.evaluation.schema_version == "water-localization-evaluation/v0.1") and
            (.evaluation.run_state == "Completed") and
            (.evaluation.unit_system == "GPM") and
            (.evaluation.flow_unit == "GPM") and
            (.evaluation.pressure_unit == "psi") and
            (.source_topology_sha256 == "d95b068194ba747605bea851d608333e577ac667658aaa1680cf1c07e43faf53") and
            (.evaluation.distance_semantics == "unweighted_undirected_link_hops") and
            (.evaluation.topology_node_count >= 1) and
            (.evaluation.topology_link_count >= 1) and
            (.evaluation.claim_ceiling == "synthetic_withdrawal_localization_baseline_only") and
            (.evaluation.negative_control_count == 1) and
            (.evaluation.fault_scenario_count == 8) and
            (.evaluation.candidate_target_count == 4) and
            (.evaluation.top_k == 3) and
            (.evaluation.held_out_magnitudes == [10,25]) and
            ([.evaluation.models[].model_id] | sort == ["cosine-nearest-example","euclidean-nearest-example"]) and
            all(.evaluation.models[];
              .test_count == 8 and
              (.predictions | length == 8) and
              (.folds | length == 2) and
              (.top1_accuracy >= 0 and .top1_accuracy <= 1) and
              (.top_k_accuracy >= 0 and .top_k_accuracy <= 1) and
              (.mean_reciprocal_rank >= 0 and .mean_reciprocal_rank <= 1) and
              has("mean_topological_error_hops") and has("p95_topological_error_hops") and has("worst_topological_error_hops") and has("disconnected_prediction_count") and
              ((.mean_topological_error_hops == null) or (.mean_topological_error_hops >= 0)) and
              ((.p95_topological_error_hops == null) or (.p95_topological_error_hops >= 0)) and
              ((.worst_topological_error_hops == null) or (.worst_topological_error_hops >= 0)) and
              (.disconnected_prediction_count == ([.predictions[] | select(.topological_error_hops == null)] | length)) and
              all(.predictions[]; has("topological_error_hops")) and
              all(.folds[]; .test_count == 4 and (.top1_accuracy >= 0 and .top1_accuracy <= 1)) and
              all(.predictions[]; .actual_rank >= 1 and (.ranked_candidates | length == 4))
            )
          ' "$output"
      - name: Execute exhaustive Net3 junction-target corpus
        id: net3_exhaustive_corpus
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p sol-atlas-core --bin water-scenario-corpus-run -- \
