name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Check sol-atlas-core formatting
        run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml -- --check

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # The root package is a wasm-bindgen-heavy binary with no [lib] target.
      # Test it explicitly; `cargo test --lib` fails because no root library exists.
      - name: Test Sol Atlas app
        run: cargo test --bin sol-atlas-leptos
      # sol-atlas-core is a separate nested package, not a workspace member.
      # Testing the binary only compiles this path dependency; it does not run
      # the dependency crate's own unit tests, so invoke its manifest directly.
      - name: Test sol-atlas-core unit tests
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
