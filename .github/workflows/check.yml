            sol-atlas-core/fixtures/water-engineering/net3-all-junction-localization-plan.synthetic.json \
            .epanet-build/bin/runepanet \
            artifacts/net3-exhaustive-scenario-corpus \
            4d8d82ddc260fce216af9321fc3d9a4646ac6827
      - name: Validate exhaustive Net3 run manifest
        id: net3_exhaustive_manifest
        if: steps.net3_exhaustive_corpus.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
