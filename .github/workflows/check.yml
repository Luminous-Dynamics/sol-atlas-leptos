name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # This crate is a wasm-bindgen-heavy [[bin]] with no [lib] target —
      # native `cargo test` still works (verified 2026-07-11) and is much
      # faster than a wasm test harness for the pure-logic unit tests
      # (renderer::hex, sol-atlas-core). Must target the bin explicitly:
      # `cargo test --lib` fails with "no library targets found".
      - run: cargo test --features landscape-observation-bench --bin sol-atlas-leptos --bin landscape-observation-bench
      - name: Run synthetic observation benchmark smoke profiles
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/landscape-observation-bench"
          mkdir -p "$output_dir"
          machine_label="${ImageOS:-ubuntu-latest}-${ImageVersion:-unknown}"
          cpu_model="$(lscpu | awk -F: '/Model name/ { gsub(/^[[:space:]]+/, "", \$2); print \$2; exit }')"
          if [ -z "$cpu_model" ]; then cpu_model="$(uname -m)"; fi
          ram_mib="$(awk '/MemTotal:/ { print int(\$2 / 1024) }' /proc/meminfo)"
          for profile in unique exact-10pct exact-100pct conflict over-limit; do
            cargo run --quiet --features landscape-observation-bench --bin landscape-observation-bench -- \
              --commit-sha "$GITHUB_SHA" \
              --machine-label "$machine_label" \
              --cpu-model "$cpu_model" \
              --ram-mib "$ram_mib" \
              --records 100 --iterations 5 --warmup 1 --profile "$profile" \
              > "$output_dir/$profile.json"
          done
      - name: Upload benchmark smoke reports
        uses: actions/upload-artifact@v4
        with:
          name: landscape-observation-bench-${{ github.sha }}
          path: ${{ runner.temp }}/landscape-observation-bench/*.json
          if-no-files-found: error
          retention-days: 14
