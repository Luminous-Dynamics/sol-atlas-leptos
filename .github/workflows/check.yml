            scripts/verify_github_qualification_environment.py \
            scripts/test_verify_github_qualification_environment.py \
            scripts/test_verify_github_qualification_environment_integration.py \
            scripts/test_verify_github_governance_root.py \
            scripts/test_verify_github_governance_root_integration.py \
            scripts/test_verify_gcs_broad_sa_impersonation.py \
            scripts/test_verify_gcs_effective_iam_integration.py \
            scripts/test_verify_gcs_broad_sa_impersonation_integration.py \
