name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Check standalone core formatting
        run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml --check

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  bench-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      # Compile the benchmark in the optimized profile, then run a small
      # CI smoke cohort so each PR preserves raw samples and the run manifest.
      # GitHub-hosted measurements are a noisy smoke baseline, not an SOTA claim.
      - name: Compile offline journal benchmark
        run: cargo bench -p sol-atlas-core --bench offline_journal_protocol --no-run
      - name: Run offline journal benchmark smoke cohort
        env:
          SOL_ATLAS_BENCH_SAMPLES: "10"
          SOL_ATLAS_BENCH_BUILD_SHA: ${{ github.sha }}
        run: |
          {
            printf '# utc_timestamp=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '# source_revision=%s\n' "$(git rev-parse HEAD)"
            printf '# rustc_version=%s\n' "$(rustc --version)"
            printf '# host=%s\n' "$(uname -a)"
            printf '# cpu_model=%s\n' "$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -1)"
            printf '# runner_class=GitHub-hosted ubuntu-latest; shared virtualized hardware; noisy CI baseline only\n'
            cargo bench -p sol-atlas-core --bench offline_journal_protocol
          } > offline-journal-bench.csv 2> offline-journal-bench-build.log
          cat offline-journal-bench-build.log
      - name: Upload offline journal benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-journal-bench-${{ github.sha }}
          path: |
            offline-journal-bench.csv
            offline-journal-bench-build.log
          if-no-files-found: error

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # This crate is a wasm-bindgen-heavy [[bin]] with no [lib] target —
      # native `cargo test` still works (verified 2026-07-11) and is much
      # faster than a wasm test harness for the pure-logic unit tests
      # (renderer::hex, sol-atlas-core). Must target the bin explicitly:
      # `cargo test --lib` fails with "no library targets found".
      - run: cargo test --bin sol-atlas-leptos
      - name: Test shared field projection contract
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
