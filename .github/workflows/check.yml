name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  ogc-evidence-validator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: benchmarks/ogc-evidence-roundtrip/v0.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate profile JSON Schemas and field-disposition ledger
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          checks = [
              ("schemas/feature-extension.schema.json",
               load("fixtures/feature-collection.json")["features"][0]["properties"]["solAtlas"]),
              ("schemas/evidence-records.schema.json",
               load("fixtures/evidence-records.json")),
              ("schemas/field-disposition-ledger.schema.json",
               load("fixtures/field-disposition-ledger.json")),
          ]
          for schema_path, instance in checks:
              schema = load(schema_path)
              Draft202012Validator.check_schema(schema)
              errors = sorted(
                  Draft202012Validator(schema).iter_errors(instance),
                  key=lambda error: list(error.absolute_path),
              )
              if errors:
                  raise SystemExit(
                      f"{schema_path}: " + "; ".join(error.message for error in errors)
                  )
              print(f"VALID: {schema_path}")

          ledger_schema = load("schemas/field-disposition-ledger.schema.json")
          ledger_validator = Draft202012Validator(ledger_schema)
          invalid_completion = load("fixtures/field-disposition-ledger.json")
          invalid_completion["executionStatus"] = "completed"
          invalid_completion["sourceArtifactDigest"] = "sha256:" + "a" * 64
          invalid_completion["targetArtifactDigest"] = "sha256:" + "b" * 64
          if ledger_validator.is_valid(invalid_completion):
              raise SystemExit("NEGATIVE CONTROL FAILED: unassessed ledger accepted as completed")

          missing_reason = load("fixtures/field-disposition-ledger.json")
          del missing_reason["entries"][0]["reason"]
          if ledger_validator.is_valid(missing_reason):
              raise SystemExit("NEGATIVE CONTROL FAILED: not_assessed entry without reason accepted")
          restricted_payload = load("fixtures/evidence-records.json")
          restricted_payload["records"][1]["rights"]["contentRetrieval"] = "unknown"
          restricted_payload["records"][1]["rights"]["publicDisclosure"] = "allowed"
          restricted_payload["records"][1]["syntheticPayload"] = "must not be embedded"
          evidence_schema = load("schemas/evidence-records.schema.json")
          if Draft202012Validator(evidence_schema).is_valid(restricted_payload):
              raise SystemExit("NEGATIVE CONTROL FAILED: payload accepted without explicit retrieval permission")
          print("VALID: rights-pending payload negative control rejected")
          print("VALID: field-disposition ledger negative controls rejected")
          PY
      - name: Format reference validator
        run: cargo fmt --manifest-path reference/Cargo.toml -- --check
      - name: Test evidence and rights invariants
        run: cargo test --manifest-path reference/Cargo.toml
      - name: Enforce strict Clippy
        run: cargo clippy --manifest-path reference/Cargo.toml --all-targets -- -D warnings
      - name: Validate synthetic exchange fixture
        run: cargo run --manifest-path reference/Cargo.toml -- fixtures/feature-collection.json fixtures/evidence-records.json

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # This crate is a wasm-bindgen-heavy [[bin]] with no [lib] target —
      # native `cargo test` still works (verified 2026-07-11) and is much
      # faster than a wasm test harness for the pure-logic unit tests
      # (renderer::hex, sol-atlas-core). Must target the bin explicitly:
      # `cargo test --lib` fails with "no library targets found".
      - run: cargo test --bin sol-atlas-leptos
