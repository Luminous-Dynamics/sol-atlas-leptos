name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # sol-atlas-core is a path dependency, not a workspace member; the root
      # formatter does not include it.
      - run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml --all --check
      - name: Check the Horizons capture helper without network access
        shell: bash
        run: |
          bash -n scripts/capture-horizons-vector.sh
          expected_url='https://ssd.jpl.nasa.gov/api/horizons.api?COMMAND=%27499%27&CENTER=%27%400%27&CSV_FORMAT=%27YES%27&EPHEM_TYPE=%27VECTORS%27&MAKE_EPHEM=%27YES%27&OBJ_DATA=%27YES%27&OUT_UNITS=%27KM-S%27&REF_PLANE=%27FRAME%27&REF_SYSTEM=%27ICRF%27&TIME_TYPE=%27TDB%27&TLIST=%272461323.5%27&TLIST_TYPE=%27JD%27&VEC_CORR=%27NONE%27&VEC_LABELS=%27YES%27&VEC_TABLE=%272%27&format=json'
          actual_url="$(scripts/capture-horizons-vector.sh --print-url)"
          test "$actual_url" = "$expected_url"

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # The actual deploy target (see deploy.yml) — if this doesn't build,
      # the site can't ship. This is the check that caught a real bug
      # (a closure type-inference error in layer_panel.rs) before it
      # would otherwise have shipped, 2026-07-10.
      - run: cargo check --target wasm32-unknown-unknown

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-native-${{ hashFiles('**/Cargo.lock') }}
      # This crate is a wasm-bindgen-heavy binary with no [lib] target.
      - run: cargo test --bin sol-atlas-leptos
      # Path dependencies are compiled for the app, but their unit tests are
      # not run by the application's test harness.
      - run: cargo test --manifest-path sol-atlas-core/Cargo.toml
