name: Demand-matched energy service accounting

on:
  push:
    branches: [main]
    paths:
      - "sol-atlas-core/src/energy_service.rs"
      - "sol-atlas-core/src/bin/energy_service_assess.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/src/energy_ports.rs"
      - "schemas/energy-service-*.schema.json"
      - "schemas/examples/energy-service-*.synthetic.json"
      - "schemas/energy-ports-*.schema.json"
      - "schemas/examples/energy-ports-*.synthetic.json"
      - ".github/workflows/energy-service.yml"
  pull_request:
    paths:
      - "sol-atlas-core/src/energy_service.rs"
      - "sol-atlas-core/src/bin/energy_service_assess.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/src/energy_ports.rs"
      - "schemas/energy-service-*.schema.json"
      - "schemas/examples/energy-service-*.synthetic.json"
      - "schemas/energy-ports-*.schema.json"
      - "schemas/examples/energy-ports-*.synthetic.json"
      - ".github/workflows/energy-service.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  energy-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-energy-service-${{ hashFiles('**/Cargo.lock') }}
      - name: Run demand matching and negative-control tests
        run: cargo test -p sol-atlas-core --lib energy_service
      - name: Run receipt-wrapped CLI tests
        run: cargo test -p sol-atlas-core --bin energy_service_assess
      - name: Produce frozen synthetic service report
        run: cargo run -p sol-atlas-core --bin energy_service_assess -- schemas/examples/energy-service-chp.synthetic.json > /tmp/energy-service-report.json
      - name: Install pinned JSON Schema validator (CI tooling only)
        run: python -m pip install --disable-pip-version-check "jsonschema[format]==4.26.0"
      - name: Validate request, report, receipts, balances and unmet demand
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          fixture_bytes = Path("schemas/examples/energy-service-chp.synthetic.json").read_bytes()
          request = json.loads(fixture_bytes)
          report = json.loads(Path("/tmp/energy-service-report.json").read_text())
          request_schema = json.loads(Path("schemas/energy-service-request-v0.1.schema.json").read_text())
          report_schema = json.loads(Path("schemas/energy-service-report-v1.schema.json").read_text())
          Draft202012Validator.check_schema(request_schema)
          Draft202012Validator.check_schema(report_schema)
          Draft202012Validator(request_schema, format_checker=FormatChecker()).validate(request)
          Draft202012Validator(report_schema, format_checker=FormatChecker()).validate(report)

          assessment = report["assessment"]
          graph = assessment["graph"]
          services = assessment["services"]
          receipt = report["receipt"]
          assert hashlib.sha256(fixture_bytes).hexdigest() == receipt["input_sha256"]
          encoded_assessment = json.dumps(assessment, separators=(",", ":"), ensure_ascii=False).encode()
          assert hashlib.sha256(encoded_assessment).hexdigest() == receipt["assessment_sha256"]
          assert graph["external_input_energy_kwh"] == 100.0
          assert graph["terminal_disposition_energy_kwh"] == 100.0
          assert services["total_requested_service_kwh"] == 60.0
          assert services["total_delivered_service_kwh"] == 49.0
          assert services["total_unserved_service_kwh"] == 11.0
          assert services["essential_unserved_service_kwh"] == 11.0
          assert abs(graph["system_balance_residual_kwh"]) < 1e-9
          assert abs(services["service_balance_residual_kwh"]) < 1e-9
          demands = {item["service_id"]: item for item in services["demands"]}
          assert demands["electric-service"]["delivered_energy_kwh"] == 35.0
          assert demands["electric-service"]["unserved_energy_kwh"] == 5.0
          assert demands["process-heat-service"]["delivered_energy_kwh"] == 14.0
          assert demands["process-heat-service"]["unserved_energy_kwh"] == 6.0
          assert "not authenticated" in assessment["claim_ceiling"]
          assert receipt["synthetic"] is True
          print("energy service schema, digest, physical balance and demand-shortfall checks passed")
          PY
