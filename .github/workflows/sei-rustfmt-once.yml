name: Temporary SEI Rust format repair

on:
  push:
    branches:
      - feat/spatial-economic-evidence-contract

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SEI branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-economic-evidence-contract
          fetch-depth: 0
      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply repository Rust formatting
        run: cargo fmt --all
      - name: Commit formatter-only changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style(sei): apply canonical Rust formatting"
          git push origin HEAD:feat/spatial-economic-evidence-contract
