name: Temporary Sol Atlas rustfmt capture

on:
  push:
    branches:
      - "research/microgrid-independent-verifier-v1-2026-10-11"
    paths:
      - ".github/workflows/sol-atlas-rustfmt-capture-temporary.yml"

permissions:
  contents: read

concurrency:
  group: sol-atlas-rustfmt-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Format exact branch and capture Rust source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify 'HEAD^{commit}')"
          test "$actual" = "$EXPECTED_SHA"
          printf 'source_commit=%s\n' "$actual"
          printf 'source_tree=%s\n' "$(git rev-parse --verify 'HEAD^{tree}')"

      - name: Install pinned Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt

      - name: Format and verify the branch tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          rustfmt --version
          git diff --check

      - name: Capture formatted sources
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            sol-atlas-core/src/energy_study.rs \
            sol-atlas-core/src/energy_study_qualification.rs \
            sol-atlas-core/src/lib.rs \
            sol-atlas-core/src/microgrid.rs \
            sol-atlas-core/src/microgrid_verifier.rs \
            sol-atlas-core/src/priority_microgrid.rs; do
            echo "CAPTURE_FILE_BEGIN:$path"
            cat "$path"
            echo "CAPTURE_FILE_END:$path"
            sha256sum "$path"
          done
