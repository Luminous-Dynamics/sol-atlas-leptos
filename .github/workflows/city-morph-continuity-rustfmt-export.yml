name: City Morph Continuity Rustfmt Export (temporary authoring helper)

on:
  push:
    branches: ["research/city-morph-continuity-v0.1"]
    paths:
      - "tools/city-morph-continuity-bench/**"
      - ".github/workflows/city-morph-continuity-rustfmt-export.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Format in ephemeral checkout and export exact bytes
        run: |
          cargo fmt --manifest-path tools/city-morph-continuity-bench/Cargo.toml --all
          mkdir -p formatted
          cp tools/city-morph-continuity-bench/src/lib.rs formatted/lib.rs
          cp tools/city-morph-continuity-bench/src/main.rs formatted/main.rs
      - uses: actions/upload-artifact@v4
        with:
          name: city-morph-continuity-rustfmt-export
          path: formatted/
          if-no-files-found: error
          retention-days: 2
