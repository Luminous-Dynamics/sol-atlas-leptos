name: Heritage Probability Composition Audit Qualification

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/heritage_composition_audit.rs"
      - "sol-atlas-core/src/heritage_observability.rs"
      - "sol-atlas-core/src/lib.rs"
      - "schemas/heritage-composition-audit-input-v0.1.schema.json"
      - "schemas/heritage-composition-audit-report-v0.1.schema.json"
      - "schemas/examples/heritage-composition-audit-input-synthetic-v0.1.json"
      - "schemas/examples/heritage-composition-audit-report-synthetic-v0.1.json"
      - "docs/research/heritage-composition-audit-v0.1.md"
      - ".github/workflows/heritage-composition-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check core formatting
        run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml -- --check
      - name: Run core unit tests
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Draft 2020-12 schemas and fixtures
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("schemas")
          input_schema = json.loads((root / "heritage-composition-audit-input-v0.1.schema.json").read_text())
          report_schema = json.loads((root / "heritage-composition-audit-report-v0.1.schema.json").read_text())
          Draft202012Validator.check_schema(input_schema)
          Draft202012Validator.check_schema(report_schema)
          input_validator = Draft202012Validator(input_schema)
          report_validator = Draft202012Validator(report_schema)

          source_input = json.loads((root / "examples/heritage-composition-audit-input-synthetic-v0.1.json").read_text())
          source_report = json.loads((root / "examples/heritage-composition-audit-report-synthetic-v0.1.json").read_text())
          input_validator.validate(source_input)
          report_validator.validate(source_report)

          malformed = copy.deepcopy(source_input)
          malformed["target_coverage"]["target_location_distribution_sha256"] = "missing"
          assert list(input_validator.iter_errors(malformed)), "missing target-location distribution digest passed"

          malformed = copy.deepcopy(source_input)
          malformed["target_coverage"]["probability"]["upper"] = 1.2
          assert list(input_validator.iter_errors(malformed)), "out-of-range target coverage probability passed"

          malformed = copy.deepcopy(source_input)
          malformed["target_coverage"]["outside_domain_detection_probability"] = 0.01
          assert list(input_validator.iter_errors(malformed)), "nonzero detection outside the declared coverage domain passed"

          malformed = copy.deepcopy(source_input)
          malformed["field_sweep_profile"]["hdb22_context_id"] = ""
          assert list(input_validator.iter_errors(malformed)), "empty HDB-22 context binding passed"

          malformed = copy.deepcopy(source_input)
          malformed["hdb11_analytical_rights"]["decision"] = "undetermined"
          assert list(input_validator.iter_errors(malformed)), "unresolved HDB-11 analytical rights passed"

          malformed = copy.deepcopy(source_input)
          malformed["hdb15_analytical_rights"]["purpose"] = "model_training"
          assert list(input_validator.iter_errors(malformed)), "non-research HDB-15 purpose passed"

          malformed = copy.deepcopy(source_report)
          malformed["posterior_computed"] = True
          assert list(report_validator.iter_errors(malformed)), "audit report claimed posterior computation"

          malformed = copy.deepcopy(source_report)
          malformed["footprint_coverage"]["outside_domain_detection_probability"] = 0.01
          assert list(report_validator.iter_errors(malformed)), "report retained a bounded-domain claim with nonzero outside-domain detection"

          print("Draft 2020-12 input/output schemas, 2 positive fixtures and 8 negative controls passed")
          PY
