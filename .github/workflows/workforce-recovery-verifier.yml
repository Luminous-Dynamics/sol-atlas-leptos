name: Workforce recovery exact oracle

on:
  pull_request:
    paths:
      - "docs/research/WORKFORCE-RECOVERY-001.md"
      - "docs/research/fixtures/workforce_recovery_scenarios_v0_1.json"
      - "docs/research/schemas/workforce_recovery_v0_1.schema.json"
      - "tools/workforce-recovery-verifier/**"
      - ".github/workflows/workforce-recovery-verifier.yml"
  push:
    branches:
      - main
      - research/workforce-recovery-001
    paths:
      - "docs/research/WORKFORCE-RECOVERY-001.md"
      - "docs/research/fixtures/workforce_recovery_scenarios_v0_1.json"
      - "docs/research/schemas/workforce_recovery_v0_1.schema.json"
      - "tools/workforce-recovery-verifier/**"
      - ".github/workflows/workforce-recovery-verifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-recovery-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/workforce-recovery-verifier/Cargo.toml -- --check
      - name: Run recovery oracle tests
        run: cargo test --manifest-path tools/workforce-recovery-verifier/Cargo.toml
      - name: Produce synthetic-only recovery receipt
        run: cargo run --manifest-path tools/workforce-recovery-verifier/Cargo.toml -- docs/research/fixtures/workforce_recovery_scenarios_v0_1.json docs/research/schemas/workforce_recovery_v0_1.schema.json
