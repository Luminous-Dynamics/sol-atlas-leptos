name: Normalize Rust formatting on descriptor branch

on:
  push:
    branches:
      - research/built-environment-source-descriptors-v0-1-rebased
    paths:
      - "sol-atlas-core/src/**"
      - "tests/industry_assurance_projection.rs"
      - "examples/built_environment_ieac_projection_fixture.rs"
      - "examples/built_environment_ieac_descriptor_projection_fixture.rs"
      - ".github/workflows/rustfmt-normalize-export.yml"

permissions:
  contents: write

concurrency:
  group: rustfmt-normalize-push
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize and commit all Rust formatting changes
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sol-atlas-core/src tests/industry_assurance_projection.rs examples/built_environment_ieac_projection_fixture.rs examples/built_environment_ieac_descriptor_projection_fixture.rs
          if git diff --cached --quiet; then
            echo "Rust sources are already rustfmt-normalized"
          else
            git commit -m "style: normalize all built-environment Rust sources"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          cargo fmt --manifest-path Cargo.toml --check
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml --check
