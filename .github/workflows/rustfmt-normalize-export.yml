name: Normalize Rust formatting on descriptor branch

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/industry_assurance_projection.rs"
      - "sol-atlas-core/src/built_environment_source_descriptor.rs"
      - "sol-atlas-core/src/lib.rs"
      - "tests/industry_assurance_projection.rs"
      - "examples/built_environment_ieac_projection_fixture.rs"
      - "examples/built_environment_ieac_descriptor_projection_fixture.rs"
      - ".github/workflows/rustfmt-normalize-export.yml"
  push:
    branches:
      - research/built-environment-source-descriptors-v0-1-rebased
    paths:
      - "sol-atlas-core/src/industry_assurance_projection.rs"
      - "sol-atlas-core/src/built_environment_source_descriptor.rs"
      - "sol-atlas-core/src/lib.rs"
      - "tests/industry_assurance_projection.rs"
      - "examples/built_environment_ieac_projection_fixture.rs"
      - "examples/built_environment_ieac_descriptor_projection_fixture.rs"
      - ".github/workflows/rustfmt-normalize-export.yml"

permissions:
  contents: write

concurrency:
  group: rustfmt-normalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize and commit formatter output
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            sol-atlas-core/src/industry_assurance_projection.rs \
            sol-atlas-core/src/built_environment_source_descriptor.rs \
            sol-atlas-core/src/lib.rs \
            tests/industry_assurance_projection.rs \
            examples/built_environment_ieac_projection_fixture.rs \
            examples/built_environment_ieac_descriptor_projection_fixture.rs
          if git diff --cached --quiet; then
            echo "Rust sources are already rustfmt-normalized"
          else
            git commit -m "style: normalize descriptor and projector Rust sources"
            target_ref="${PR_HEAD_REF:-$GITHUB_REF_NAME}"
            git push origin "HEAD:$target_ref"
          fi
          cargo fmt --manifest-path Cargo.toml --check
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml --check
