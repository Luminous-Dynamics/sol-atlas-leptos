name: Heritage Cluster Statistics Qualification

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/heritage_cluster_statistics.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "schemas/heritage-cluster-statistics-v0.1.schema.json"
      - "schemas/examples/heritage-cluster-statistics-synthetic-v0.1.json"
      - "docs/research/heritage-cluster-statistics-v0.1.md"
      - ".github/workflows/heritage-cluster-statistics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check core formatting
        run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml -- --check
      - name: Run core unit and fixture tests
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Draft 2020-12 schema and fixture
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("schemas/heritage-cluster-statistics-v0.1.schema.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          fixture_path = Path("schemas/examples/heritage-cluster-statistics-synthetic-v0.1.json")
          fixture = json.loads(fixture_path.read_text())
          validator.validate(fixture)

          malformed = json.loads(fixture_path.read_text())
          malformed["correlation_matrix_sha256"] = "not-a-digest"
          assert list(validator.iter_errors(malformed)), "negative control unexpectedly passed"
          print("Draft 2020-12 schema and positive/negative fixtures passed")
          PY
