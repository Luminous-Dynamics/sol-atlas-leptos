name: Heritage Observability Estimand Qualification

on:
  pull_request:
    paths:
      - "sol-atlas-core/src/heritage_observability.rs"
      - "sol-atlas-core/src/lib.rs"
      - "sol-atlas-core/Cargo.toml"
      - "schemas/heritage-observability-input-v0.2.schema.json"
      - "schemas/heritage-observability-report-v0.2.schema.json"
      - "schemas/examples/heritage-observability-input-synthetic-v0.2.json"
      - "schemas/examples/heritage-observability-report-synthetic-v0.2.json"
      - "docs/research/heritage-observability-v0.2.md"
      - ".github/workflows/heritage-observability-estimand.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check core formatting
        run: cargo fmt --manifest-path sol-atlas-core/Cargo.toml -- --check
      - name: Run core unit tests
        run: cargo test --manifest-path sol-atlas-core/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Draft 2020-12 schemas, fixtures and negative controls
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          base = Path("schemas")
          input_schema = json.loads((base / "heritage-observability-input-v0.2.schema.json").read_text())
          report_schema = json.loads((base / "heritage-observability-report-v0.2.schema.json").read_text())
          Draft202012Validator.check_schema(input_schema)
          Draft202012Validator.check_schema(report_schema)
          input_validator = Draft202012Validator(input_schema)
          report_validator = Draft202012Validator(report_schema)

          input_fixture = json.loads((base / "examples/heritage-observability-input-synthetic-v0.2.json").read_text())
          report_fixture = json.loads((base / "examples/heritage-observability-report-synthetic-v0.2.json").read_text())
          input_validator.validate(input_fixture)
          report_validator.validate(report_fixture)

          malformed = copy.deepcopy(input_fixture)
          malformed["calibration_profile"]["conditioning_events"] = ["target_observation_data_valid"]
          assert list(input_validator.iter_errors(malformed)), "joint scope accepted a non-empty conditioning set"

          malformed = copy.deepcopy(input_fixture)
          malformed["calibration_profile"]["detection_probability_scope"] = "conditional_on_target_presented_to_sensor"
          malformed["calibration_profile"]["conditioning_events"] = []
          assert list(input_validator.iter_errors(malformed)), "presented-to-sensor scope accepted missing conditioning events"

          malformed = copy.deepcopy(report_fixture)
          malformed["archaeological_absence_claimed"] = True
          assert list(report_validator.iter_errors(malformed)), "report asserted archaeological absence"

          print("Draft 2020-12 input/output schemas, 2 positive fixtures and 3 negative controls passed")
          PY
