name: GMD service continuity oracle

on:
  pull_request:
    paths:
      - "tools/gmd-service-continuity-oracle/**"
      - ".github/workflows/gmd-service-continuity-oracle.yml"
  push:
    paths:
      - "tools/gmd-service-continuity-oracle/**"
      - ".github/workflows/gmd-service-continuity-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gmd-service-continuity-oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: essential-service continuity oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate schema and synthetic scenario structure
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path(".")
          schema_path = root / "docs/research/gmd-service-continuity/GMD_SERVICE_CONTINUITY_INPUT_V0.1.schema.json"
          result_schema_path = root / "docs/research/gmd-service-continuity/GMD_SERVICE_CONTINUITY_RESULT_V0.1.schema.json"
          case_path = root / "docs/research/gmd-service-continuity/GMD_SERVICE_CONTINUITY_SYNTHETIC_CASE_V0.1.json"
          result_path = root / "docs/research/gmd-service-continuity/GMD_SERVICE_CONTINUITY_SYNTHETIC_RESULT_V0.1.json"
          schema = json.loads(schema_path.read_text())
          result_schema = json.loads(result_schema_path.read_text())
          case = json.loads(case_path.read_text())
          result = json.loads(result_path.read_text())

          assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          assert result_schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          assert "serviceMetrics" in result_schema["$defs"]
          assert result["scenario_id"] == case["scenario_id"]
          assert result["horizon_seconds"] == case["horizon_seconds"]
          assert isinstance(case["scenario_id"], str) and case["scenario_id"].strip()
          horizon = case["horizon_seconds"]
          assert isinstance(horizon, int) and not isinstance(horizon, bool) and horizon > 0
          services = case["services"]
          assert isinstance(services, list) and services

          seen = set()
          for service in services:
              required = {
                  "service_id", "owner_ref", "geographic_scope_ref", "quantity_unit",
                  "asset_revision", "source_ref", "source_sha256", "evidence_class",
                  "minimum_service_fraction", "quantity_tolerance",
                  "maximum_interval_seconds", "recovery_hold_seconds", "intervals",
              }
              assert required <= service.keys()
              assert all(isinstance(service[key], str) and service[key].strip()
                         for key in ("service_id", "owner_ref", "geographic_scope_ref",
                                     "quantity_unit", "asset_revision", "source_ref"))
              assert service["service_id"] not in seen
              seen.add(service["service_id"])
              assert re.fullmatch(r"[0-9a-f]{64}", service["source_sha256"])
              assert service["evidence_class"] in {
                  "Measured", "PublishedDerived", "Modelled", "Inferred", "Simulated"
              }
              assert 0 < service["minimum_service_fraction"] <= 1
              assert service["quantity_tolerance"] >= 0
              max_interval = service["maximum_interval_seconds"]
              assert isinstance(max_interval, int) and max_interval > 0
              assert isinstance(service["recovery_hold_seconds"], int)
              assert service["recovery_hold_seconds"] > 0

              intervals = service["intervals"]
              assert intervals
              expected_start = 0
              for interval in intervals:
                  start = interval["start_offset_seconds"]
                  end = interval["end_offset_seconds"]
                  assert start == expected_start and end > start and end - start <= max_interval
                  assert interval["required_quantity"] >= 0
                  assert interval["delivered_quantity"] >= 0
                  expected_start = end
              assert expected_start == horizon

          print(f"validated {len(services)} services across {horizon}s")
          PY
      - name: Recompute expected service-result fixture
        run: |
          python3 - <<'PY'
          import json
          import math
          import pathlib

          root = pathlib.Path("docs/research/gmd-service-continuity")
          case = json.loads((root / "GMD_SERVICE_CONTINUITY_SYNTHETIC_CASE_V0.1.json").read_text())
          expected = json.loads((root / "GMD_SERVICE_CONTINUITY_SYNTHETIC_RESULT_V0.1.json").read_text())
          assert case["scenario_id"] == expected["scenario_id"]
          assert case["horizon_seconds"] == expected["horizon_seconds"]
          assert len(case["services"]) == len(expected["services"])

          def sustained_recovery(intervals, states, hold):
              observed_violation = False
              run_start = None
              run_seconds = 0
              for item, state in zip(intervals, states):
                  if state is None:
                      run_start = None
                      run_seconds = 0
                  elif state is False:
                      observed_violation = True
                      run_start = None
                      run_seconds = 0
                  elif observed_violation:
                      if run_start is None:
                          run_start = item["start_offset_seconds"]
                          run_seconds = 0
                      run_seconds += item["end_offset_seconds"] - item["start_offset_seconds"]
                      if run_seconds >= hold:
                          return {
                              "began_after_seconds": run_start,
                              "confirmed_after_seconds": item["end_offset_seconds"],
                          }
              return None

          for source, recorded in zip(case["services"], expected["services"]):
              assert source["service_id"] == recorded["service_id"]
              assert source["owner_ref"] == recorded["owner_ref"]
              assert source["geographic_scope_ref"] == recorded["geographic_scope_ref"]
              assert source["quantity_unit"] == recorded["quantity_unit"]
              intervals = source["intervals"]
              required_total = sum(x["required_quantity"] for x in intervals)
              delivered_capped = sum(min(x["required_quantity"], x["delivered_quantity"]) for x in intervals)
              surplus = sum(max(x["delivered_quantity"] - x["required_quantity"], 0.0) for x in intervals)
              unserved = sum(max(x["required_quantity"] - x["delivered_quantity"], 0.0) for x in intervals)
              demand_seconds = sum(x["end_offset_seconds"] - x["start_offset_seconds"]
                                   for x in intervals if x["required_quantity"] > 0)
              floor_states = []
              full_states = []
              floor_seconds = violation_seconds = longest_violation = current_violation = episodes = 0
              max_deficit = 0.0
              first_violation = None
              initial_floor = initial_full = None

              for item in intervals:
                  duration = item["end_offset_seconds"] - item["start_offset_seconds"]
                  req, got = item["required_quantity"], item["delivered_quantity"]
                  if req == 0:
                      floor_states.append(None)
                      full_states.append(None)
                      longest_violation = max(longest_violation, current_violation)
                      current_violation = 0
                      continue
                  floor_ok = got >= req * source["minimum_service_fraction"] - source["quantity_tolerance"]
                  full_ok = got >= req - source["quantity_tolerance"]
                  if initial_floor is None:
                      initial_floor, initial_full = floor_ok, full_ok
                  floor_states.append(floor_ok)
                  full_states.append(full_ok)
                  max_deficit = max(max_deficit, 1.0 - min(got, req) / req)
                  if floor_ok:
                      floor_seconds += duration
                      longest_violation = max(longest_violation, current_violation)
                      current_violation = 0
                  else:
                      if current_violation == 0:
                          episodes += 1
                          if first_violation is None:
                              first_violation = item["start_offset_seconds"]
                      current_violation += duration
                      violation_seconds += duration
                      longest_violation = max(longest_violation, current_violation)

              computed = {
                  "horizon_seconds": case["horizon_seconds"],
                  "maximum_interval_seconds": source["maximum_interval_seconds"],
                  "initially_above_service_floor": initial_floor,
                  "initially_fully_served": initial_full,
                  "total_required_quantity": required_total,
                  "total_delivered_quantity_capped": delivered_capped,
                  "total_surplus_quantity_excluded": surplus,
                  "total_unserved_quantity": unserved,
                  "demand_observed_seconds": demand_seconds,
                  "demand_weighted_served_fraction": delivered_capped / required_total,
                  "floor_time_availability_fraction": floor_seconds / demand_seconds,
                  "total_floor_violation_seconds": violation_seconds,
                  "longest_floor_violation_seconds": longest_violation,
                  "floor_violation_episode_count": episodes,
                  "maximum_interval_deficit_fraction": max_deficit,
                  "first_floor_violation_after_seconds": first_violation,
                  "floor_recovery": sustained_recovery(intervals, floor_states, source["recovery_hold_seconds"]),
                  "full_service_recovery": sustained_recovery(intervals, full_states, source["recovery_hold_seconds"]),
              }
              for key, value in computed.items():
                  actual = recorded[key]
                  if isinstance(value, float):
                      assert math.isclose(actual, value, rel_tol=1e-12, abs_tol=1e-12), (source["service_id"], key, actual, value)
                  else:
                      assert actual == value, (source["service_id"], key, actual, value)

          print(f"recomputed expected results for {len(case['services'])} services")
          PY
      - name: Check formatting
        run: cargo fmt --manifest-path tools/gmd-service-continuity-oracle/Cargo.toml -- --check
      - name: Run offline tests
        run: cargo test --manifest-path tools/gmd-service-continuity-oracle/Cargo.toml --locked --offline
      - name: Run Clippy
        run: cargo clippy --manifest-path tools/gmd-service-continuity-oracle/Cargo.toml --locked --offline --all-targets -- -D warnings
