name: Normalize Rust formatting for source inventory branch

on:
  push:
    branches:
      - research/federated-source-inventory-v0-1-stacked
    paths:
      - "sol-atlas-core/src/**"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/rustfmt-normalize-inventory.yml"

permissions:
  contents: write

concurrency:
  group: rustfmt-normalize-source-inventory
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize root and core crate Rust sources
        run: |
          set -euo pipefail
          cargo fmt --manifest-path Cargo.toml
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          if git diff --cached --quiet; then
            echo "Rust sources already formatted"
          else
            git commit -m "style: normalize source inventory Rust"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          cargo fmt --manifest-path Cargo.toml --check
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml --check
