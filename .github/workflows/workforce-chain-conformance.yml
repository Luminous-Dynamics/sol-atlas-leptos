name: Workforce evidence-chain conformance verifier

on:
  pull_request:
    paths:
      - "docs/research/WORKFORCE-CHAIN-CONFORMANCE-001.md"
      - "docs/research/fixtures/workforce_chain_conformance_v0_1.json"
      - "docs/research/schemas/workforce_chain_manifest_v0_1.schema.json"
      - "tools/workforce-chain-conformance/**"
      - ".github/workflows/workforce-chain-conformance.yml"
  push:
    branches:
      - main
      - research/workforce-chain-conformance-001
    paths:
      - "docs/research/WORKFORCE-CHAIN-CONFORMANCE-001.md"
      - "docs/research/fixtures/workforce_chain_conformance_v0_1.json"
      - "docs/research/schemas/workforce_chain_manifest_v0_1.schema.json"
      - "tools/workforce-chain-conformance/**"
      - ".github/workflows/workforce-chain-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workforce-chain-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path tools/workforce-chain-conformance/Cargo.toml -- --check
      - name: Run chain conformance tests
        run: cargo test --manifest-path tools/workforce-chain-conformance/Cargo.toml
      - name: Produce synthetic-only chain receipt
        run: cargo run --manifest-path tools/workforce-chain-conformance/Cargo.toml -- docs/research/fixtures/workforce_chain_conformance_v0_1.json docs/research/schemas/workforce_chain_manifest_v0_1.schema.json
