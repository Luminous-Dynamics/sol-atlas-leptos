name: Qualify GCS external effect

on:
  workflow_dispatch:

concurrency:
  group: sol-atlas-gcs-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Live GCS qualification
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: sol-atlas-gcs-qualification
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact_id: ${{ steps.upload_evidence.outputs.artifact-id }}

    env:
      GCP_PROJECT_ID: ${{ vars.SOL_ATLAS_GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.SOL_ATLAS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.SOL_ATLAS_GCP_SERVICE_ACCOUNT }}
      GCS_QUALIFICATION_BUCKET: ${{ vars.SOL_ATLAS_GCS_QUALIFICATION_BUCKET }}
      CLOUDSDK_CONFIG: ${{ runner.temp }}/sol-atlas-gcloud-config
      # GitHub does not expose a default GITHUB_ENVIRONMENT variable.
      # Keep this explicit value aligned with the protected job environment.
      GITHUB_ENVIRONMENT: sol-atlas-gcs-qualification

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify checked-out source and workflow commits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$GITHUB_WORKFLOW_SHA"
          workflow_claim_spec="$GITHUB_WORKFLOW_SHA:.github/workflows/qualify-gcs.yml"
          workflow_at_claim="$(git rev-parse "$workflow_claim_spec")"
          workflow_at_checkout="$(git rev-parse "HEAD:.github/workflows/qualify-gcs.yml")"
          test "$workflow_at_claim" = "$workflow_at_checkout"

      - name: Verify workflow action pins
        run: python3 scripts/verify_github_actions_pins.py

      - name: Validate qualification configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT \
            GCS_QUALIFICATION_BUCKET
          do
            if [ -z "${!value}" ]; then
              echo "::error::$value is not configured"
              exit 1
            fi
          done

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "586.0.0"
      - name: Verify GitHub OIDC claims
        env:
          EXPECTED_OIDC_AUDIENCE: >-
            https://iam.googleapis.com/${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/verify_github_oidc_claims.py \
            --audience "$EXPECTED_OIDC_AUDIENCE" \
            --output artifacts/github-oidc-claims.json \
            --token-output "$RUNNER_TEMP/sol-atlas-github-oidc-token.jwt"


      - name: Create WIF credential configuration from verified OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/sol-atlas-github-oidc-token.jwt"
          rm -f "$RUNNER_TEMP/sol-atlas-gcp-credentials.json"
          gcloud iam workload-identity-pools create-cred-config \
            "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
            --service-account="$GCP_SERVICE_ACCOUNT" \
            --subject-token-type="urn:ietf:params:oauth:token-type:jwt" \
            --credential-source-file="$RUNNER_TEMP/sol-atlas-github-oidc-token.jwt" \
            --output-file="$RUNNER_TEMP/sol-atlas-gcp-credentials.json"
          test -s "$RUNNER_TEMP/sol-atlas-gcp-credentials.json"
          chmod 600 "$RUNNER_TEMP/sol-atlas-gcp-credentials.json"

      - name: Verify exact WIF credential binding
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_gcs_wif_credential_config.py \
            --config "$RUNNER_TEMP/sol-atlas-gcp-credentials.json" \
            --token-file "$RUNNER_TEMP/sol-atlas-github-oidc-token.jwt" \
            --oidc-claims artifacts/github-oidc-claims.json \
            --provider-resource "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
            --service-account "$GCP_SERVICE_ACCOUNT" \
            --output artifacts/gcs-wif-credential-config-verification.json
      - name: Authenticate to Google Cloud with verified token
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth login \
            --cred-file="$RUNNER_TEMP/sol-atlas-gcp-credentials.json"
          gcloud config set project "$GCP_PROJECT_ID"
      - name: Verify caller identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID"

      - name: Verify effective GCS WIF trust policy
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/verify_gcs_wif_provider.py \
            --provider-resource "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
            --project-id "$GCP_PROJECT_ID" \
            --service-account "$GCP_SERVICE_ACCOUNT" \
            --output artifacts/gcs-wif-trust-verification.json

      - name: Run live GCS qualification
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/qualify_gcs_external_effect.py \
            qualify \
            --bucket "$GCS_QUALIFICATION_BUCKET" \
            --wif-verification artifacts/gcs-wif-trust-verification.json \
            --oidc-claims artifacts/github-oidc-claims.json \
            --wif-credential-config-verification \
              artifacts/gcs-wif-credential-config-verification.json \
            --output artifacts/gcs-external-effect-report.json

      - name: Re-verify qualification artifact
        run: |
          set -euo pipefail
          python3 scripts/qualify_gcs_external_effect.py \
            verify \
            --report artifacts/gcs-external-effect-report.json

      - name: Remove transient OIDC credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "$RUNNER_TEMP/sol-atlas-github-oidc-token.jwt" \
            "$RUNNER_TEMP/sol-atlas-gcp-credentials.json"
          rm -rf "$CLOUDSDK_CONFIG"
      - name: Upload qualification evidence
        id: upload_evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sol-atlas-gcs-external-effect-qualification
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Attest qualification artifact provenance
        if: ${{ success() }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/gcs-external-effect-report.json


  publish:
    name: Re-verify qualification evidence
    needs: qualify
    if: ${{ needs.qualify.result == "success" }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download qualification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.qualify.outputs.artifact_id }}
          path: artifacts/
          digest-mismatch: error

      - name: Re-verify qualification artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualify_gcs_external_effect.py \
            verify \
            --report artifacts/gcs-external-effect-report.json

      - name: Verify GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify \
            artifacts/gcs-external-effect-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow \
              "$GITHUB_REPOSITORY/.github/workflows/qualify-gcs.yml" \
            --signer-digest "$GITHUB_WORKFLOW_SHA" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --cert-oidc-issuer \
              "https://token.actions.githubusercontent.com"

