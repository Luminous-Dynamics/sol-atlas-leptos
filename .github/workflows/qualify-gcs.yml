name: Qualify GCS external effect

on:
  workflow_dispatch:

concurrency:
  group: sol-atlas-gcs-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Live GCS qualification
    runs-on: ubuntu-latest
    environment: sol-atlas-gcs-qualification
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GCP_PROJECT_ID: ${{ vars.SOL_ATLAS_GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.SOL_ATLAS_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.SOL_ATLAS_GCP_SERVICE_ACCOUNT }}
      GCS_QUALIFICATION_BUCKET: ${{ vars.SOL_ATLAS_GCS_QUALIFICATION_BUCKET }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate qualification configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            GCP_PROJECT_ID \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_SERVICE_ACCOUNT \
            GCS_QUALIFICATION_BUCKET
          do
            if [ -z "${!value}" ]; then
              echo "::error::$value is not configured"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 363.0.0"

      - name: Verify caller identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          test "$(gcloud config get-value project)" = "$GCP_PROJECT_ID"

      - name: Verify effective GCS WIF trust policy
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/verify_gcs_wif_provider.py \
            --provider-resource "$GCP_WORKLOAD_IDENTITY_PROVIDER" \
            --output artifacts/gcs-wif-trust-verification.json

      - name: Run live GCS qualification
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/qualify_gcs_external_effect.py \
            qualify \
            --bucket "$GCS_QUALIFICATION_BUCKET" \
            --wif-verification artifacts/gcs-wif-trust-verification.json \
            --output artifacts/gcs-external-effect-report.json

      - name: Re-verify qualification artifact
        run: |
          set -euo pipefail
          python3 scripts/qualify_gcs_external_effect.py \
            verify \
            --report artifacts/gcs-external-effect-report.json

      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sol-atlas-gcs-external-effect-qualification
          path: artifacts/gcs-external-effect-report.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Attest qualification artifact provenance
        if: ${{ success() }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/gcs-external-effect-report.json
