name: SA economic portfolio oracle

on:
  pull_request:
    paths:
      - "tools/sa-economic-portfolio-oracle/**"
      - "docs/research/SA-ECONOMIC-PORTFOLIO-001.md"
      - "docs/research/fixtures/sa-economic-portfolio-v0.1*"
      - "docs/research/fixtures/sa-economic-portfolio-v0.2*"
      - "docs/research/schemas/sa-economic-portfolio-v0.1.schema.json"
      - "docs/research/schemas/sa-economic-portfolio-v0.2.schema.json"
      - ".github/workflows/sa-economic-portfolio-oracle.yml"
  push:
    branches: [main]
    paths:
      - "tools/sa-economic-portfolio-oracle/**"
      - "docs/research/SA-ECONOMIC-PORTFOLIO-001.md"
      - "docs/research/fixtures/sa-economic-portfolio-v0.1*"
      - "docs/research/fixtures/sa-economic-portfolio-v0.2*"
      - "docs/research/schemas/sa-economic-portfolio-v0.1.schema.json"
      - "docs/research/schemas/sa-economic-portfolio-v0.2.schema.json"
      - "docs/research/SA-PORTFOLIO-SCALE-001.md"

permissions:
  contents: read

jobs:
  exact-synthetic-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Install Rust formatting and lint components
        run: rustup component add rustfmt clippy --toolchain 1.96.0

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml --all-targets -- -D warnings

      - name: Run reference oracle tests
        run: cargo test --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml

      - name: Produce v0.1 known-answer receipt
        run: cargo run --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml > sa-economic-portfolio-v0.1-receipt.json

      - name: Produce v0.2 known-answer receipt
        run: >-
          cargo run --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml --
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.json
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.expected.json
          > sa-economic-portfolio-v0.2-receipt.json

      - name: Produce v0.2 ten-project frontier-search receipt
        run: >-
          cargo run --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml -- --search
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.json
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.expected.json
          > sa-economic-portfolio-v0.2-search-receipt.json

      - name: Produce v0.2 24-project adversarial search receipt
        run: >-
          cargo run --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml -- --search
          docs/research/fixtures/sa-economic-portfolio-v0.2-24-project.json
          docs/research/fixtures/sa-economic-portfolio-v0.2-24-project.search-expected.json
          > sa-economic-portfolio-v0.2-24-search-receipt.json

      - name: Build optimized benchmark binary
        run: cargo build --release --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml

      - name: Compare exact enumeration and search on ten-project fixture
        run: >-
          cargo run --release --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml --
          --compare-bench
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.json
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.expected.json
          21 > sa-economic-portfolio-v0.2-comparison-benchmark.json

      - name: Measure 24-project adversarial search (21 repetitions)
        run: >-
          cargo run --release --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml --
          --bench-search
          docs/research/fixtures/sa-economic-portfolio-v0.2-24-project.json
          docs/research/fixtures/sa-economic-portfolio-v0.2-24-project.search-expected.json
          21 > sa-economic-portfolio-v0.2-24-search-benchmark.json

      - name: Preserve receipts and benchmark distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa-economic-portfolio-receipts-and-benchmarks
          path: |
            sa-economic-portfolio-v0.1-receipt.json
            sa-economic-portfolio-v0.2-receipt.json
            sa-economic-portfolio-v0.2-search-receipt.json
            sa-economic-portfolio-v0.2-24-search-receipt.json
            sa-economic-portfolio-v0.2-comparison-benchmark.json
            sa-economic-portfolio-v0.2-24-search-benchmark.json
          if-no-files-found: ignore
