name: SA economic portfolio oracle

on:
  pull_request:
    paths:
      - "tools/sa-economic-portfolio-oracle/**"
      - "docs/research/SA-ECONOMIC-PORTFOLIO-001.md"
      - "docs/research/fixtures/sa-economic-portfolio-v0.1*"
      - "docs/research/fixtures/sa-economic-portfolio-v0.2*"
      - "docs/research/schemas/sa-economic-portfolio-v0.1.schema.json"
      - "docs/research/schemas/sa-economic-portfolio-v0.2.schema.json"
      - ".github/workflows/sa-economic-portfolio-oracle.yml"
  push:
    branches: [main]
    paths:
      - "tools/sa-economic-portfolio-oracle/**"
      - "docs/research/SA-ECONOMIC-PORTFOLIO-001.md"
      - "docs/research/fixtures/sa-economic-portfolio-v0.1*"
      - "docs/research/fixtures/sa-economic-portfolio-v0.2*"
      - "docs/research/schemas/sa-economic-portfolio-v0.1.schema.json"
      - "docs/research/schemas/sa-economic-portfolio-v0.2.schema.json"
      - "docs/research/SA-PORTFOLIO-SCALE-001.md"

permissions:
  contents: read

jobs:
  exact-synthetic-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"

      - name: Install Rust formatting and lint components
        run: rustup component add rustfmt clippy --toolchain 1.96.0

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml --all-targets -- -D warnings

      - name: Run reference oracle tests
        run: cargo test --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml

      - name: Produce v0.1 known-answer receipt
        run: cargo run --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml > sa-economic-portfolio-v0.1-receipt.json

      - name: Produce v0.2 known-answer receipt
        run: >-
          cargo run --manifest-path tools/sa-economic-portfolio-oracle/Cargo.toml --
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.json
          docs/research/fixtures/sa-economic-portfolio-v0.2-10-project.expected.json
          > sa-economic-portfolio-v0.2-receipt.json

      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa-economic-portfolio-receipts
          path: |
            sa-economic-portfolio-v0.1-receipt.json
            sa-economic-portfolio-v0.2-receipt.json
          if-no-files-found: ignore
