name: TIB property-state transition harness

on:
  push:
    branches:
      - research/tib-state-transition-harness-v0.1
    paths:
      - "benchmarks/territorial-integrity/tib-property-state-transitions-v0.1.json"
      - "tools/tib-state-transition-harness/**"
      - ".github/workflows/tib-state-transition-harness.yml"
  pull_request:
    branches: [main]
    paths:
      - "benchmarks/territorial-integrity/tib-property-state-transitions-v0.1.json"
      - "tools/tib-state-transition-harness/**"
      - ".github/workflows/tib-state-transition-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tib-transition-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  exact-head-transition-corpus:
    name: Exact-head TIB property-state transition corpus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          persist-credentials: false

      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "${QUALIFIED_SHA}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Assert pinned toolchain
        run: |
          test "$(rustc --version | awk '{print $2}')" = "1.96.1"
          cargo --version
          rustfmt --version

      - name: Check formatting
        run: cargo fmt --manifest-path tools/tib-state-transition-harness/Cargo.toml --all -- --check

      - name: Execute transition corpus
        run: cargo test --manifest-path tools/tib-state-transition-harness/Cargo.toml

      - name: Run strict Clippy
        run: cargo clippy --manifest-path tools/tib-state-transition-harness/Cargo.toml --all-targets -- -D warnings
