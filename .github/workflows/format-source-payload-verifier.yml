name: Normalize source payload verifier Rust formatting

on:
  push:
    branches:
      - research/built-environment-payload-byte-verifier-v0-1
    paths:
      - "sol-atlas-core/src/source_payload_verifier.rs"
      - "sol-atlas-core/src/lib.rs"
      - ".github/workflows/format-source-payload-verifier.yml"

permissions:
  contents: write

concurrency:
  group: source-payload-verifier-rustfmt
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Normalize new verifier sources
        run: |
          set -euo pipefail
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sol-atlas-core/src/source_payload_verifier.rs sol-atlas-core/src/lib.rs
          if git diff --cached --quiet; then
            echo "Verifier sources already formatted"
          else
            git commit -m "style: format source payload verifier"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          cargo fmt --manifest-path sol-atlas-core/Cargo.toml --check
