name: IEAC Invalidation Identity Compatibility Synthetic Oracle

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/ieac-invalidation-identity-compat-bench/**"
      - "docs/research/ieac-identity-compat/**"
      - "schemas/industry-assurance-dependency-graph-v0.2.schema.json"
      - "schemas/industry-assurance-invalidation-event-v0.2.schema.json"
      - "schemas/industry-assurance-impact-report-v0.2.schema.json"
      - ".github/workflows/ieac-invalidation-identity-compat.yml"
  push:
    branches: ["main", "research/ieac-invalidation-event-impact-v0.2"]
    paths:
      - "tools/ieac-invalidation-identity-compat-bench/**"
      - "docs/research/ieac-identity-compat/**"
      - "schemas/industry-assurance-dependency-graph-v0.2.schema.json"
      - "schemas/industry-assurance-invalidation-event-v0.2.schema.json"
      - "schemas/industry-assurance-impact-report-v0.2.schema.json"
      - ".github/workflows/ieac-invalidation-identity-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ieac-invalidation-identity-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  identity-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Check package formatting
        run: cargo fmt --manifest-path tools/ieac-invalidation-identity-compat-bench/Cargo.toml --all -- --check
      - name: Run frozen compatibility and negative controls
        run: cargo test --locked --manifest-path tools/ieac-invalidation-identity-compat-bench/Cargo.toml
      - name: Run strict Clippy
        run: cargo clippy --locked --manifest-path tools/ieac-invalidation-identity-compat-bench/Cargo.toml --all-targets -- -D warnings
      - name: Emit exact-head compatibility receipt
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "${{ github.event.pull_request.head.sha || github.sha }}"
          cargo run --locked --quiet --manifest-path tools/ieac-invalidation-identity-compat-bench/Cargo.toml -- \
            docs/research/ieac-identity-compat/IEAC_INVALIDATION_IDENTITY_COMPAT_CORPUS_V0_1.json \
            docs/research/ieac-identity-compat/IEAC_INVALIDATION_IDENTITY_COMPAT_CORPUS_V0_1.schema.json \
            schemas/industry-assurance-dependency-graph-v0.2.schema.json \
            schemas/industry-assurance-invalidation-event-v0.2.schema.json \
            schemas/industry-assurance-impact-report-v0.2.schema.json \
            --source-commit "$source_commit" > ieac-invalidation-identity-compat-receipt.json
          jq -e '
            .result == "pass"
            and .corpus_id == "IEAC-INVALIDATION-IDENTITY-COMPAT-CORPUS-V0.1"
            and .scenario_count == 25
            and .failure_count == 0
            and (.corpus_sha256 | test("^[0-9a-f]{64}$"))
            and (.corpus_schema_sha256 | test("^[0-9a-f]{64}$"))
            and (.graph_schema_sha256 | test("^[0-9a-f]{64}$"))
            and (.event_schema_sha256 | test("^[0-9a-f]{64}$"))
            and (.report_schema_sha256 | test("^[0-9a-f]{64}$"))
            and (.source_commit | test("^[0-9a-f]{40}$"))
            and .native_identity_recomputed == true
            and .artifact_content_digest_recomputed_as_node_identity == false
            and .issuer_authentication == "not_performed"
            and .scitt_authentication == "not_performed"
            and .action_authority == "none"
            and .claim_ceiling == "synthetic_identity_content_compatibility_only"
            and (.scenarios | length == 25)
            and (.scenarios | all(.status == "pass"))
          ' ieac-invalidation-identity-compat-receipt.json
      - name: Upload exact-head compatibility receipt
        uses: actions/upload-artifact@v4
        with:
          name: ieac-invalidation-identity-compat-reference-receipt
          path: ieac-invalidation-identity-compat-receipt.json
          if-no-files-found: error
          retention-days: 90
