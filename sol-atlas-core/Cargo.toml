[package]
name = "sol-atlas-core"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Shared types, geo math, and constants for Sol Atlas renderers"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
h3o = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
mycelix-core-types = { git = "https://github.com/Luminous-Dynamics/mycelix.git", rev = "54d57e5f6163f6e4a248e62da1a14cb6bbb7ccd7", default-features = false, features = ["serde"] }
